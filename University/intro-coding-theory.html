<style>
  :root{
    --ink:#10182B;
    --ink-2:#1B2740;
    --ink-3:#26335A;
    --paper:#ECE8DC;
    --paper-2:#DFDACB;
    --muted:#9BA3BE;
    --muted-2:#6b7390;
    --amber:#E3A63E;
    --amber-dim:#7a5b22;
    --teal:#3F9C8C;
    --teal-dim:#1f4a43;
    --brick:#C4483C;
    --brick-dim:#5c2119;
    --ink-text:#1B2233;
    --ink-text-muted:#565C71;
    --radius-s:4px;
    --radius-m:6px;
    --font-display:'Space Grotesk','Noto Sans Thai',sans-serif;
    --font-body:'Source Serif 4','Noto Serif Thai',serif;
    --font-mono:'IBM Plex Mono','Noto Sans Thai',monospace;
    --content-w:700px;
    --wide-w:900px;
    --rail-w:230px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-body);
    font-size:1.05rem;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
    overflow-wrap:break-word;
  }
  h1,h2,h3{
    font-family:var(--font-display);
    font-weight:600;
    line-height:1.25;
    margin:0 0 1rem 0;
    color:var(--paper);
  }
  h1{font-size:clamp(1.9rem,1.4rem + 2.2vw,3rem); font-weight:700;}
  h2{font-size:clamp(1.45rem,1.2rem + 1.1vw,2.05rem);}
  p{margin:0 0 1.1rem 0;}
  a{color:var(--amber);}
  ul,ol{margin:0 0 1.1rem 0; padding-left:1.3rem;}
  li{margin-bottom:.35rem;}
  code, .mono{font-family:var(--font-mono);}
  strong{color:var(--paper); font-weight:600;}

  ::selection{background:var(--amber); color:var(--ink);}

  :focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

  button{font-family:var(--font-display); cursor:pointer;}

  /* ---------- language toggle ---------- */
  .lang-toggle{
    position:fixed; top:10px; left:12px; z-index:60;
    display:flex; gap:2px;
    background:rgba(16,24,43,.92);
    border:1px solid rgba(236,232,220,.2);
    border-radius:20px;
    padding:3px;
  }
  .lang-btn{
    font-family:var(--font-display);
    font-size:.72rem;
    padding:.32rem .65rem;
    border-radius:16px;
    border:none;
    background:transparent;
    color:var(--muted);
    transition:background .15s ease, color .15s ease;
  }
  .lang-btn.is-active{background:var(--amber); color:var(--ink); font-weight:600;}

  /* ---------- layout shells ---------- */
  main{position:relative; z-index:1;}
  .section{
    padding:5.5rem 1.5rem;
    border-bottom:1px solid rgba(236,232,220,0.08);
  }
  .section:last-of-type{border-bottom:none;}
  .section-inner{max-width:var(--content-w); margin:0 auto;}
  .section-inner.wide{max-width:var(--wide-w);}
  .lede{font-size:1.15rem; color:var(--paper); max-width:65ch;}
  .sub{color:var(--muted); max-width:65ch;}

  @media (min-width:1100px){
    body{padding-left:var(--rail-w);}
  }

  /* ---------- rail (desktop signal path nav) ---------- */
  .railwire{
    display:none;
  }
  @media (min-width:1100px){
    .railwire{
      display:block;
      position:fixed;
      left:0; top:0; bottom:0;
      width:var(--rail-w);
      padding:4.4rem 0 3rem 2.6rem;
      overflow-y:auto;
    }
    .railwire::before{
      content:"";
      position:absolute;
      top:4.6rem; bottom:3.2rem; left:2.9rem;
      width:2px;
      background:linear-gradient(to bottom, transparent, rgba(227,166,62,.35) 6%, rgba(227,166,62,.35) 94%, transparent);
    }
    .rail-node{
      position:relative;
      display:block;
      width:100%;
      text-align:left;
      background:none;
      border:none;
      color:var(--muted);
      font-size:.85rem;
      letter-spacing:.01em;
      padding:.6rem 0 .6rem 1.1rem;
      margin-bottom:.15rem;
      line-height:1.35;
      transition:color .2s ease;
    }
    .rail-node::before{
      content:"";
      position:absolute;
      left:-.35rem; top:1.1rem;
      width:8px; height:8px;
      border-radius:50%;
      background:var(--ink-3);
      border:2px solid var(--ink);
      transition:background .2s ease, box-shadow .2s ease;
    }
    .rail-node:hover{color:var(--paper);}
    .rail-node.is-active{color:var(--paper); font-weight:500;}
    .rail-node.is-active::before{
      background:var(--amber);
      box-shadow:0 0 0 4px rgba(227,166,62,.18);
    }
  }

  /* ---------- mobile top progress ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; height:3px;
    background:rgba(236,232,220,0.08);
    z-index:50;
  }
  @media (min-width:1100px){ .topbar{display:none;} }
  .topbar-fill{
    height:100%; width:0%;
    background:var(--amber);
    transition:width .1s linear;
  }
  .current-section-pill{
    position:fixed; top:10px; right:12px;
    font-family:var(--font-mono);
    font-size:.7rem;
    color:var(--muted);
    background:rgba(16,24,43,.85);
    border:1px solid rgba(236,232,220,.15);
    padding:.32rem .6rem;
    border-radius:20px;
    z-index:50;
    pointer-events:none;
    max-width:46vw;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  @media (min-width:1100px){ .current-section-pill{display:none;} }

  /* ---------- hero ---------- */
  .hero{
    padding-top:7rem;
    border-bottom:1px solid rgba(236,232,220,0.08);
  }
  .hero-anim{
    margin:2.6rem auto 1rem auto;
    max-width:var(--wide-w);
    display:flex; align-items:center; gap:1rem;
  }
  .hero-node{
    font-family:var(--font-mono);
    font-size:.75rem;
    color:var(--muted);
    border:1px solid rgba(236,232,220,.2);
    border-radius:var(--radius-s);
    padding:.5rem .8rem;
    white-space:nowrap;
  }
  .hero-wire{
    position:relative;
    flex:1;
    height:2px;
    background:rgba(236,232,220,.18);
  }
  .hero-dot{
    position:absolute; top:50%; left:0;
    width:10px; height:10px; margin-top:-5px;
    border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 10px 2px rgba(227,166,62,.5);
    animation:travel 3.6s ease-in-out infinite;
  }
  @keyframes travel{
    0%{left:0%;}
    45%{left:100%;}
    50%{left:100%;}
    95%{left:0%;}
    100%{left:0%;}
  }
  .hero-caption{color:var(--muted); font-size:.9rem; max-width:var(--wide-w); margin:0 auto;}
  @media (prefers-reduced-motion:reduce){
    .hero-dot{animation:none; left:48%;}
    html{scroll-behavior:auto;}
  }

  /* ---------- legend ---------- */
  .legend{
    display:flex; flex-wrap:wrap; gap:1.4rem;
    margin:0 0 1.6rem 0;
    font-size:.85rem; color:var(--muted);
    font-family:var(--font-mono);
  }
  .legend-item{display:flex; align-items:center; gap:.5rem;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block; flex:none;}
  .dot.amber{background:var(--amber);}
  .dot.teal{background:var(--teal);}
  .dot.brick{background:var(--brick);}

  /* ---------- cards / panels ---------- */
  .panel{
    background:var(--ink-2);
    border:1px solid rgba(236,232,220,.08);
    border-radius:var(--radius-m);
    padding:1.6rem;
    margin:1.6rem 0;
  }
  .panel-title{
    font-family:var(--font-mono);
    font-size:.8rem;
    color:var(--muted);
    margin-bottom:1rem;
  }

  .msg-row{display:flex; flex-wrap:wrap; gap:.6rem; margin-bottom:1.3rem;}
  .msg-btn{
    background:transparent;
    border:1px solid rgba(236,232,220,.25);
    color:var(--paper);
    padding:.55rem 1rem;
    border-radius:20px;
    font-size:.85rem;
    transition:border-color .15s ease, background .15s ease;
  }
  .msg-btn:hover{border-color:var(--amber);}
  .msg-btn.is-selected{background:var(--amber); border-color:var(--amber); color:var(--ink); font-weight:600;}

  .bits-row{display:flex; flex-wrap:wrap; gap:.5rem; margin:.8rem 0;}
  .bitcell{
    font-family:var(--font-mono);
    font-weight:600;
    font-size:1.3rem;
    width:2.9rem; height:2.9rem;
    display:flex; align-items:center; justify-content:center;
    border-radius:var(--radius-s);
    border:1px solid rgba(236,232,220,.25);
    background:var(--ink);
    color:var(--paper);
    transition:transform .1s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  button.bitcell:hover{border-color:var(--amber); transform:translateY(-1px);}
  button.bitcell:active{transform:translateY(0);}
  .bitcell.is-one{background:var(--ink-3); color:var(--amber);}
  .bitcell.is-display{width:1.9rem; height:1.9rem; font-size:.95rem; cursor:default;}
  .bitcell.is-display:hover{border-color:rgba(236,232,220,.25); transform:none;}

  .code-block{
    display:grid;
    grid-template-columns:repeat(3,auto);
    gap:2px;
    background:var(--ink);
    padding:.4rem;
    border-radius:var(--radius-s);
    border:1px solid rgba(236,232,220,.12);
    width:max-content;
  }

  .btn-row{display:flex; flex-wrap:wrap; gap:.6rem; margin:1rem 0;}
  .btn{
    font-size:.85rem;
    padding:.6rem 1.1rem;
    border-radius:var(--radius-s);
    border:1px solid transparent;
    transition:filter .15s ease, transform .1s ease;
    font-family:var(--font-display);
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--amber); color:var(--ink); font-weight:600;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; color:var(--paper); border-color:rgba(236,232,220,.3);}
  .btn-ghost:hover{border-color:var(--amber); color:var(--amber);}

  .status{
    border-left:4px solid var(--muted-2);
    background:rgba(236,232,220,.03);
    padding:.9rem 1.1rem;
    border-radius:0 var(--radius-s) var(--radius-s) 0;
    font-size:.98rem;
    color:var(--paper);
    margin-top:1rem;
  }
  .status .k{font-family:var(--font-mono); font-size:.8rem; color:var(--muted); display:block; margin-bottom:.3rem;}
  .status.ok{border-color:var(--teal);}
  .status.error{border-color:var(--brick);}
  .status.warn{border-color:var(--amber);}

  /* ---------- letter tables ---------- */
  .letter-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
    gap:.55rem;
  }
  .letter-tile{
    background:var(--paper);
    color:var(--ink-text);
    border-radius:var(--radius-s);
    padding:.65rem .5rem;
    text-align:center;
  }
  .letter-tile .L{
    font-family:var(--font-display);
    font-weight:700;
    font-size:1.15rem;
    display:block;
  }
  .letter-tile .C{
    font-family:var(--font-mono);
    font-size:.72rem;
    letter-spacing:.02em;
    color:var(--ink-text-muted);
    display:block;
    margin-top:.25rem;
    word-break:break-all;
  }

  .mini-table{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(70px,1fr));
    gap:.5rem;
    margin:1.2rem 0;
  }
  .mini-tile{
    background:var(--paper);
    color:var(--ink-text);
    border-radius:var(--radius-s);
    text-align:center;
    padding:.5rem .3rem;
  }
  .mini-tile .n{font-family:var(--font-display); font-weight:700;}
  .mini-tile .c{font-family:var(--font-mono); font-size:.75rem; color:var(--ink-text-muted); display:block;}

  /* ---------- challenge ---------- */
  .challenge-row{
    display:flex; flex-wrap:wrap; gap:1.1rem;
    margin:1.5rem 0;
  }
  .challenge-unit{display:flex; flex-direction:column; align-items:center; gap:.5rem;}
  .letter-input{
    width:2.9rem; height:2.9rem;
    text-align:center;
    font-family:var(--font-mono);
    font-size:1.2rem;
    text-transform:uppercase;
    border-radius:var(--radius-s);
    border:1px solid rgba(236,232,220,.3);
    background:var(--ink);
    color:var(--paper);
  }
  .letter-input.correct{border-color:var(--teal); background:rgba(63,156,140,.15); color:var(--teal);}
  .letter-input.incorrect{border-color:var(--brick); background:rgba(196,72,60,.15); color:var(--brick);}

  /* ---------- footer ---------- */
  footer{
    padding:4rem 1.5rem 5rem 1.5rem;
    max-width:var(--content-w);
    margin:0 auto;
    color:var(--muted);
    font-size:.95rem;
  }
  footer .credit{margin-top:1.6rem; font-size:.8rem; color:var(--muted-2); font-family:var(--font-mono);}

  small.note{display:block; margin-top:.6rem; color:var(--muted); font-size:.85rem;}
</style>
</head>

  var META = {
    en:{ title:"Introduction to Coding Theory", desc:"An interactive introduction to coding theory: silent errors, parity codes, and self-correcting Hamming codes." },
    th:{ title:"ความรู้เบื้องต้นเกี่ยวกับทฤษฎีการเข้ารหัส", desc:"บทเรียนเชิงโต้ตอบเกี่ยวกับทฤษฎีการเข้ารหัส ตั้งแต่ข้อผิดพลาดที่ตรวจไม่พบ รหัสพาริตี ไปจนถึงรหัสแฮมมิงที่แก้ไขตัวเองได้" }
  };

  function t(key, vars){
    var s = (I18N[LANG] && I18N[LANG][key] !== undefined) ? I18N[LANG][key] : key;
    if(vars){
      Object.keys(vars).forEach(function(k){
        s = s.split("{"+k+"}").join(vars[k]);
      });
    }
    return s;
  }

  var RERENDER = [];

  function applyStaticText(){
    document.querySelectorAll("[data-i18n]").forEach(function(el){

    if(titleEl) titleEl.textContent = META[LANG].title;
    document.title = META[LANG].title;
    if(descEl) descEl.setAttribute("content", META[LANG].desc);
    document.documentElement.lang = LANG;
  }

  function applyLanguage(lang){
    LANG = lang;
    applyStaticText();
    document.querySelectorAll(".lang-btn").forEach(function(b){
      b.classList.toggle("is-active", b.getAttribute("data-lang")===LANG);
    });
    RERENDER.forEach(function(fn){ fn(); });
  }

  /* ============ data ============ */
  var CODES8 = {
    A:"10000001", B:"10000010", C:"11000011", D:"10000100", E:"11000101",
    F:"11000110", G:"10000111", H:"10001000", I:"11001001", J:"11001010",
    K:"10001011", L:"11001100", M:"10001101", N:"10001110", O:"11001111",
    P:"10010000", Q:"11010001", R:"11010010", S:"10010011", T:"11010100",
    U:"10010101", V:"10010110", W:"11010111", X:"11011000", Y:"10011001",
    Z:"10011010"
  };

  var CODES9 = {
    A:"000000000", B:"000011001", C:"000101110", D:"000110111", E:"001000110",
    F:"001011111", G:"001101000", H:"001110001", I:"010001010", J:"010010011",
    K:"010100100", L:"010111101", M:"011001100", N:"011010101", O:"011100010",
    P:"011111011", Q:"100001100", R:"100010101", S:"100100010", T:"100111011",
    U:"101001010", V:"101010011", W:"101100100", X:"101111101", Y:"110000110",
    Z:"110011111"
  };

  var TABLE2 = {"00":"milktea","01":"tea","10":"milk","11":"coffee"};
  var TABLE3 = {"000":"milktea","011":"tea","101":"milk","110":"coffee"};
  var MESSAGES = [
    {key:"milktea", c2:"00", c3:"000"},
    {key:"tea",     c2:"01", c3:"011"},
    {key:"milk",    c2:"10", c3:"101"},
    {key:"coffee",  c2:"11", c3:"110"}
  ];

  var CHALLENGE_WORDS = ["CODE","BYTE","DATA","WORD","MATH","STAR","MOON","BOOK","TREE","FISH","BIRD","GAME","WAVE","CHIP","DISK","ROBOT","PIXEL","RADIO","MORSE","LASER"];

  /* ============ helpers ============ */
  function hamming(a,b){
    var d=0;
    for(var i=0;i<a.length;i++){ if(a[i]!==b[i]) d++; }
    return d;
  }
  function nearest(str,dict){
    var min=Infinity, matches=[];
    for(var k in dict){
      var d=hamming(str,dict[k]);
      if(d<min){ min=d; matches=[k]; }
      else if(d===min){ matches.push(k); }
    }
    return {min:min, matches:matches};
  }
  function countOnes(bits){
    var n=0;
    for(var i=0;i<bits.length;i++){ if(bits[i]==="1") n++; }
    return n;
  }
  function randInt(n){ return Math.floor(Math.random()*n); }
  function randLetter(){
    var letters = Object.keys(CODES9);
    return letters[randInt(letters.length)];
  }

  function renderBits(container, bits, clickable){
    container.innerHTML="";
    bits.forEach(function(b, i){
      var cell = document.createElement(clickable ? "button" : "span");
      if(clickable) cell.type = "button";
      cell.className = "bitcell " + (b==="1" ? "is-one" : "is-zero");
      cell.textContent = b;
      cell.setAttribute("aria-pressed", b==="1");
      if(clickable){
        cell.addEventListener("click", function(){
          bits[i] = bits[i]==="1" ? "0" : "1";
          renderBits(container, bits, clickable);
          container.dispatchEvent(new CustomEvent("bitschange"));
        });
      }
      container.appendChild(cell);
    });
  }

  /* ============ Demo 1: two-bit silent error ============ */
  (function(){
    var msgRow = document.getElementById("msgRow2");
    var bitsEl = document.getElementById("bits2");
    var statusEl = document.getElementById("status2");
    var bits = ["0","0"];
    var selected = 0;

    function buildButtons(){
      msgRow.innerHTML="";
      MESSAGES.forEach(function(m, idx){
        var b = document.createElement("button");
        b.className = "msg-btn" + (idx===selected ? " is-selected" : "");
        b.type="button";
        b.textContent = DRINK_NAMES[LANG][m.key];
        b.addEventListener("click", function(){
          selected = idx;
          bits = m.c2.split("");
          buildButtons();
          render();
        });
        msgRow.appendChild(b);
      });
    }

    function render(){
      renderBits(bitsEl, bits, true);
      var str = bits.join("");
      var decodedKey = TABLE2[str];
      var decoded = DRINK_NAMES[LANG][decodedKey];
      statusEl.className = "status warn";
      statusEl.innerHTML = '<span class="k">'+t("demo_k",{str:str})+'</span>'+t("demo1_msg",{decoded:decoded});
    }

    bitsEl.addEventListener("bitschange", render);
    RERENDER.push(function(){ buildButtons(); render(); });
    buildButtons();
    render();
  })();

  /* ============ Demo 2: three-bit detection ============ */
  (function(){
    var msgRow = document.getElementById("msgRow3");
    var bitsEl = document.getElementById("bits3");
    var statusEl = document.getElementById("status3");
    var bits = ["0","0","0"];
    var selected = 0;

    function buildButtons(){
      msgRow.innerHTML="";
      MESSAGES.forEach(function(m, idx){
        var b = document.createElement("button");
        b.className = "msg-btn" + (idx===selected ? " is-selected" : "");
        b.type="button";
        b.textContent = DRINK_NAMES[LANG][m.key];
        b.addEventListener("click", function(){
          selected = idx;
          bits = m.c3.split("");
          buildButtons();
          render();
        });
        msgRow.appendChild(b);
      });
    }

    function render(){
      renderBits(bitsEl, bits, true);
      var str = bits.join("");
      var decodedKey = TABLE3[str];
      if(decodedKey){
        statusEl.className = "status ok";
        statusEl.innerHTML = '<span class="k">'+t("demo_k",{str:str})+'</span>'+t("demo2_ok",{decoded:DRINK_NAMES[LANG][decodedKey]});
      } else {
        var n = nearest(str, TABLE3);
        var names = n.matches.map(function(k){ return DRINK_NAMES[LANG][TABLE3[k]] + " (" + k + ")"; }).join(", ");
        statusEl.className = "status error";
        statusEl.innerHTML = '<span class="k">'+t("demo_k",{str:str})+'</span>'+t("demo2_err",{names:names});
      }
    }

    bitsEl.addEventListener("bitschange", render);
    RERENDER.push(function(){ buildButtons(); render(); });
    buildButtons();
    render();
  })();

  /* ============ BCD mini table ============ */
  (function(){
    var el = document.getElementById("bcdTable");
    for(var d=0; d<=9; d++){

  function buildLetterGrid(elId, dict){
    var el = document.getElementById(elId);
    Object.keys(dict).sort().forEach(function(letter){
      var tile = document.createElement("div");
      tile.className = "letter-tile";

      el.appendChild(tile);
    });

  buildLetterGrid("grid8", CODES8);
  buildLetterGrid("grid9", CODES9);

  /* ============ Machine 1: 8-bit parity checker ============ */
  (function(){
    var bitsEl = document.getElementById("bitsM1");
    var statusEl = document.getElementById("statusM1");
    var bits = "10000001".split(""); // start on a valid letter (A)

    function findLetter(str){
      for(var k in CODES8){ if(CODES8[k]===str) return k; }
      return null;
    }

    function render(){
      renderBits(bitsEl, bits, true);
      var str = bits.join("");
      var ones = countOnes(str);
      var kLabel = t("m1_k",{str:str, ones:ones});
      if(ones % 2 !== 0){
        statusEl.className = "status error";
        statusEl.innerHTML = '<span class="k">'+kLabel+'</span>'+t("m1_err_parity");
        return;
      }
      var letter = findLetter(str);
      if(letter){
        statusEl.className = "status ok";
        statusEl.innerHTML = '<span class="k">'+kLabel+'</span>'+t("m1_ok",{letter:letter});
      } else {
        var n = nearest(str, CODES8);
        statusEl.className = "status warn";
        statusEl.innerHTML = '<span class="k">'+kLabel+'</span>'+t("m1_warn",{matches:n.matches.join('", "'), min:n.min});
      }
    }

    bitsEl.addEventListener("bitschange", render);
    RERENDER.push(render);

    document.getElementById("btnLoad8").addEventListener("click", function(){
      bits = CODES8[randLetter()].split("");
      render();
    });
    document.getElementById("btnFlip8").addEventListener("click", function(){
      var i = randInt(bits.length);
      bits[i] = bits[i]==="1" ? "0" : "1";
      render();
    });

    render();
  })();

  /* ============ Machine 2: 9-bit Hamming decoder ============ */
  (function(){
    var bitsEl = document.getElementById("bitsM2");
    var statusEl = document.getElementById("statusM2");
    var bits = "000000000".split("");

    function render(){
      renderBits(bitsEl, bits, true);
      var str = bits.join("");
      var n = nearest(str, CODES9);
      if(n.min===0){
        statusEl.className = "status ok";
        statusEl.innerHTML = '<span class="k">'+str+'</span>'+t("m2_ok",{letter:n.matches[0]});
      } else if(n.min===1){
        statusEl.className = "status ok";
        statusEl.innerHTML = '<span class="k">'+str+'</span>'+t("m2_corrected",{letter:n.matches[0]});
      } else {
        statusEl.className = "status error";
        statusEl.innerHTML = '<span class="k">'+str+'</span>'+t("m2_ambiguous",{matches:n.matches.join('", "'), min:n.min});
      }
    }

    bitsEl.addEventListener("bitschange", render);
    RERENDER.push(render);

    document.getElementById("btnLoad9").addEventListener("click", function(){
      bits = CODES9[randLetter()].split("");
      render();
    });
    document.getElementById("btnFlip9").addEventListener("click", function(){
      var i = randInt(bits.length);
      bits[i] = bits[i]==="1" ? "0" : "1";
      render();
    });
    document.getElementById("btnClear9").addEventListener("click", function(){
      bits = "000000000".split("");
      render();
    });

    render();
  })();

  /* ============ Word challenge ============ */
  (function(){
    var row = document.getElementById("challengeRow");
    var title = document.getElementById("challengeTitle");
    var statusEl = document.getElementById("statusWord");
    var word = "";
    var lastWord = "";
    var inputs = [];
    var lastStatus = null; // null | 'correct' | 'incorrect' | 'reveal'

    function pickWord(){
      var w;
      do { w = CHALLENGE_WORDS[randInt(CHALLENGE_WORDS.length)]; }
      while(w===lastWord && CHALLENGE_WORDS.length>1);
      lastWord = w;
      return w;
    }

    function renderStatus(){
      if(lastStatus==="correct"){
        statusEl.className = "status ok";
        statusEl.textContent = t("chal_correct");
      } else if(lastStatus==="incorrect"){
        statusEl.className = "status error";
        statusEl.textContent = t("chal_incorrect");
      } else if(lastStatus==="reveal"){
        statusEl.className = "status warn";
        statusEl.textContent = t("chal_reveal",{word:word});
      } else {
        statusEl.className = "status";
        statusEl.textContent = "";
      }
    }

    function retranslate(){
      title.textContent = t("chal_wordlen",{n:word.length});
      inputs.forEach(function(inp, idx){
        inp.setAttribute("aria-label", t("chal_letter_aria",{n:idx+1}));
      });
      renderStatus();
    }

    function build(){
      word = pickWord();
      lastStatus = null;
      row.innerHTML = "";
      inputs = [];
      word.split("").forEach(function(letter, idx){
        var unit = document.createElement("div");
        unit.className = "challenge-unit";

        var block = document.createElement("div");
        block.className = "code-block";
        CODES9[letter].split("").forEach(function(b){
          var c = document.createElement("span");
          c.className = "bitcell is-display " + (b==="1" ? "is-one" : "is-zero");
          c.textContent = b;
          block.appendChild(c);
        });

        var input = document.createElement("input");
        input.className = "letter-input";
        input.maxLength = 1;
        input.autocomplete = "off";
        input.spellcheck = false;

        input.addEventListener("input", function(){
          input.value = input.value.toUpperCase().replace(/[^A-Z]/g, "");
          input.classList.remove("correct","incorrect");
          if(input.value && inputs[idx+1]) inputs[idx+1].focus();
        });
        input.addEventListener("keydown", function(e){
          if(e.key==="Backspace" && !input.value && inputs[idx-1]){
            inputs[idx-1].focus();
          }
        });

        unit.appendChild(block);
        unit.appendChild(input);
        row.appendChild(unit);
        inputs.push(input);
      });
      retranslate();
    }

    document.getElementById("btnCheckWord").addEventListener("click", function(){
      var allCorrect = true;
      inputs.forEach(function(inp, idx){
        var ok = inp.value.toUpperCase() === word[idx];
        inp.classList.toggle("correct", ok);
        inp.classList.toggle("incorrect", !ok && inp.value!=="");
        if(!ok) allCorrect = false;
      });
      lastStatus = allCorrect ? "correct" : "incorrect";
      renderStatus();
    });

    document.getElementById("btnRevealWord").addEventListener("click", function(){
      inputs.forEach(function(inp, idx){
        inp.value = word[idx];
        inp.classList.add("correct");
        inp.classList.remove("incorrect");
        inp.disabled = true;
      });
      lastStatus = "reveal";
      renderStatus();
    });

    document.getElementById("btnNewWord").addEventListener("click", build);

    RERENDER.push(retranslate);
    build();
  })();

  /* ============ rail nav + scroll progress ============ */
  (function(){
    var sections = Array.prototype.slice.call(document.querySelectorAll("main .section[data-rail-key]"));
    var rail = document.getElementById("railwire");
    var pill = document.getElementById("currentPill");
    var fill = document.getElementById("topbarFill");
    var activeKey = "start";

    sections.forEach(function(sec){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "rail-node";
      btn.dataset.target = sec.id;
      btn.dataset.key = sec.getAttribute("data-rail-key");
      btn.addEventListener("click", function(){
        sec.scrollIntoView({behavior:"smooth", block:"start"});
      });
      rail.appendChild(btn);
    });

    var railNodes = Array.prototype.slice.call(rail.querySelectorAll(".rail-node"));

    function refreshLabels(){
      railNodes.forEach(function(n){
        n.textContent = RAIL_LABELS[LANG][n.dataset.key];
      });
      if(pill) pill.textContent = RAIL_LABELS[LANG][activeKey];
    }

    function setActive(key){
      activeKey = key;
      railNodes.forEach(function(n){
        n.classList.toggle("is-active", n.dataset.key===key);
      });
      if(pill) pill.textContent = RAIL_LABELS[LANG][key];
    }

    if("IntersectionObserver" in window){
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if(entry.isIntersecting){
            setActive(entry.target.getAttribute("data-rail-key"));
          }
        });
      }, {rootMargin:"-45% 0px -50% 0px", threshold:0});
      sections.forEach(function(sec){ io.observe(sec); });
    }

    function updateProgress(){
      var doc = document.documentElement;
      var scrollTop = doc.scrollTop || document.body.scrollTop;
      var height = doc.scrollHeight - doc.clientHeight;
      var pct = height>0 ? (scrollTop/height)*100 : 0;
      if(fill) fill.style.width = pct + "%";
    }
    window.addEventListener("scroll", updateProgress, {passive:true});
    updateProgress();

    RERENDER.push(refreshLabels);
    refreshLabels();
  })();

  /* ============ language toggle wiring ============ */
  document.querySelectorAll(".lang-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      applyLanguage(btn.getAttribute("data-lang"));
    });
  });

  applyLanguage("th");

})();
</script>
