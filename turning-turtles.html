<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title id="doc-title">พลิกเต่า — เกมเลขฐานสองที่ซ่อนอยู่</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%A2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0c2624;
    --bg-deeper:#081b19;
    --bg-panel:#123836;
    --bg-panel-2:#16403d;
    --sand:#eee3c9;
    --sand-dim:#c9bd9f;
    --moss:#7fb069;
    --moss-deep:#4f7d45;
    --amber:#e9a23b;
    --amber-deep:#a86e1f;
    --yellow:#ffd447;
    --yellow-ink:#3a2b03;
    --teal-accent:#5fb3ac;
    --slate:#5c7c79;
    --ink:#08201e;
    --danger:#d97a6c;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-deep:0 18px 40px -14px rgba(0,0,0,0.55);
    --font-display:'Fraunces', 'Noto Serif Thai', Georgia, serif;
    --font-body:'Work Sans', 'Noto Sans Thai', system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', 'Courier New', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100%;
    font-family:var(--font-body);
    color:var(--sand);
    background:
      radial-gradient(ellipse 900px 500px at 20% -10%, rgba(127,176,105,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(95,179,172,0.14), transparent 55%),
      linear-gradient(180deg, var(--bg-deep), var(--bg-deeper) 60%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--amber); color:var(--ink); }

  button{ font-family:inherit; }
  button:focus-visible, summary:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--amber);
    outline-offset:2px;
  }

  .app-shell{
    max-width:760px;
    margin:0 auto;
    padding:20px 16px 64px;
  }

  /* ---------- header ---------- */
  .site-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    row-gap:12px;
    margin-bottom:22px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    font-size:34px;
    line-height:1;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.4));
    transform:translateY(-2px);
  }
  .brand h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(22px,5vw,32px);
    margin:0;
    letter-spacing:0.2px;
  }
  .brand p{
    margin:2px 0 0;
    font-size:13px;
    color:var(--sand-dim);
    letter-spacing:0.3px;
  }
  .header-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }

  .icon-btn{
    width:38px; height:38px;
    border-radius:50%;
    border:1px solid rgba(238,227,201,0.25);
    background:rgba(238,227,201,0.06);
    color:var(--sand);
    font-size:16px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease, background .15s ease;
  }
  .icon-btn:hover{ background:rgba(238,227,201,0.14); transform:translateY(-1px); }

  .lang-switch{
    display:flex;
    border:1px solid rgba(238,227,201,0.25);
    border-radius:999px;
    overflow:hidden;
    flex-shrink:0;
    height:38px;
  }
  .lang-btn{
    border:none;
    background:rgba(238,227,201,0.06);
    color:var(--sand-dim);
    font-family:var(--font-mono);
    font-size:12px;
    font-weight:700;
    letter-spacing:0.5px;
    padding:0 14px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .lang-btn:hover{ background:rgba(238,227,201,0.14); }
  .lang-btn.active{ background:var(--amber); color:var(--ink); }

  /* ---------- generic card / buttons ---------- */
  .card{
    background:linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid rgba(238,227,201,0.08);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-deep);
    padding:22px;
  }
  .card + .card{ margin-top:16px; }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--teal-accent);
    margin:0 0 8px;
  }
  .card h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:22px;
    margin:0 0 10px;
  }
  .card p{ color:var(--sand-dim); line-height:1.6; margin:0 0 12px; font-size:15px;}
  .card p:last-child{ margin-bottom:0; }

  .btn{
    font-weight:600;
    font-size:15px;
    padding:13px 18px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn:active{ transform:translateY(0); }
  .btn-primary{ background:var(--amber); color:var(--ink); box-shadow:0 8px 18px -8px rgba(233,162,59,0.6); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-moss{ background:var(--moss); color:var(--ink); box-shadow:0 8px 18px -8px rgba(127,176,105,0.55); }
  .btn-moss:hover{ filter:brightness(1.08); }
  .btn-ghost{
    background:transparent;
    color:var(--sand);
    border:1px solid rgba(238,227,201,0.3);
  }
  .btn-ghost:hover{ background:rgba(238,227,201,0.08); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:9px 14px; font-size:13px; }

  .choice-stack{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .choice-btn{
    text-align:left;
    background:rgba(238,227,201,0.05);
    border:1px solid rgba(238,227,201,0.14);
    border-radius:var(--radius-md);
    padding:16px 18px;
    color:var(--sand);
    cursor:pointer;
    display:flex; align-items:center; gap:14px;
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
    width:100%;
    font-family:inherit;
  }
  .choice-btn:hover{
    background:rgba(233,162,59,0.1);
    border-color:rgba(233,162,59,0.45);
    transform:translateY(-1px);
  }
  .choice-emoji{ font-size:24px; flex-shrink:0; }
  .choice-text{ text-align:left; }
  .choice-text strong{ display:block; font-size:15.5px; margin-bottom:2px; }
  .choice-text span{ font-size:13px; color:var(--sand-dim); }

  /* ---------- rules mini-list ---------- */
  .rule-steps{ list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .rule-steps li{
    display:flex; gap:12px; align-items:flex-start;
    font-size:14.5px; color:var(--sand-dim); line-height:1.55;
  }
  .rule-num{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink);
    background:var(--teal-accent);
    width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; margin-top:1px; font-weight:700;
  }
  .rule-steps b{ color:var(--sand); }

  /* ---------- status bar ---------- */
  .status-bar{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
    padding:12px 16px;
    border-radius:var(--radius-md);
    background:rgba(8,27,25,0.55);
    border:1px solid rgba(238,227,201,0.1);
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .status-turn{ display:flex; align-items:center; gap:10px; font-size:14.5px; }
  .status-dot{
    width:10px; height:10px; border-radius:50%;
    background:var(--moss);
    box-shadow:0 0 0 4px rgba(127,176,105,0.2);
    flex-shrink:0;
  }
  .status-dot.bot{ background:var(--amber); box-shadow:0 0 0 4px rgba(233,162,59,0.2); }
  .status-dot.over{ background:var(--sand-dim); box-shadow:none; }
  .status-turn strong{ font-family:var(--font-display); font-size:16px; font-weight:600; }
  .status-move{ font-family:var(--font-mono); font-size:12.5px; color:var(--sand-dim); }
  .thinking-dots span{ animation:blink 1.4s infinite; opacity:0.2; }
  .thinking-dots span:nth-child(2){ animation-delay:.2s; }
  .thinking-dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,100%{opacity:0.2;} 40%{opacity:1;} }

  .helper-text{
    font-size:13.5px;
    color:var(--sand-dim);
    margin:0 0 14px;
    padding:0 2px;
    min-height:18px;
    line-height:1.5;
  }
  .helper-text b{ color:var(--amber); }

  /* ---------- board ---------- */
  .board-wrap{
    background:
      radial-gradient(ellipse at 50% 0%, rgba(95,179,172,0.08), transparent 70%),
      rgba(8,27,25,0.4);
    border:1px solid rgba(238,227,201,0.08);
    border-radius:var(--radius-lg);
    padding:20px 14px 16px;
    margin-bottom:16px;
  }
  .board{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px 8px;
  }
  .coin-slot{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    width:64px;
  }
  .pos-label{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--sand-dim);
    letter-spacing:0.5px;
  }
  .coin{
    position:relative;
    width:56px; height:56px;
    border-radius:50%;
    border:none;
    cursor:default;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 30%, #6f9d5e, #3f6535 78%);
    box-shadow:inset 0 -4px 8px rgba(0,0,0,0.35), 0 6px 14px -6px rgba(0,0,0,0.5);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .coin.tails{
    background:radial-gradient(circle at 35% 30%, #587674, #2c433f 78%);
  }
  .coin .emoji{
    font-size:26px;
    display:block;
    transition:transform .3s ease, filter .3s ease;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,0.35));
  }
  .coin.tails .emoji{
    transform:rotate(165deg);
    filter:grayscale(0.55) brightness(0.82) drop-shadow(0 2px 2px rgba(0,0,0,0.35));
  }
  .coin .state-badge{
    position:absolute;
    bottom:-4px; right:-4px;
    width:19px; height:19px;
    border-radius:50%;
    font-family:var(--font-mono);
    font-size:10px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-deeper);
    border:1.5px solid var(--sand-dim);
    color:var(--sand);
  }
  .coin.heads .state-badge{ border-color:var(--moss); color:var(--moss); }
  .coin.tails .state-badge{ border-color:var(--slate); color:var(--slate); }

  .coin.can-primary{ cursor:pointer; }
  .coin.can-primary:hover{ transform:translateY(-3px); }
  .coin.can-primary::before{
    content:'';
    position:absolute; inset:-5px;
    border-radius:50%;
    border:2px dashed rgba(233,162,59,0.55);
    animation:pulse-ring 1.8s ease-in-out infinite;
  }
  .coin.can-secondary{ cursor:pointer; }
  .coin.can-secondary:hover{ transform:translateY(-3px); }
  .coin.can-secondary::before{
    content:'';
    position:absolute; inset:-5px;
    border-radius:50%;
    border:2px dashed rgba(95,179,172,0.6);
  }
  .coin.sel-primary{
    transform:scale(1.08);
    box-shadow:0 0 0 4px var(--amber), 0 8px 18px -6px rgba(0,0,0,0.6);
  }
  .coin.sel-secondary{
    transform:scale(1.08);
    box-shadow:0 0 0 4px var(--teal-accent), 0 8px 18px -6px rgba(0,0,0,0.6);
  }
  .coin.locked{ opacity:0.55; }
  .coin.just-flipped{ animation:flip-pulse .5s ease; }
  @keyframes flip-pulse{
    0%{ transform:scale(1); filter:brightness(1); }
    40%{ transform:scale(1.22); filter:brightness(1.5); }
    100%{ transform:scale(1); filter:brightness(1); }
  }
  @keyframes pulse-ring{
    0%,100%{ opacity:0.5; }
    50%{ opacity:1; }
  }

  .selection-legend{
    display:flex; gap:16px; flex-wrap:wrap;
    font-size:12.5px; color:var(--sand-dim);
    margin-top:14px;
    justify-content:center;
  }
  .legend-swatch{
    display:inline-block; width:10px; height:10px; border-radius:50%;
    margin-right:6px; vertical-align:middle;
  }

  .move-controls{
    display:flex; gap:10px; justify-content:center; margin-top:14px;
  }

  /* ---------- ledger ---------- */
  details.panel{
    background:rgba(8,27,25,0.5);
    border:1px solid rgba(238,227,201,0.1);
    border-radius:var(--radius-md);
    margin-bottom:12px;
    overflow:hidden;
  }
  details.panel summary{
    list-style:none;
    cursor:pointer;
    padding:14px 16px;
    display:flex; align-items:center; justify-content:space-between;
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
  }
  details.panel summary::-webkit-details-marker{ display:none; }
  details.panel summary::after{
    content:'▸';
    font-family:var(--font-body);
    color:var(--sand-dim);
    transition:transform .2s ease;
    font-size:13px;
  }
  details.panel[open] summary::after{ transform:rotate(90deg); }
  .panel-body{ padding:0 16px 18px; }
  .panel-sub{ font-size:12.5px; color:var(--sand-dim); margin:-6px 0 14px; line-height:1.5; }

  .ledger-scroll{ overflow-x:auto; }
  table.ledger{
    border-collapse:collapse;
    width:100%;
    min-width:280px;
    font-family:var(--font-mono);
    font-size:14px;
  }
  table.ledger th, table.ledger td{
    padding:7px 10px;
    text-align:center;
    border-bottom:1px solid rgba(238,227,201,0.08);
  }
  table.ledger th{
    color:var(--sand-dim);
    font-weight:600;
    font-size:11.5px;
    letter-spacing:1px;
  }
  table.ledger td.pos-cell{ color:var(--sand-dim); text-align:left; font-family:var(--font-body); }
  table.ledger tr.xor-row td{
    border-top:2px solid rgba(238,227,201,0.3);
    border-bottom:none;
    font-weight:700;
    padding-top:10px;
  }
  table.ledger td.bit{ border-radius:5px; }
  .digit-chip{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:20px;
    height:20px;
    padding:0 3px;
    border-radius:6px;
    line-height:1;
  }
  .digit-chip.one{
    background:var(--yellow);
    color:var(--yellow-ink);
    font-weight:700;
  }
  .ledger-summary{
    margin-top:14px;
    padding:12px 14px;
    background:rgba(233,162,59,0.08);
    border:1px solid rgba(233,162,59,0.25);
    border-radius:var(--radius-sm);
    font-family:var(--font-mono);
    font-size:14px;
    text-align:center;
    transition:background .2s ease, border-color .2s ease, color .2s ease;
  }
  .ledger-summary.preview{
    border-style:dashed;
    background:rgba(95,179,172,0.1);
    border-color:rgba(95,179,172,0.4);
    color:var(--sand);
  }
  .ledger-summary.preview.zero{
    background:rgba(127,176,105,0.16);
    border-color:var(--moss);
    color:var(--moss);
    font-weight:700;
  }
  .ledger-empty{ font-size:13.5px; color:var(--sand-dim); font-style:italic; }
  .ledger-badge{
    display:inline-block;
    font-family:var(--font-mono);
    font-size:10px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    background:rgba(95,179,172,0.18);
    color:var(--teal-accent);
    border:1px solid rgba(95,179,172,0.4);
    border-radius:999px;
    padding:2px 8px;
    margin-left:6px;
    vertical-align:middle;
  }

  /* ---------- hint toggle ---------- */
  .hint-widget{
    background:rgba(8,27,25,0.5);
    border:1px solid rgba(238,227,201,0.1);
    border-radius:var(--radius-md);
    padding:14px 16px;
    margin-bottom:12px;
  }
  .hint-widget .switch-row{
    background:none;
    border:none;
    padding:0;
    margin-bottom:0;
  }
  .hint-widget .hint-text{ margin-top:14px; }
  .switch-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:14px;
    background:rgba(8,27,25,0.5);
    border:1px solid rgba(238,227,201,0.1);
    border-radius:var(--radius-md);
    padding:12px 16px;
    margin-bottom:12px;
    cursor:pointer;
  }
  .switch-label-group{ display:flex; flex-direction:column; gap:1px; }
  .switch-label{ font-family:var(--font-display); font-weight:600; font-size:15.5px; color:var(--sand); }
  .switch-caption{ font-size:12px; color:var(--sand-dim); }
  .switch{ position:relative; display:inline-block; width:44px; height:26px; flex-shrink:0; }
  .switch input{ position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .switch-track{
    position:absolute; inset:0;
    background:rgba(238,227,201,0.18);
    border:1px solid rgba(238,227,201,0.28);
    border-radius:999px;
    transition:background .2s ease, border-color .2s ease;
  }
  .switch-thumb{
    position:absolute; top:2px; left:2px;
    width:20px; height:20px; border-radius:50%;
    background:var(--sand);
    transition:transform .2s ease, background .2s ease;
    box-shadow:0 2px 5px rgba(0,0,0,0.4);
  }
  .switch input:checked + .switch-track{ background:var(--amber); border-color:var(--amber-deep); }
  .switch input:checked + .switch-track .switch-thumb{ transform:translateX(18px); background:var(--ink); }
  .switch input:focus-visible + .switch-track{ outline:3px solid var(--amber); outline-offset:2px; }

  .hint-text{
    margin-top:14px;
    padding:11px 14px;
    background:rgba(233,162,59,0.12);
    border:1px solid rgba(233,162,59,0.35);
    border-radius:var(--radius-sm);
    font-size:13.5px;
    color:var(--sand);
    line-height:1.55;
  }
  .hint-text b{ color:var(--amber); }

  .ledger-card{
    background:rgba(8,27,25,0.5);
    border:1px solid rgba(238,227,201,0.1);
    border-radius:var(--radius-md);
    padding:16px;
    margin-bottom:12px;
  }
  .ledger-card-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
    margin:0 0 4px;
  }

  /* ---------- move log ---------- */
  .log-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto; }
  .log-list li{
    font-size:13px; line-height:1.55;
    color:var(--sand-dim);
    padding:8px 10px;
    border-radius:8px;
    background:rgba(238,227,201,0.04);
  }
  .log-list li b{ color:var(--sand); }
  .log-list .log-empty{ font-style:italic; }

  /* ---------- preview tip ---------- */
  .tip-box{
    display:flex; gap:10px; align-items:flex-start;
    background:rgba(95,179,172,0.1);
    border:1px solid rgba(95,179,172,0.3);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    font-size:13.5px;
    color:var(--sand);
    margin-top:14px;
    line-height:1.55;
  }
  .tip-box .tip-icon{ font-size:17px; flex-shrink:0; }

  .starter-buttons{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .starter-buttons .btn{ flex:1; min-width:150px; }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(4,14,13,0.72);
    backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:50;
    animation:fade-in .18s ease;
  }
  @keyframes fade-in{ from{opacity:0;} to{opacity:1;} }
  .modal-overlay.hidden{ display:none; }
  .modal{
    background:linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid rgba(238,227,201,0.15);
    border-radius:var(--radius-lg);
    max-width:560px;
    width:100%;
    max-height:85vh;

      footerCredit: 'พลิกเต่า (Turning Turtles) เป็นเกมพลิกเหรียญที่คิดค้นโดย H.\u00a0W.\u00a0Lenstra<br>แอปนี้จำลองเกมให้เห็นกลยุทธ์เลขฐานสองที่ซ่อนอยู่เบื้องหลัง'
    }
  };

  function t(key){
    var pack = T[state.lang] || T.en;
    return (pack[key] !== undefined) ? pack[key] : (T.en[key] !== undefined ? T.en[key] : key);
  }

  function fmt(str, vars){
    return str.replace(/\{(\w+)\}/g, function(_, k){
      return (vars && Object.prototype.hasOwnProperty.call(vars, k)) ? vars[k] : '';
    });
  }

  function botName(){
    return state.lang === 'th' ? 'เชลดอน' : 'Shelldon';
  }

  /* ============================================================
     STATE
  ============================================================ */
  var state = {
    lang: 'th',            // default language
    phase: 'setup',       // setup | preview | playing | gameover
    coins: [],            // [{pos, s: 'H'|'T'}]
    n: 0,
    current: null,        // 'human' | 'bot'
    starter: null,
    selection: { primary: null, secondary: null },
    moveHistory: [],
    moveCount: 0,
    winner: null,
    justFlipped: [],       // positions to animate on next render
    hintOn: false          // whether the perfect-move hint text is revealed
  };

  var botThinking = false;

  /* ============================================================
     GAME MATH
  ============================================================ */
  function randInt(min, max){
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateBoard(){
    var n = randInt(6, 13);
    var coins, headCount;
    do {
      coins = [];
      headCount = 0;
      for (var i = 1; i <= n; i++){
        var s = Math.random() < 0.5 ? 'H' : 'T';
        if (s === 'H') headCount++;
        coins.push({ pos: i, s: s });
      }
    } while (headCount === 0);
    state.n = n;
    state.coins = coins;
  }

  function headsPositions(coins){
    var out = [];
    for (var i = 0; i < coins.length; i++){
      if (coins[i].s === 'H') out.push(coins[i].pos);
    }
    return out;
  }

  function nimSum(coins){
    var heads = headsPositions(coins);
    var x = 0;
    for (var i = 0; i < heads.length; i++) x ^= heads[i];
    return x;
  }

  function bitWidthFor(n){
    return Math.max(1, n.toString(2).length);
  }

  function toBin(num, width){
    var s = num.toString(2);
    while (s.length < width) s = '0' + s;
    return s;
  }

  function isTerminal(coins){
    for (var i = 0; i < coins.length; i++){
      if (coins[i].s === 'H') return false;
    }
    return true;
  }

  // Returns {primary, secondary|null}
  function botChooseMove(coins){
    var X = nimSum(coins);
    var heads = headsPositions(coins);

    if (X !== 0){
      for (var i = 0; i < heads.length; i++){
        var p = heads[i];
        var tt = p ^ X;
        if (tt < p){
          return { primary: p, secondary: tt > 0 ? tt : null };
        }
      }
    }
    var p2 = heads[randInt(0, heads.length - 1)];
    var secondary = null;
    if (p2 > 1 && Math.random() < 0.5){
      secondary = randInt(1, p2 - 1);
    }
    return { primary: p2, secondary: secondary };
  }

  // The exact winning move for the current position, or null if the nim-sum is already 0.
  function findWinningMove(coins){
    var X = nimSum(coins);
    if (X === 0) return null;
    var heads = headsPositions(coins);
    for (var i = 0; i < heads.length; i++){
      var p = heads[i];
      var tt = p ^ X;
      if (tt < p) return { primary: p, secondary: tt > 0 ? tt : null };
    }
    return null;
  }

  function applyMoveToCoins(coins, move){
    var primaryCoin = null, secondaryCoin = null;
    for (var i = 0; i < coins.length; i++){
      if (coins[i].pos === move.primary) primaryCoin = coins[i];
      if (move.secondary && coins[i].pos === move.secondary) secondaryCoin = coins[i];
    }
    primaryCoin.s = 'T';
    var secInfo = null;
    if (secondaryCoin){
      var before = secondaryCoin.s;
      secondaryCoin.s = (secondaryCoin.s === 'H') ? 'T' : 'H';
      secInfo = { pos: secondaryCoin.pos, from: before, to: secondaryCoin.s };
    }
    return { primary: move.primary, secondary: secInfo };
  }

  // A hypothetical board reflecting the player's in-progress (unconfirmed) selection,
  // used only to preview the resulting nim-sum in the ledger. Never mutates real state.
  function previewCoins(){
    var sel = state.selection;
    if (!sel.primary) return null;
    var copy = state.coins.map(function(c){ return { pos: c.pos, s: c.s }; });
    for (var i = 0; i < copy.length; i++){
      if (copy[i].pos === sel.primary) copy[i].s = 'T';
      else if (sel.secondary && copy[i].pos === sel.secondary) copy[i].s = (copy[i].s === 'H') ? 'T' : 'H';
    }
    return copy;
  }

  /* ============================================================
     DOM HELPERS
  ============================================================ */
  function $(id){ return document.getElementById(id); }

  function coinAriaLabel(coin, kind){
    var stateWord = coin.s === 'H' ? t('headsWord') : t('tailsWord');
    if (kind === 'primary') return fmt(t('coinLabelPrimary'), { pos: coin.pos, state: stateWord });
    if (kind === 'secondary') return fmt(t('coinLabelSecondary'), { pos: coin.pos, state: stateWord });
    return fmt(t('coinLabelPlain'), { pos: coin.pos, state: stateWord });
  }

  function renderCoinButton(coin, opts){
    var classes = ['coin', coin.s === 'H' ? 'heads' : 'tails'];
    if (opts.selected === 'primary') classes.push('sel-primary');
    else if (opts.selected === 'secondary') classes.push('sel-secondary');
    else if (opts.kind === 'primary') classes.push('can-primary');
    else if (opts.kind === 'secondary') classes.push('can-secondary');
    else if (!opts.clickable) classes.push('locked');

    if (opts.justFlipped) classes.push('just-flipped');

    var emoji = '🐢';
    var label = coinAriaLabel(coin, opts.selected ? null : opts.kind);
    var disabledAttr = opts.clickable ? '' : 'disabled';
    var dataAttr = ' data-pos="' + coin.pos + '" data-role="' + (opts.kind || '') + '"';

    return (
      '<div class="coin-slot">' +
        '<span class="pos-label">' + coin.pos + '</span>' +
        '<button class="' + classes.join(' ') + '" ' + disabledAttr + dataAttr +
          ' aria-label="' + label + '" title="' + label + '">' +
          '<span class="emoji">' + emoji + '</span>' +
          '<span class="state-badge">' + coin.s + '</span>' +
        '</button>' +
      '</div>'
    );
  }

  function ledgerHTML(coins, isPreview){
    var heads = headsPositions(coins).slice().sort(function(a,b){ return a-b; });
    var width = bitWidthFor(Math.max(state.n, 1));
    var x = nimSum(coins);
    var sumLabel = isPreview ? t('nimSumAfterWord') : t('nimSumWord');
    var summaryClass = 'ledger-summary' + (isPreview ? ' preview' + (x === 0 ? ' zero' : '') : '');

    var out = '';
    out += '<div class="panel-sub">' + t('ledgerSub') + '</div>';

    if (heads.length === 0){
      out += '<p class="ledger-empty">' + t('ledgerEmpty') + '</p>';
      out += '<div class="' + summaryClass + '">' + sumLabel + ' = 0</div>';
      return out;
    }

    out += '<div class="ledger-scroll"><table class="ledger"><thead><tr><th style="text-align:left;">#</th>';
    for (var b = width - 1; b >= 0; b--){
      out += '<th>' + Math.pow(2, b) + '</th>';
    }
    out += '</tr></thead><tbody>';

    for (var i = 0; i < heads.length; i++){
      var bin = toBin(heads[i], width);
      out += '<tr><td class="pos-cell">🐢 ' + heads[i] + '</td>';
      for (var j = 0; j < width; j++){
        var digit = bin[j];
        out += '<td class="bit"><span class="digit-chip' + (digit === '1' ? ' one' : '') + '">' + digit + '</span></td>';
      }
      out += '</tr>';
    }

    var xorBin = toBin(x, width);
    out += '<tr class="xor-row"><td class="pos-cell">XOR</td>';
    for (var k = 0; k < width; k++){
      var xd = xorBin[k];
      out += '<td class="bit"><span class="digit-chip' + (xd === '1' ? ' one' : '') + '">' + xd + '</span></td>';
    }
    out += '</tr>';
    out += '</tbody></table></div>';
    out += '<div class="' + summaryClass + '">' + sumLabel + '&nbsp; = &nbsp;' + xorBin + '<sub>2</sub>&nbsp; = &nbsp;' + x + '</div>';
    return out;
  }

  function panelWrap(title, bodyHTML, open){
    return (
      '<details class="panel"' + (open ? ' open' : '') + '>' +
        '<summary>' + title + '</summary>' +
        '<div class="panel-body">' + bodyHTML + '</div>' +
      '</details>'
    );
  }

  function cardWrap(title, bodyHTML){
    return (
      '<div class="ledger-card">' +
        '<h3 class="ledger-card-title">' + title + '</h3>' +
        bodyHTML +
      '</div>'
    );
  }

  function moveHintHTML(coins){
    var move = findWinningMove(coins);
    if (!move){
      return fmt(t('moveHintNone'), { bot: botName() });
    }
    if (move.secondary){
      return fmt(t('moveHintWithSecondary'), { p: move.primary, t: move.secondary });
    }
    return fmt(t('moveHintPrimaryOnly'), { p: move.primary });
  }

  function starterHintHTML(x){
    if (x === 0) return fmt(t('starterHintZero'), { bot: botName() });
    return fmt(t('starterHintNonzero'), { x: x });
  }

  function hintBlockHTML(){
    if (!state.hintOn) return '';
    var text = '';
    if (state.phase === 'preview'){
      text = starterHintHTML(nimSum(state.coins));
    } else if (state.phase === 'playing' && state.current === 'human'){
      text = moveHintHTML(state.coins);
    } else if (state.phase === 'playing' && state.current === 'bot'){
      text = fmt(t('botReadingLedger'), { bot: botName() });
    }
    if (!text) return '';
    return '<div class="hint-text">' + text + '</div>';
  }

  function ledgerCardHTML(coins, isPreview){
    var title = t('ledgerTitle');
    if (isPreview) title += ' <span class="ledger-badge">' + t('ledgerPreviewTag') + '</span>';
    return cardWrap(title, ledgerHTML(coins, isPreview));
  }

  function hintWidgetHTML(idSuffix, captionKey){
    return (
      '<div class="hint-widget">' +
        '<label class="switch-row" for="hint-toggle-' + idSuffix + '">' +
          '<span class="switch-label-group">' +
            '<span class="switch-label">' + t('hintLabel') + '</span>' +
            '<span class="switch-caption">' + t(captionKey) + '</span>' +
          '</span>' +
          '<span class="switch">' +
            '<input type="checkbox" id="hint-toggle-' + idSuffix + '" data-action="toggle-hint"' + (state.hintOn ? ' checked' : '') + '>' +
            '<span class="switch-track"><span class="switch-thumb"></span></span>' +
          '</span>' +
        '</label>' +
        '<div id="hint-text-' + idSuffix + '">' + hintBlockHTML() + '</div>' +
      '</div>'
    );
  }

    html += '<div class="card">' +

        '<button class="choice-btn" data-action="start-bot">' +
          '<span class="choice-emoji">🤖</span>' +

        '</button>' +
        '<button class="choice-btn" data-action="start-preview">' +
          '<span class="choice-emoji">👀</span>' +

        '</button>' +

    $('screen-setup').innerHTML = html;

  /* ============================================================
     RENDER: PREVIEW
  ============================================================ */
  function renderPreviewScreen(){
    var boardHtml = '';
    for (var i = 0; i < state.coins.length; i++){
      boardHtml += renderCoinButton(state.coins[i], { clickable: false, kind: null, selected: null });
    }

    var html = '';
    html += '<div class="card">' +
      '<p class="eyebrow">' + t('previewEyebrow') + '</p>' +
      '<h2>' + t('previewHeading') + '</h2>' +
      '<p>' + t('previewIntro') + '</p>' +
    '</div>';

    html += ledgerCardHTML(state.coins);
    html += '<div class="card">' +
      '<div class="tip-box"><span class="tip-icon">💡</span><span>' + t('previewTip') + '</span></div>' +
      '<div class="starter-buttons">' +
        '<button class="btn btn-moss" data-action="start-you">' + t('previewYouBtn') + '</button>' +
        '<button class="btn btn-ghost" data-action="start-bot">' + fmt(t('previewBotBtn'), {bot: botName()}) + '</button>' +
      '</div>' +

    $('screen-preview').innerHTML = html;

  /* ============================================================
     RENDER: GAME
  ============================================================ */
  function statusHTML(){
    var dotClass = 'status-dot';
    var text = '';
    if (state.phase === 'gameover'){
      dotClass += ' over';
      text = (state.winner === 'human') ? t('statusYouWon') : fmt(t('statusBotWon'), { bot: botName() });
    } else if (state.current === 'human'){
      text = t('statusYourTurn');
    } else {
      dotClass += ' bot';
      if (botThinking){
        text = fmt(t('statusBotThinking'), { bot: botName() }) + '<span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span>';
      } else {
        text = fmt(t('statusBotTurn'), { bot: botName() });
      }
    }
    var moveText = (state.phase === 'gameover')
      ? fmt(t('statusTotalMoves'), { n: state.moveCount })
      : fmt(t('statusMoveN'), { n: state.moveCount + 1 });

    return (
      '<div class="status-bar">' +
        '<div class="status-turn"><span class="' + dotClass + '"></span><strong>' + text + '</strong></div>' +
        '<span class="status-move">' + moveText + '</span>' +
      '</div>'
    );
  }

  function helperHTML(){
    if (state.phase === 'gameover') return t('helperGameOver');
    if (state.current === 'bot') return botThinking ? fmt(t('helperBotThinking'), { bot: botName() }) : '&nbsp;';
    var sel = state.selection;
    if (!sel.primary) return t('helperPickPrimary');
    if (!sel.secondary) return t('helperOptionalSecondary');
    return t('helperReady');
  }

  function boardHTML(){
    var html = '';
    var sel = state.selection;
    var humanTurn = (state.phase === 'playing' && state.current === 'human');

    for (var i = 0; i < state.coins.length; i++){
      var coin = state.coins[i];
      var opts = { clickable: false, kind: null, selected: null, justFlipped: state.justFlipped.indexOf(coin.pos) !== -1 };

      if (humanTurn){
        if (sel.primary === coin.pos){
          opts.selected = 'primary';
          opts.clickable = true;
          opts.kind = 'primary';
        } else if (sel.secondary === coin.pos){
          opts.selected = 'secondary';
          opts.clickable = true;
          opts.kind = 'secondary';
        } else if (!sel.primary){
          if (coin.s === 'H'){ opts.clickable = true; opts.kind = 'primary'; }
        } else {
          if (coin.pos < sel.primary){ opts.clickable = true; opts.kind = 'secondary'; }
        }
      }
      html += renderCoinButton(coin, opts);
    }
    return html;
  }

  function formatMoveLine(entry, idx){
    var who = entry.player === 'human' ? t('logLineWho_you') : botName();
    var line = fmt(t('logLineFlip'), { n: idx + 1, who: who, p: entry.primary });
    if (entry.secondary){
      var dir = entry.secondary.to === 'H' ? t('headWordShort') : t('tailWordShort');
      line += fmt(t('logLineSecondary'), { t: entry.secondary.pos, dir: dir });
    }
    line += fmt(t('logLineNimSum'), { x: entry.nimSumAfter });
    return line;
  }

  function logListHTML(){
    if (state.moveHistory.length === 0){
      return '<li class="log-empty">' + t('logEmpty') + '</li>';
    }
    var html = '';
    for (var i = state.moveHistory.length - 1; i >= 0; i--){
      html += '<li>' + formatMoveLine(state.moveHistory[i], i) + '</li>';
    }
    return html;
  }

  function renderGameScreen(){
    var humanTurn = (state.phase === 'playing' && state.current === 'human');
    var showControls = humanTurn && state.selection.primary;
    var previewBoard = showControls ? previewCoins() : null;

    var html = '';
    html += statusHTML();
    html += '<p class="helper-text">' + helperHTML() + '</p>';

    html += '<div class="board-wrap">';
    html += '<div class="board">' + boardHTML() + '</div>';
    html += '<div class="move-controls' + (showControls ? '' : ' hidden') + '">' +
      '<button class="btn btn-ghost btn-sm" data-action="clear-selection">' + t('clearSelectionBtn') + '</button>' +
      '<button class="btn btn-primary btn-sm" data-action="confirm-move"' + (showControls ? '' : ' disabled') + '>' + t('confirmMoveBtn') + '</button>' +
    '</div>';
    html += '<div class="selection-legend">' +
      '<span><span class="legend-swatch" style="background:var(--amber)"></span>' + t('legendPrimary') + '</span>' +
      '<span><span class="legend-swatch" style="background:var(--teal-accent)"></span>' + t('legendSecondary') + '</span>' +
    '</div>';
    html += '</div>';

    html += hintWidgetHTML('game', 'hintCaptionGame');
    html += previewBoard ? ledgerCardHTML(previewBoard, true) : ledgerCardHTML(state.coins, false);

    var logOpen = state.phase !== 'gameover';
    html += panelWrap(t('logPanelTitle'), '<ul class="log-list">' + logListHTML() + '</ul>', logOpen);

    state.justFlipped = [];
    $('screen-game').innerHTML = html;
  }

  /* ============================================================
     MASTER RENDER

  function showScreen(name){
    ['setup','preview','game'].forEach(function(s){
      $('screen-' + s).classList.toggle('hidden', s !== name);
    });
    $('btn-new-game').classList.toggle('hidden', name === 'setup');
  }

  function renderChrome(){
    document.documentElement.lang = state.lang;
    $('doc-title').textContent = t('pageTitle');
    document.title = t('pageTitle');
    $('brand-title').textContent = t('brandTitle');
    $('brand-subtitle').textContent = t('brandSubtitle');
    $('btn-open-rules').setAttribute('aria-label', t('rulesBtnLabel'));
    $('btn-open-rules').setAttribute('title', t('rulesBtnLabel'));
    $('btn-new-game').setAttribute('aria-label', t('newGameBtnLabel'));
    $('btn-new-game').setAttribute('title', t('newGameBtnLabel'));
    $('site-footer').innerHTML = t('footerCredit');
    $('btn-lang-th').classList.toggle('active', state.lang === 'th');
    $('btn-lang-en').classList.toggle('active', state.lang === 'en');

    if (!$('modal-rules').classList.contains('hidden')) renderRulesModal();
    if (!$('modal-end').classList.contains('hidden')) renderEndModal();
  }

  function render(){
    renderChrome();
    if (state.phase === 'setup'){
      showScreen('setup');
      renderSetupScreen();
    } else if (state.phase === 'preview'){
      showScreen('preview');
      renderPreviewScreen();
    } else {
      showScreen('game');
      renderGameScreen();
    }
  }

  /* ============================================================
     RULES MODAL
  ============================================================ */
  function renderRulesModal(){
    var html = '';
    html += '<div class="modal-head">' +
      '<h2 id="rules-title">' + t('rulesTitle') + '</h2>' +
      '<button class="icon-btn" data-action="close-rules" aria-label="Close">✕</button>' +
    '</div>';

    html += '<h3>' + t('rulesHowToPlayHeading') + '</h3>';
    html += '<p>' + t('rulesHowToPlayIntro') + '</p>';
    html += '<ol class="rule-steps">' +
      '<li><span class="rule-num">1</span><span>' + t('rulesStep1') + '</span></li>' +
      '<li><span class="rule-num">2</span><span>' + t('rulesStep2') + '</span></li>' +
      '<li><span class="rule-num">3</span><span>' + t('rulesStep3') + '</span></li>' +
    '</ol>';

    html += '<h3>' + t('rulesNumberingHeading') + '</h3>';
    html += '<p>' + t('rulesNumberingText') + '</p>';

    html += '<h3>' + t('rulesNimSumHeading') + '</h3>';
    html += '<p>' + t('rulesNimSumText') + '</p>';
    html += '<div class="example-box">' + t('example1') + '</div>';
    html += '<ul><li>' + t('nimSumBullet1') + '</li><li>' + t('nimSumBullet2') + '</li></ul>';

    html += '<h3>' + t('rulesFindingHeading') + '</h3>';
    html += '<p>' + t('rulesFindingText') + '</p>';
    html += '<ul>' +
      '<li>' + t('findingBullet1') + '</li>' +
      '<li>' + t('findingBullet2') + '</li>' +
      '<li>' + t('findingBullet3') + '</li>' +
    '</ul>';
    html += '<div class="example-box">' + t('example2') + '</div>';
    html += '<p>' + t('rulesClosing') + '</p>';

    $('modal-rules-inner').innerHTML = html;
  }

  /* ============================================================
     END MODAL
  ============================================================ */
  function renderRecapHTML(){
    if (state.moveHistory.length === 0){
      return '<ul class="log-list"><li class="log-empty">' + t('recapEmpty') + '</li></ul>';
    }
    var html = '<ul class="log-list">';
    for (var i = 0; i < state.moveHistory.length; i++){
      html += '<li>' + formatMoveLine(state.moveHistory[i], i) + '</li>';
    }
    html += '</ul>';
    return html;
  }

  function renderEndModal(){
    var won = state.winner === 'human';
    var html = '';
    html += '<span class="result-emoji">' + (won ? '🏆' : '🐢') + '</span>';
    html += '<h2 id="end-title">' + (won ? t('endTitleWin') : fmt(t('endTitleLose'), { bot: botName() })) + '</h2>';
    html += '<p class="result-sub">' + (won ? t('endSubWin') : fmt(t('endSubLose'), { bot: botName() })) + '</p>';
    html += panelWrap(t('recapPanelTitle'), renderRecapHTML(), false);
    html += '<div class="end-actions">' +
      '<button class="btn btn-moss" data-action="play-again">' + t('playAgainBtn') + '</button>' +
      '<button class="btn btn-ghost" data-action="review-board">' + t('reviewBoardBtn') + '</button>' +
    '</div>';
    $('modal-end-inner').innerHTML = html;
  }

  function openModal(id){ $(id).classList.remove('hidden'); }
  function closeModal(id){ $(id).classList.add('hidden'); }

  /* ============================================================
     GAME FLOW
  ============================================================ */
  function startGame(starter){
    state.phase = 'playing';
    state.current = starter;
    state.starter = starter;
    state.moveHistory = [];
    state.moveCount = 0;
    state.winner = null;
    state.selection = { primary: null, secondary: null };
    state.justFlipped = [];
    render();
    if (state.current === 'bot'){
      scheduleBotTurn();
    }
  }

  function afterMove(mover){
    state.moveCount++;
    state.selection = { primary: null, secondary: null };
    if (isTerminal(state.coins)){
      state.winner = mover;
      state.phase = 'gameover';
      render();
      renderEndModal();
      openModal('modal-end');
      return;
    }
    state.current = (mover === 'human') ? 'bot' : 'human';
    render();
    if (state.current === 'bot'){
      scheduleBotTurn();
    }
  }

  function scheduleBotTurn(){
    botThinking = true;
    render();
    setTimeout(doBotTurn, 850 + randInt(0, 400));
  }

  function doBotTurn(){
    botThinking = false;
    var move = botChooseMove(state.coins);
    var info = applyMoveToCoins(state.coins, move);
    state.justFlipped = [info.primary];
    if (info.secondary) state.justFlipped.push(info.secondary.pos);
    state.moveHistory.push({
      player: 'bot',
      primary: info.primary,
      secondary: info.secondary,
      nimSumAfter: nimSum(state.coins)
    });
    afterMove('bot');
  }

  function confirmHumanMove(){
    var sel = state.selection;
    if (!sel.primary) return;
    var move = { primary: sel.primary, secondary: sel.secondary || null };
    var info = applyMoveToCoins(state.coins, move);
    state.justFlipped = [info.primary];
    if (info.secondary) state.justFlipped.push(info.secondary.pos);
    state.moveHistory.push({
      player: 'human',
      primary: info.primary,
      secondary: info.secondary,
      nimSumAfter: nimSum(state.coins)
    });
    afterMove('human');
  }

  function handleBoardClick(pos, role){
    if (state.phase !== 'playing' || state.current !== 'human') return;
    var sel = state.selection;

    if (!sel.primary){
      if (role === 'primary') sel.primary = pos;
    } else if (pos === sel.primary){
      sel.primary = null;
      sel.secondary = null;
    } else if (role === 'secondary'){
      sel.secondary = (sel.secondary === pos) ? null : pos;
    }
    renderGameScreen();
  }

  function clearSelection(){
    state.selection = { primary: null, secondary: null };
    renderGameScreen();
  }

  function newGame(){
    state.phase = 'setup';
    state.coins = [];
    state.n = 0;
    state.current = null;
    state.starter = null;
    state.selection = { primary: null, secondary: null };
    state.moveHistory = [];
    state.moveCount = 0;
    state.winner = null;
    state.justFlipped = [];
    botThinking = false;
    render();
  }

  function setLang(lang){
    if (lang !== 'th' && lang !== 'en') return;
    state.lang = lang;
    render();
  }

  /* ============================================================
     EVENTS (delegated)
  ============================================================ */
  document.addEventListener('click', function(e){
    if (e.target && e.target.id === 'modal-rules'){ closeModal('modal-rules'); return; }

    var coinBtn = e.target.closest('button.coin');
    if (coinBtn && !coinBtn.disabled){
      var pos = parseInt(coinBtn.getAttribute('data-pos'), 10);
      var role = coinBtn.getAttribute('data-role');
      handleBoardClick(pos, role);
      return;
    }

    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');

    switch(action){
      case 'start-you':
        if (state.phase === 'setup') generateBoard();
        startGame('human');
        break;
      case 'start-bot':
        if (state.phase === 'setup') generateBoard();
        startGame('bot');
        break;
      case 'start-preview':
        generateBoard();
        state.phase = 'preview';
        render();
        break;
      case 'clear-selection':
        clearSelection();
        break;
      case 'confirm-move':
        confirmHumanMove();
        break;
      case 'open-rules':
        renderRulesModal();
        openModal('modal-rules');
        break;
      case 'close-rules':
        closeModal('modal-rules');
        break;
      case 'new-game':
        if (state.phase === 'playing' && state.moveHistory.length > 0){
          if (!confirm(t('confirmNewGame'))) return;
        }
        newGame();
        break;
      case 'play-again':
        closeModal('modal-end');
        newGame();
        break;
      case 'review-board':
        closeModal('modal-end');
        break;
      case 'set-lang':
        setLang(el.getAttribute('data-lang'));
        break;
    }
  });

  document.addEventListener('change', function(e){
    if (e.target && e.target.getAttribute && e.target.getAttribute('data-action') === 'toggle-hint'){
      state.hintOn = e.target.checked;
      if (state.phase === 'preview') renderPreviewScreen();
      else renderGameScreen();
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){
      closeModal('modal-rules');
    }
  });

  /* init */
  render();
})();
</script>
</body>
</html>
