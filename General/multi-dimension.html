<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>มองให้เกิน 3 มิติ — คู่มือภาพเรื่องมิติ</title>
<style>
:root{
  --bg:#070912; --card:rgba(255,255,255,.035); --line:rgba(255,255,255,.10);
  --txt:#e8edf7; --muted:#95a0bd;
  --sans:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans Thai","IBM Plex Sans Thai","Sarabun","Leelawadee UI",Thonburi,Tahoma,Roboto,sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,"Noto Sans Thai","Leelawadee UI",Tahoma,monospace;
  --a0:#a78bfa; --a1:#22d3ee; --a2:#f472b6; --a3:#fbbf24; --a4:#34d399; --a5:#60a5fa;
  --accent:var(--a0);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--txt);overflow-x:hidden;font-family:var(--sans);
  font-size:16px;line-height:1.68;-webkit-font-smoothing:antialiased}
html[lang="th"] body{line-height:1.82;font-size:16.5px}
html[lang="th"] .lede,html[lang="th"] .note,html[lang="th"] .sub{line-height:1.9}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(900px 600px at 12% -5%,rgba(167,139,250,.20),transparent 60%),
    radial-gradient(800px 600px at 88% 12%,rgba(34,211,238,.14),transparent 60%),
    radial-gradient(900px 700px at 50% 105%,rgba(244,114,182,.12),transparent 60%),
    var(--bg);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;opacity:.35;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 80%);
}
/* ---------- nav ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(14px);
  background:rgba(7,9,18,.74);border-bottom:1px solid var(--line)}
.progress{height:2px;background:linear-gradient(90deg,var(--a0),var(--a1),var(--a3));width:0%;transition:width .1s linear}
.navin{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.02em;font-size:15px;display:flex;align-items:center;gap:9px}
.brand i{width:11px;height:11px;border-radius:50%;background:var(--a1);box-shadow:0 0 14px var(--a1);display:block;font-style:normal}
.pills{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.pill{font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:none;padding:5px 11px;border-radius:99px;
  border:1px solid transparent;transition:.22s;white-space:nowrap}
.pill:hover{color:#fff;background:rgba(255,255,255,.06)}
.pill.on{color:#0a0c16;background:linear-gradient(120deg,var(--a1),var(--a0));border-color:transparent}
.lang{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.04)}
.lang button{font:inherit;font-size:11.5px;font-weight:750;letter-spacing:.04em;cursor:pointer;color:var(--muted);
  background:transparent;border:0;padding:4px 12px;border-radius:99px;transition:.2s;line-height:1.5}
.lang button:hover{color:#fff}
.lang button.on{color:#08131a;background:linear-gradient(120deg,var(--a4),var(--a1));box-shadow:0 0 14px -4px var(--a1)}
/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:0 20px 90px}
.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:120px 0 60px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--a1);margin-bottom:16px}
h1{font-size:clamp(2.2rem,6vw,4.3rem);line-height:1.08;letter-spacing:-.035em;font-weight:850;max-width:18ch}
html[lang="th"] h1{line-height:1.24;letter-spacing:-.01em}
h1 em{font-style:normal;background:linear-gradient(100deg,var(--a0),var(--a1) 45%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:22px;font-size:clamp(1rem,2.1vw,1.2rem);color:var(--muted);max-width:62ch}
.heroline{margin-top:44px;display:flex;gap:10px;flex-wrap:wrap}
.hchip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 15px;font-size:13px;color:var(--muted)}
.hchip b{color:var(--txt)}
.scrolldown{margin-top:52px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:9px}
.scrolldown span{display:inline-block;animation:bob 1.7s infinite ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

section.dim{padding:74px 0 20px;border-top:1px solid var(--line);margin-top:40px}
section.dim[data-a="0"]{--accent:var(--a0)} section.dim[data-a="1"]{--accent:var(--a5)}
section.dim[data-a="2"]{--accent:var(--a1)} section.dim[data-a="3"]{--accent:var(--a3)}
section.dim[data-a="4"]{--accent:var(--a2)} section.dim[data-a="5"]{--accent:var(--a4)}
.dhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dbadge{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);
  background:color-mix(in srgb,var(--accent) 12%,transparent);padding:4px 12px;border-radius:9px;letter-spacing:.05em}
.dhead h2{font-size:clamp(1.5rem,3.4vw,2.3rem);letter-spacing:-.03em;font-weight:800;line-height:1.2}
html[lang="th"] .dhead h2{letter-spacing:-.005em;line-height:1.38}
.lede{margin-top:16px;color:var(--muted);max-width:76ch;font-size:16.5px}
.lede b{color:var(--txt);font-weight:650}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px;align-items:start}
.grid2.wide-left{grid-template-columns:1.15fr .85fr}
.stack{display:grid;gap:20px;margin-top:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;position:relative;overflow:hidden;
  box-shadow:0 22px 50px -34px rgba(0,0,0,.9)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 70%,transparent),transparent)}
.way{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
html[lang="th"] .way{text-transform:none;letter-spacing:.02em;font-size:11.5px}
.card h3{font-size:1.06rem;font-weight:700;letter-spacing:-.01em;line-height:1.5}
.note{margin-top:12px;font-size:13.8px;color:var(--muted)}
.note b{color:var(--txt)}
.formula{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:1.32rem;letter-spacing:.02em;
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 16px;display:inline-block;margin-top:12px}
.formula i{font-style:italic;color:var(--accent)}
canvas{display:block;width:100%;border-radius:12px}
canvas.plot{height:290px;background:rgba(255,255,255,.022);border:1px solid var(--line);margin-top:14px}
canvas.v3d{height:360px;background:radial-gradient(120% 120% at 50% 0%,rgba(255,255,255,.05),rgba(255,255,255,.01));
  border:1px solid var(--line);margin-top:14px;cursor:grab;touch-action:none}
canvas.v3d.grabbing{cursor:grabbing}
canvas.nl{height:80px;margin-top:8px;touch-action:none}
canvas.nl.drag{cursor:ew-resize}
canvas.nl.drag:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
canvas.strip{height:150px;background:rgba(255,255,255,.022);border:1px solid var(--line);margin-top:14px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.btn{font:inherit;font-size:13.5px;font-weight:650;color:var(--txt);cursor:pointer;border-radius:11px;padding:8px 15px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid var(--line);
  transition:.2s;display:inline-flex;align-items:center;gap:8px;line-height:1.6}
.btn:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 55%,transparent);
  box-shadow:0 10px 26px -14px color-mix(in srgb,var(--accent) 90%,transparent)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex:none}
.sw{display:inline-flex;align-items:center;gap:9px;font-size:13.4px;color:var(--muted);cursor:pointer;user-select:none}
.sw input{display:none}
.sw .track{width:40px;height:22px;border-radius:99px;background:rgba(255,255,255,.11);border:1px solid var(--line);position:relative;transition:.22s;flex:none}
.sw .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#8e9ab8;transition:.22s}
.sw input:checked + .track{background:color-mix(in srgb,var(--accent) 34%,transparent);border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.sw input:checked + .track::after{left:20px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.readout{font-family:var(--mono);font-size:13.4px;margin-top:13px;padding:10px 13px;border-radius:11px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted);overflow-x:auto;white-space:nowrap}
.readout b{color:var(--txt);font-weight:600}
.vx{color:var(--a1)} .vy{color:var(--a2)} .vz{color:var(--a3)} .vw{color:var(--a4)}
.slider{-webkit-appearance:none;appearance:none;width:210px;height:5px;border-radius:99px;background:rgba(255,255,255,.14);outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 12px var(--accent)}
.slider::-moz-range-thumb{width:17px;height:17px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}
.counter{font-size:12.8px;color:var(--muted)}
.counter b{color:var(--accent);font-family:var(--mono)}
.hint{font-size:12.4px;color:var(--muted);opacity:.85;margin-top:8px}
.msg{margin-top:14px;padding:13px 15px;border-radius:12px;font-size:14.2px;
  background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);
  opacity:0;transform:translateY(8px);transition:.55s}
.msg.on{opacity:1;transform:none}
.msg b{color:var(--accent)}
.insight{margin-top:22px;display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:15px;
  background:linear-gradient(100deg,color-mix(in srgb,var(--accent) 11%,transparent),transparent 70%);
  border:1px solid color-mix(in srgb,var(--accent) 26%,transparent)}
.insight .ic{font-size:19px;line-height:1.4;flex:none}
.insight p{font-size:14.8px;color:#cfd8ea}
.insight b{color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.4px;font-family:var(--mono)}
.tbl th,.tbl td{padding:8px 9px;text-align:right;border-bottom:1px solid rgba(255,255,255,.06);color:var(--muted);transition:.3s}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:11px;letter-spacing:.06em;color:#6f7b99;font-weight:700;line-height:1.45}
.tbl .on{color:var(--txt);background:rgba(52,211,153,.08)}
.tbl th.on{color:var(--a4)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.step{font:inherit;font-size:13px;font-weight:650;cursor:pointer;padding:7px 14px;border-radius:10px;color:var(--muted);
  background:rgba(255,255,255,.04);border:1px solid var(--line);transition:.2s}
.step:hover{color:#fff}
.step.on{color:#08131a;background:linear-gradient(120deg,var(--a4),var(--a1));border-color:transparent}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12.6px;color:var(--muted);align-items:center}
.legend .bar{width:110px;height:9px;border-radius:99px;background:linear-gradient(90deg,#4338ca,#22d3ee,#fbbf24)}
.legend .sz{display:flex;align-items:center;gap:5px}
.legend .sz i{display:block;border-radius:50%;background:#9aa6c4;font-style:normal}
footer{max-width:1180px;margin:0 auto;padding:40px 20px 70px;border-top:1px solid var(--line);color:var(--muted);font-size:13.8px}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.3,1)}
.reveal.in{opacity:1;transform:none}
@media(max-width:900px){.grid2,.grid2.wide-left{grid-template-columns:1fr}.pills{display:none}
  .lang{margin-left:auto}canvas.v3d{height:310px}}
</style>
</head>
<body>

<header class="nav">
  <div class="progress" id="prog"></div>
  <div class="navin">
    <div class="brand"><i></i> <span data-i18n="nav.brand">มองให้เกิน 3 มิติ</span></div>
    <nav class="pills">
      <a class="pill" href="#d0" data-i18n="nav.0">0 มิติ</a>
      <a class="pill" href="#d1" data-i18n="nav.1">1 มิติ</a>
      <a class="pill" href="#d2" data-i18n="nav.2">2 มิติ</a>
      <a class="pill" href="#d3" data-i18n="nav.3">3 มิติ</a>
      <a class="pill" href="#d4" data-i18n="nav.4">4 มิติ</a>
      <a class="pill" href="#d5" data-i18n="nav.5">ชีวิตจริง</a>
    </nav>
    <div class="lang" id="lang">
      <button data-l="th" class="on">ไทย</button>
      <button data-l="en">EN</button>
    </div>
  </div>
</header>

<main>
  <!-- ================= HERO ================= -->
  <section class="hero">
    <div class="kicker" data-i18n="hero.kicker">บทเรียนอินเทอร์แอกทีฟ · เรื่องมิติ</div>
    <h1 data-i18n="hero.h1">เราจะวาดสิ่งที่มี <em>มากกว่า 3 มิติ</em> ได้อย่างไร?</h1>
    <p class="sub" data-i18n="hero.sub"></p>
    <div class="heroline">
      <div class="hchip" data-i18n="hero.c0"></div>
      <div class="hchip" data-i18n="hero.c1"></div>
      <div class="hchip" data-i18n="hero.c2"></div>
      <div class="hchip" data-i18n="hero.c3"></div>
      <div class="hchip" data-i18n="hero.c4"></div>
      <div class="hchip" data-i18n="hero.cn"></div>
    </div>
    <div class="scrolldown"><span>↓</span> <span data-i18n="hero.scroll"></span></div>
  </section>

  <!-- ================= 0D ================= -->
  <section class="dim reveal" id="d0" data-a="0">
    <div class="dhead"><span class="dbadge" data-i18n="d0.badge">0 มิติ</span><h2 data-i18n="d0.h2"></h2></div>
    <p class="lede" data-i18n="d0.lede"></p>
    <div class="grid2">
      <div class="card">
        <div class="way" data-i18n="d0.way"></div>
        <h3 data-i18n="d0.h3"></h3>
        <canvas class="strip" id="c0"></canvas>
        <div class="controls">
          <input type="range" class="slider" id="s0" min="0.4" max="46" step="0.1" value="30">
          <button class="btn" id="b0"><span class="dot"></span><span data-i18n="d0.btn"></span></button>
        </div>
        <div class="readout" id="r0"></div>
        <div class="msg" id="m0" data-i18n="d0.msg"></div>
      </div>
      <div class="card">
        <div class="way" data-i18n="d0.way2"></div>
        <h3 data-i18n="d0.h32"></h3>
        <p class="note" data-i18n="d0.n1"></p>
        <p class="note" data-i18n="d0.n2"></p>
        <div class="insight"><div class="ic">💡</div><p data-i18n="d0.ins"></p></div>
      </div>
    </div>
  </section>

  <!-- ================= 1D ================= -->
  <section class="dim reveal" id="d1" data-a="1">
    <div class="dhead"><span class="dbadge" data-i18n="d1.badge">1 มิติ</span><h2 data-i18n="d1.h2"></h2></div>
    <p class="lede" data-i18n="d1.lede"></p>
    <div class="card">
      <div class="way" data-i18n="d1.way"></div>
      <h3 data-i18n="d1.h3"></h3>
      <canvas class="strip" id="c1" style="height:190px"></canvas>
      <div class="controls">
        <button class="btn" id="b1"><span class="dot"></span><span data-i18n="d1.btn"></span></button>
        <button class="btn ghost" id="b1r" data-i18n="d1.reset"></button>
        <span class="counter"><span data-i18n="d1.count"></span> <b id="c1n">0</b> / 5</span>
      </div>
      <div class="msg" id="m1" data-i18n="d1.msg"></div>
    </div>
    <div class="insight reveal"><div class="ic">🧭</div><p data-i18n="d1.ins"></p></div>
  </section>

  <!-- ================= 2D ================= -->
  <section class="dim reveal" id="d2" data-a="2">
    <div class="dhead"><span class="dbadge" data-i18n="d2.badge">2 มิติ</span><h2 data-i18n="d2.h2"></h2></div>
    <p class="lede" data-i18n="d2.lede"></p>
    <div class="formula">y = <i>x</i>²</div>
    <div class="grid2">
      <div class="card">
        <div class="way" data-i18n="d2.w1"></div>
        <h3 data-i18n="d2.h31"></h3>
        <canvas class="plot" id="p2"></canvas>
        <p class="note" data-i18n="d2.n1"></p>
      </div>
      <div class="card">
        <div class="way" data-i18n="d2.w2"></div>
        <h3 data-i18n="d2.h32"></h3>
        <canvas class="nl" id="nl2x"></canvas>
        <canvas class="nl" id="nl2y"></canvas>
        <div class="controls">
          <button class="btn" id="b2"><span class="dot"></span><span data-i18n="d2.btn"></span></button>
          <label class="sw"><input type="checkbox" id="t2" checked><span class="track"></span><span data-i18n="d2.sw"></span></label>
        </div>
        <div class="hint" data-i18n="d2.hint"></div>
        <div class="readout" id="r2"></div>
        <p class="note" data-i18n="d2.n2"></p>
      </div>
    </div>
    <div class="insight"><div class="ic">🔑</div><p data-i18n="d2.ins"></p></div>
  </section>

  <!-- ================= 3D ================= -->
  <section class="dim reveal" id="d3" data-a="3">
    <div class="dhead"><span class="dbadge" data-i18n="d3.badge">3 มิติ</span><h2 data-i18n="d3.h2"></h2></div>
    <p class="lede" data-i18n="d3.lede"></p>
    <div class="formula">z = <i>x</i>² + <i>y</i>²</div>
    <div class="grid2 wide-left">
      <div class="card">
        <div class="way" data-i18n="d3.w1"></div>
        <h3 data-i18n="d3.h31"></h3>
        <canvas class="v3d" id="v3"></canvas>
        <div class="controls">
          <button class="btn ghost" id="v3spin"></button>
          <span class="counter" data-i18n="d3.drag"></span>
        </div>
        <p class="note" data-i18n="d3.n1"></p>
      </div>
      <div class="card">
        <div class="way" data-i18n="d3.w2"></div>
        <h3 data-i18n="d3.h32"></h3>
        <canvas class="nl" id="nl3x"></canvas>
        <canvas class="nl" id="nl3y"></canvas>
        <canvas class="nl" id="nl3z"></canvas>
        <div class="controls">
          <button class="btn" id="b3x"><span class="dot"></span><span data-i18n="d3.bx"></span></button>
          <button class="btn" id="b3y"><span class="dot"></span><span data-i18n="d3.by"></span></button>
          <label class="sw"><input type="checkbox" id="t3" checked><span class="track"></span><span data-i18n="d3.sw"></span></label>
        </div>
        <div class="hint" data-i18n="d3.hint"></div>
        <div class="readout" id="r3"></div>
        <p class="note" data-i18n="d3.n2"></p>
      </div>
    </div>
    <div class="stack">
      <div class="card">
        <div class="way" data-i18n="d3.w3"></div>
        <h3 data-i18n="d3.h33"></h3>
        <div class="grid2">
          <canvas class="plot" id="p3"></canvas>
          <div>
            <canvas class="nl" id="nl3x2"></canvas>
            <div class="controls">
              <button class="btn" id="b3x2"><span class="dot"></span><span data-i18n="d3.bx"></span></button>
            </div>
            <div class="hint" data-i18n="d3.hint3"></div>
            <p class="note" data-i18n="d3.n3"></p>
            <div class="readout" id="r3b"></div>
          </div>
        </div>

  const r=window.devicePixelRatio||1,rect=cv.getBoundingClientRect();
  const W=Math.max(1,Math.round(rect.width*r)),H=Math.max(1,Math.round(rect.height*r));
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  const ctx=cv.getContext('2d');ctx.setTransform(r,0,0,r,0,0);ctx.clearRect(0,0,rect.width,rect.height);
  return {ctx,w:rect.width,h:rect.height};

  const t0=performance.now();

    cb(lerp(from,to,e));if(k<1)requestAnimationFrame(step);})(t0);

class NumberLine{
  constructor(cv,o){
    this.cv=cv;this.min=o.min;this.max=o.max;this.label=o.label;this.color=o.color||C.x;
    this.interactive=!!o.interactive;this.value=o.value??0;this.onChange=o.onChange||(()=>{});
    this.dec=o.dec??1;this.tick=o.tick||1;this.every=o.every||1;
    this.padL=54;this.padR=26;this.w=300;
    if(this.interactive){
      cv.classList.add('drag');cv.tabIndex=0;
      const setFromEvt=e=>{const r=cv.getBoundingClientRect();this.set(this.val(e.clientX-r.left));};
      let dragging=false;
      cv.addEventListener('pointerdown',e=>{dragging=true;cv.setPointerCapture(e.pointerId);setFromEvt(e);});
      cv.addEventListener('pointermove',e=>{if(dragging)setFromEvt(e);});
      ['pointerup','pointercancel'].forEach(k=>cv.addEventListener(k,()=>dragging=false));
      cv.addEventListener('keydown',e=>{
        const s=(this.max-this.min)/100*(e.shiftKey?5:1);
        if(e.key==='ArrowLeft'){this.set(this.value-s);e.preventDefault();}
        if(e.key==='ArrowRight'){this.set(this.value+s);e.preventDefault();}});
    }
    this.draw();
  }
  px(v){return this.padL+(clamp(v,this.min,this.max)-this.min)/(this.max-this.min)*(this.w-this.padL-this.padR);}
  val(px){return clamp(this.min+(px-this.padL)/(this.w-this.padL-this.padR)*(this.max-this.min),this.min,this.max);}
  set(v){this.value=+(clamp(v,this.min,this.max)).toFixed(this.dec);this.draw();this.onChange(this.value);}
  quiet(v){this.value=+(+v).toFixed(this.dec);this.draw();}
  draw(){
    const {ctx,w,h}=fit(this.cv);this.w=w;const ax=Math.round(h*0.62)+.5,col=this.color;
    ctx.save();rrect(ctx,8,ax-15,36,30,9);ctx.fillStyle=col+'22';ctx.fill();
    ctx.strokeStyle=col+'66';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=col;ctx.font='700 15px '+FSANS;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(this.label,26,ax);ctx.restore();
    const x0=this.padL,x1=w-this.padR;
    ctx.strokeStyle='rgba(255,255,255,.26)';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(x0,ax);ctx.lineTo(x1,ax);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.26)';
    [[x0,-1],[x1,1]].forEach(([x,d])=>{ctx.beginPath();ctx.moveTo(x+6*d,ax);ctx.lineTo(x,ax-4);ctx.lineTo(x,ax+4);ctx.closePath();ctx.fill();});
    ctx.font='10px '+FMONO;ctx.textAlign='center';ctx.textBaseline='top';
    const start=Math.ceil(this.min/this.tick)*this.tick;let n=0;
    for(let v=start;v<=this.max+1e-9;v+=this.tick,n++){
      const x=this.px(v),big=n%this.every===0;
      ctx.strokeStyle=big?'rgba(255,255,255,.30)':'rgba(255,255,255,.14)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x,ax-(big?5:3));ctx.lineTo(x,ax+(big?5:3));ctx.stroke();
      if(big){ctx.fillStyle='rgba(150,160,190,.85)';ctx.fillText(tlbl(v),x,ax+9);}
    }
    const mx=this.px(this.value);
    ctx.strokeStyle=col+'55';ctx.setLineDash([2,3]);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(mx,ax-9);ctx.lineTo(mx,ax-24);ctx.stroke();ctx.setLineDash([]);
    ctx.save();ctx.shadowColor=col;ctx.shadowBlur=14;
    ctx.beginPath();ctx.arc(mx,ax,this.interactive?8.5:6.5,0,7);ctx.fillStyle=col;ctx.fill();ctx.restore();
    ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.92)';
    ctx.beginPath();ctx.arc(mx,ax,this.interactive?8.5:6.5,0,7);ctx.stroke();
    if(this.interactive){ctx.strokeStyle=col+'55';ctx.lineWidth=1.4;
      ctx.beginPath();ctx.arc(mx,ax,14,0,7);ctx.stroke();}
    const txt=this.value.toFixed(this.dec);
    ctx.font='700 13px '+FMONO;
    const bw=ctx.measureText(txt).width+18,bx=clamp(mx-bw/2,2,w-bw-2),by=ax-46;
    rrect(ctx,bx,by,bw,23,8);ctx.fillStyle=col+'26';ctx.fill();ctx.strokeStyle=col+'88';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=col;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,bx+bw/2,by+12);
  }
}

/* ============================ 2D grapher ============================ */
function drawGraph(cv,cfg){
  const {ctx,w,h}=fit(cv);
  const P={l:52,r:18,t:18,b:36},iw=w-P.l-P.r,ih=h-P.t-P.b;
  const X=v=>P.l+(v-cfg.xmin)/(cfg.xmax-cfg.xmin)*iw;
  const Y=v=>h-P.b-(v-cfg.ymin)/(cfg.ymax-cfg.ymin)*ih;
  const xs=cfg.xstep||niceStep(cfg.xmax-cfg.xmin),ys=cfg.ystep||niceStep(cfg.ymax-cfg.ymin);
  ctx.lineWidth=1;ctx.font='10px '+FMONO;
  for(let v=Math.ceil(cfg.xmin/xs)*xs;v<=cfg.xmax+1e-9;v+=xs){
    const x=X(v);ctx.strokeStyle='rgba(255,255,255,.055)';
    ctx.beginPath();ctx.moveTo(x,P.t);ctx.lineTo(x,h-P.b);ctx.stroke();
    ctx.fillStyle='rgba(140,152,182,.85)';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(tlbl(v),x,h-P.b+7);
  }
  for(let v=Math.ceil(cfg.ymin/ys)*ys;v<=cfg.ymax+1e-9;v+=ys){
    const y=Y(v);ctx.strokeStyle='rgba(255,255,255,.055)';
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(w-P.r,y);ctx.stroke();
    ctx.fillStyle='rgba(140,152,182,.85)';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(tlbl(v),P.l-8,y);
  }
  ctx.strokeStyle='rgba(255,255,255,.30)';ctx.lineWidth=1.4;
  const ax=clamp(X(0),P.l,w-P.r),ay=clamp(Y(0),P.t,h-P.b);
  ctx.beginPath();ctx.moveTo(P.l,ay);ctx.lineTo(w-P.r,ay);ctx.moveTo(ax,h-P.b);ctx.lineTo(ax,P.t);ctx.stroke();
  ctx.save();ctx.beginPath();ctx.rect(P.l,P.t,iw,ih);ctx.clip();
  (cfg.curves||[]).forEach(c=>{
    ctx.strokeStyle=c.color;ctx.lineWidth=c.w||2.6;ctx.setLineDash(c.dash||[]);
    if(c.glow){ctx.shadowColor=c.color;ctx.shadowBlur=12;}
    ctx.beginPath();let started=false;
    for(let i=0;i<=340;i++){
      const xv=lerp(cfg.xmin,cfg.xmax,i/340),yv=c.f(xv);
      if(!isFinite(yv)){started=false;continue;}
      const px=X(xv),py=clamp(Y(yv),-4000,4000);
      started?ctx.lineTo(px,py):(ctx.moveTo(px,py),started=true);
    }
    ctx.stroke();ctx.shadowBlur=0;ctx.setLineDash([]);
  });
  (cfg.vlines||[]).forEach(l=>{ctx.strokeStyle=l.color;ctx.lineWidth=1.8;ctx.setLineDash([6,5]);
    ctx.beginPath();ctx.moveTo(X(l.v),P.t-10);ctx.lineTo(X(l.v),h-P.b+10);ctx.stroke();ctx.setLineDash([]);});
  (cfg.hlines||[]).forEach(l=>{ctx.strokeStyle=l.color;ctx.lineWidth=1.4;ctx.setLineDash([4,5]);
    ctx.beginPath();ctx.moveTo(P.l-10,Y(l.v));ctx.lineTo(w-P.r,Y(l.v));ctx.stroke();ctx.setLineDash([]);});
  (cfg.points||[]).forEach(p=>{
    const px=X(p.x),py=Y(p.y);
    ctx.save();ctx.shadowColor=p.color;ctx.shadowBlur=16;
    ctx.beginPath();ctx.arc(px,py,p.r||6.5,0,7);ctx.fillStyle=p.color;ctx.fill();ctx.restore();
    ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.beginPath();ctx.arc(px,py,p.r||6.5,0,7);ctx.stroke();
    if(p.label){ctx.font='700 12px '+FMONO;ctx.fillStyle=p.color;ctx.textAlign='left';ctx.textBaseline='bottom';
      ctx.fillText(p.label,px+11,py-7);}
  });
  ctx.restore();
  ctx.font='700 12.5px '+FSANS;
  ctx.fillStyle=cfg.xcolor||'rgba(200,210,232,.9)';ctx.textAlign='right';ctx.textBaseline='bottom';
  ctx.fillText(cfg.xlabel||'x',w-P.r,ay-8);
  ctx.fillStyle=cfg.ycolor||'rgba(200,210,232,.9)';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(cfg.ylabel||'y',ax+9,P.t-2);
  if(cfg.tag){ctx.font='700 12px '+FMONO;ctx.fillStyle=cfg.tagColor||'rgba(160,170,200,.9)';
    ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText(cfg.tag,w-P.r,P.t);}
}

/* ============================ 3D engine ============================ */
const views=[];
class View3D{
  constructor(cv,cfg){
    this.cv=cv;this.cfg=Object.assign({yaw:.72,pitch:.52,dist:3.6,zflat:.86,N:26},cfg);
    this.auto=true;this.dirty=true;this.visible=true;
    let dr=false,lx=0,ly=0;
    cv.addEventListener('pointerdown',e=>{dr=true;lx=e.clientX;ly=e.clientY;this.auto=false;
      this.onAuto&&this.onAuto(false);cv.setPointerCapture(e.pointerId);cv.classList.add('grabbing');});
    cv.addEventListener('pointermove',e=>{if(!dr)return;
      this.cfg.yaw+=(e.clientX-lx)*.008;this.cfg.pitch=clamp(this.cfg.pitch+(e.clientY-ly)*.006,-.15,1.35);
      lx=e.clientX;ly=e.clientY;this.dirty=true;});
    ['pointerup','pointercancel','pointerleave'].forEach(k=>cv.addEventListener(k,()=>{dr=false;cv.classList.remove('grabbing');}));
    views.push(this);
    if('IntersectionObserver' in window)
      new IntersectionObserver(es=>{this.visible=es[0].isIntersecting;},{threshold:.02}).observe(cv);
  }
  proj(x,y,z){
    const c=this.cfg,g=this.g;
    const nx=(x-(c.xr[0]+c.xr[1])/2)/((c.xr[1]-c.xr[0])/2);
    const ny=(y-(c.yr[0]+c.yr[1])/2)/((c.yr[1]-c.yr[0])/2);
    const nz=((z-(c.zr[0]+c.zr[1])/2)/((c.zr[1]-c.zr[0])/2))*c.zflat;
    const X=nx*g.cy-ny*g.sy,R=nx*g.sy+ny*g.cy;
    const Y=R*g.cp-nz*g.sp,Z=R*g.sp+nz*g.cp;
    const p=c.dist/(c.dist+Y);
    return {x:g.ox+X*p*g.S,y:g.oy-Z*p*g.S,d:Y,p};
  }
  render(){
    const {ctx,w,h}=fit(this.cv),c=this.cfg;
    this.g={S:Math.min(w,h)*.42,ox:w/2,oy:h*.55,cy:Math.cos(c.yaw),sy:Math.sin(c.yaw),
            cp:Math.cos(c.pitch),sp:Math.sin(c.pitch)};
    const P=(x,y,z)=>this.proj(x,y,z),z0=c.zr[0];
    ctx.lineWidth=1;ctx.strokeStyle='rgba(255,255,255,.085)';
    for(let i=0;i<=6;i++){
      const xv=lerp(c.xr[0],c.xr[1],i/6),yv=lerp(c.yr[0],c.yr[1],i/6);
      let a=P(xv,c.yr[0],z0),b=P(xv,c.yr[1],z0);
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      a=P(c.xr[0],yv,z0);b=P(c.xr[1],yv,z0);
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    }
    let a=P(c.xr[0],c.yr[1],z0),b=P(c.xr[0],c.yr[1],c.zr[1]);
    ctx.strokeStyle='rgba(255,255,255,.16)';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    const prims=[];
    if(c.f){
      const N=c.N,[x0,x1]=c.xr,[y0,y1]=c.yr,dx=(x1-x0)/N,dy=(y1-y0)/N;
      const sx=(x1-x0)/2,sz=(c.zr[1]-c.zr[0])/2,sy=(y1-y0)/2;
      for(let i=0;i<N;i++)for(let j=0;j<N;j++){
        const xa=x0+i*dx,xb=xa+dx,ya=y0+j*dy,yb=ya+dy;
        const z00=c.f(xa,ya),z10=c.f(xb,ya),z01=c.f(xa,yb),z11=c.f(xb,yb);
        if(![z00,z10,z01,z11].every(isFinite))continue;
        const p0=P(xa,ya,z00),p1=P(xb,ya,z10),p2=P(xb,yb,z11),p3=P(xa,yb,z01);
        const zm=(z00+z10+z01+z11)/4,k=(zm-c.zr[0])/(c.zr[1]-c.zr[0]);
        const gx=((z10+z11)-(z00+z01))/2/dx*sx/sz,gy=((z01+z11)-(z00+z10))/2/dy*sy/sz;
        const len=Math.hypot(gx,gy,1),L=[-.4,-.55,.73];
        const dot=(-gx*L[0]-gy*L[1]+L[2])/len;
        const sh=clamp(.62+.55*Math.max(0,dot),0,1.25);
        prims.push({t:'q',p:[p0,p1,p2,p3],fill:rgba(ramp(k),.95,sh),
          stroke:'rgba(255,255,255,.055)',d:(p0.d+p1.d+p2.d+p3.d)/4});
      }
    }
    (c.planes||[]).forEach(pl=>{
      const M=12,K=9;
      for(let i=0;i<M;i++)for(let j=0;j<K;j++){
        let q;
        if(pl.axis==='x'){
          const ya=lerp(c.yr[0],c.yr[1],i/M),yb=lerp(c.yr[0],c.yr[1],(i+1)/M);
          const za=lerp(c.zr[0],c.zr[1],j/K),zb=lerp(c.zr[0],c.zr[1],(j+1)/K);
          q=[P(pl.v,ya,za),P(pl.v,yb,za),P(pl.v,yb,zb),P(pl.v,ya,zb)];
        }else{
          const xa=lerp(c.xr[0],c.xr[1],i/M),xb=lerp(c.xr[0],c.xr[1],(i+1)/M);
          const za=lerp(c.zr[0],c.zr[1],j/K),zb=lerp(c.zr[0],c.zr[1],(j+1)/K);
          q=[P(xa,pl.v,za),P(xb,pl.v,za),P(xb,pl.v,zb),P(xa,pl.v,zb)];
        }
        prims.push({t:'q',p:q,fill:pl.color+'1f',stroke:pl.color+'22',d:(q[0].d+q[1].d+q[2].d+q[3].d)/4});
      }
    });
    (c.slices||[]).forEach(sl=>{
      const M=90;let prev=null;
      for(let i=0;i<=M;i++){
        let pt;
        if(sl.axis==='x'){const yv=lerp(c.yr[0],c.yr[1],i/M);pt=P(sl.v,yv,c.f(sl.v,yv));}
        else{const xv=lerp(c.xr[0],c.xr[1],i/M);pt=P(xv,sl.v,c.f(xv,sl.v));}
        if(prev)prims.push({t:'l',a:prev,b:pt,color:sl.color,lw:3.4,d:(prev.d+pt.d)/2-.06});
        prev=pt;
      }
    });
    (c.points||[]).forEach(pt=>{
      const p=P(pt.x,pt.y,pt.z);
      prims.push({t:'p',p,r:(pt.r||7)*p.p,color:pt.color,label:pt.label,d:p.d-.05,ring:pt.ring!==false});
      if(pt.stem){const s=P(pt.x,pt.y,c.zr[0]);
        prims.push({t:'l',a:s,b:p,color:pt.color+'70',lw:1.4,dash:[3,4],d:p.d-.04});}
    });
    prims.sort((A,B)=>B.d-A.d);
    for(const pr of prims){
      if(pr.t==='q'){
        ctx.beginPath();ctx.moveTo(pr.p[0].x,pr.p[0].y);
        for(let i=1;i<4;i++)ctx.lineTo(pr.p[i].x,pr.p[i].y);
        ctx.closePath();ctx.fillStyle=pr.fill;ctx.fill();
        if(pr.stroke){ctx.strokeStyle=pr.stroke;ctx.lineWidth=1;ctx.stroke();}
      }else if(pr.t==='l'){
        ctx.strokeStyle=pr.color;ctx.lineWidth=pr.lw;ctx.setLineDash(pr.dash||[]);
        ctx.beginPath();ctx.moveTo(pr.a.x,pr.a.y);ctx.lineTo(pr.b.x,pr.b.y);ctx.stroke();ctx.setLineDash([]);
      }else{
        ctx.save();ctx.shadowColor=pr.color;ctx.shadowBlur=14;
        ctx.beginPath();ctx.arc(pr.p.x,pr.p.y,pr.r,0,7);ctx.fillStyle=pr.color;ctx.fill();ctx.restore();
        if(pr.ring){ctx.lineWidth=1.8;ctx.strokeStyle='rgba(255,255,255,.9)';
          ctx.beginPath();ctx.arc(pr.p.x,pr.p.y,pr.r,0,7);ctx.stroke();}
        if(pr.label){ctx.font='600 11px '+FSANS;ctx.fillStyle='rgba(230,236,248,.92)';
          ctx.textAlign='left';ctx.textBaseline='bottom';ctx.fillText(pr.label,pr.p.x+pr.r+4,pr.p.y-3);}
      }
    }
    ctx.font='700 13px '+FSANS;ctx.textAlign='center';ctx.textBaseline='middle';
    const mid=r=>(r[0]+r[1])/2;
    const lx=P(lerp(mid(c.xr),c.xr[1],1.22),c.yr[0],z0);
    const ly=P(c.xr[1],lerp(mid(c.yr),c.yr[1],1.22),z0);
    const lz=P(c.xr[0],c.yr[1],lerp(mid(c.zr),c.zr[1],1.16));
    ctx.fillStyle=(c.lc&&c.lc.x)||C.x;ctx.fillText(c.labels[0],lx.x,lx.y);
    ctx.fillStyle=(c.lc&&c.lc.y)||C.y;ctx.fillText(c.labels[1],ly.x,ly.y);
    ctx.fillStyle=(c.lc&&c.lc.z)||C.z;ctx.fillText(c.labels[2],lz.x,lz.y);
    ctx.font='10px '+FMONO;ctx.fillStyle='rgba(140,152,182,.8)';
    [[c.xr[0],c.yr[0]],[c.xr[1],c.yr[0]]].forEach(([xv,yv])=>{
      const q=P(xv,yv,z0);ctx.fillText(tlbl(xv),q.x,q.y+13);});
    if(c.tag){ctx.font='700 12px '+FMONO;ctx.fillStyle='rgba(160,170,200,.9)';
      ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(c.tag,12,10);}
  }
}
(function loop(){
  for(const v of views){
    if(!v.visible)continue;
    if(v.auto){v.cfg.yaw+=.0032;v.dirty=true;}
    if(v.dirty){v.render();v.dirty=false;}
  }
  requestAnimationFrame(loop);
})();

/* ============================ 0D ============================ */
const c0=document.getElementById('c0'),s0=document.getElementById('s0'),r0=document.getElementById('r0');
let R0=30;
function draw0(){
  const {ctx,w,h}=fit(c0);
  ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;
  for(let i=1;i<8;i++){ctx.beginPath();ctx.moveTo(w*i/8,0);ctx.lineTo(w*i/8,h);ctx.stroke();}
  for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(0,h*i/4);ctx.lineTo(w,h*i/4);ctx.stroke();}
  ctx.save();ctx.shadowColor=C.p;ctx.shadowBlur=26;
  ctx.beginPath();ctx.arc(w/2,h/2,Math.max(R0,.3),0,7);ctx.fillStyle=C.p;ctx.fill();ctx.restore();
  ctx.strokeStyle='rgba(167,139,250,.35)';ctx.setLineDash([3,4]);ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(w/2,h/2,Math.max(R0,.3)+14,0,7);ctx.stroke();ctx.setLineDash([]);
  ctx.font='12px '+FSANS;ctx.fillStyle='rgba(150,160,190,.9)';ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText(R0<2?t('cv0.a'):t('cv0.b'),w/2,h/2+Math.max(R0,.3)+22);
  r0.innerHTML=t('d0.ro',{r:R0.toFixed(1)});
  document.getElementById('m0').classList.toggle('on',R0<3);
}
s0.addEventListener('input',()=>{R0=+s0.value;draw0();});
document.getElementById('b0').addEventListener('click',()=>{tween(R0,.4,900,v=>{R0=v;s0.value=v;draw0();});});

/* ============================ 1D ============================ */
const c1=document.getElementById('c1'),m1=document.getElementById('m1'),c1n=document.getElementById('c1n');
let pts=[],lineT=0,anim=false,tStart=0;
function draw1(){
  const {ctx,w,h}=fit(c1),ax=Math.round(h*.55)+.5,padL=34,padR=34;
  const X=v=>padL+(v+11)/22*(w-padL-padR),now=performance.now();
  if(lineT>0){
    const first=X(pts[0].v),L=lerp(first,padL,lineT),R=lerp(first,w-padR,lineT);
    ctx.strokeStyle='rgba(96,165,250,.75)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(L,ax);ctx.lineTo(R,ax);ctx.stroke();
    ctx.fillStyle='rgba(96,165,250,.75)';
    if(lineT>.95)[[padL,-1],[w-padR,1]].forEach(([x,d])=>{
      ctx.beginPath();ctx.moveTo(x+7*d,ax);ctx.lineTo(x,ax-5);ctx.lineTo(x,ax+5);ctx.closePath();ctx.fill();});
    const fade=clamp((lineT-.5)*2,0,1);
    if(fade>0){
      ctx.font='10px '+FMONO;ctx.textAlign='center';ctx.textBaseline='top';
      for(let v=-10;v<=10;v++){
        const x=X(v);if(x<L-1||x>R+1)continue;
        ctx.strokeStyle=`rgba(255,255,255,${.28*fade})`;ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(x,ax-5);ctx.lineTo(x,ax+5);ctx.stroke();
        if(v%2===0){ctx.fillStyle=`rgba(150,160,190,${.9*fade})`;ctx.fillText(String(v),x,ax+9);}
      }
      const mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v));
      ctx.strokeStyle=`rgba(52,211,153,${.85*fade})`;ctx.lineWidth=2;
      const y=ax-44;ctx.beginPath();ctx.moveTo(X(mn),y+6);ctx.lineTo(X(mn),y);
      ctx.lineTo(X(mx),y);ctx.lineTo(X(mx),y+6);ctx.stroke();
      ctx.font='700 11.5px '+FSANS;ctx.fillStyle=`rgba(52,211,153,${fade})`;ctx.textBaseline='bottom';
      ctx.fillText(t('cv1.dist')+(mx-mn).toFixed(0),(X(mn)+X(mx))/2,y-3);
    }
  }
  pts.forEach(p=>{
    const k=clamp((now-p.t0)/380,0,1),e=1-Math.pow(1-k,3),sc=e*(1+.35*Math.sin(k*Math.PI));
    const x=X(p.v),r=7*sc;
    ctx.save();ctx.shadowColor=C.b;ctx.shadowBlur=16;
    ctx.beginPath();ctx.arc(x,ax,Math.max(r,.1),0,7);ctx.fillStyle=C.b;ctx.fill();ctx.restore();
    ctx.lineWidth=2;ctx.strokeStyle=`rgba(255,255,255,${.9*e})`;
    ctx.beginPath();ctx.arc(x,ax,Math.max(r,.1),0,7);ctx.stroke();
    ctx.font='700 13px '+FMONO;ctx.fillStyle=`rgba(96,165,250,${e})`;ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText(String(p.v),x,ax-14-6*e);
  });
  if(pts.length===0){
    ctx.font='13px '+FSANS;ctx.fillStyle='rgba(150,160,190,.7)';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(t('cv1.empty'),w/2,ax);
  }
}
function anim1(){
  const now=performance.now();
  if(anim){lineT=clamp((now-tStart)/1300,0,1);if(lineT>=1){anim=false;m1.classList.add('on');}}
  draw1();
  if(anim||pts.some(p=>now-p.t0<420))requestAnimationFrame(anim1);
}
document.getElementById('b1').addEventListener('click',e=>{
  if(pts.length>=5)return;
  let v,guard=0;
  do{v=Math.round(rnd(-10,10,0));guard++;}while(pts.some(p=>Math.abs(p.v-v)<2)&&guard<60);
  pts.push({v,t0:performance.now()});c1n.textContent=pts.length;
  if(pts.length>=5){e.currentTarget.disabled=true;setTimeout(()=>{anim=true;tStart=performance.now();anim1();},650);}
  anim1();
});
document.getElementById('b1r').addEventListener('click',()=>{
  pts=[];lineT=0;anim=false;c1n.textContent=0;m1.classList.remove('on');
  document.getElementById('b1').disabled=false;draw1();});

/* ============================ 2D ============================ */
const S2={x:2},f2=x=>x*x;
const nl2x=new NumberLine(document.getElementById('nl2x'),
  {min:-5,max:5,tick:.5,every:2,label:'x',color:C.x,interactive:true,value:S2.x,onChange:v=>set2(v)});
const nl2y=new NumberLine(document.getElementById('nl2y'),
  {min:0,max:25,tick:1,every:5,label:'y',color:C.y,value:f2(S2.x)});
function set2(v){
  S2.x=v;nl2x.quiet(v);nl2y.quiet(f2(v));
  const y=f2(S2.x);
  document.getElementById('r2').innerHTML=
    `<b>y = x²</b> &nbsp;→&nbsp; x = <b class="vx">${S2.x.toFixed(1)}</b> &nbsp;⇒&nbsp; y = <b class="vy">${y.toFixed(2)}</b>`;
  draw2();
}
function draw2(){
  const show=document.getElementById('t2').checked,y=f2(S2.x);
  drawGraph(document.getElementById('p2'),{
    xmin:-5.6,xmax:5.6,ymin:-3,ymax:28,xstep:1,ystep:5,xlabel:'x',ylabel:'y',xcolor:C.x,ycolor:C.y,
    curves:[{f:f2,color:C.p,glow:true}],
    vlines:show?[{v:S2.x,color:C.x+'cc'}]:[],
    hlines:show?[{v:y,color:C.y+'99'}]:[],
    points:[{x:S2.x,y,color:'#ffffff',label:`(${S2.x.toFixed(1)}, ${y.toFixed(1)})`}],

}
document.getElementById('t2').addEventListener('change',draw2);
document.getElementById('b2').addEventListener('click',()=>{
  const target=rnd(-5,5,1);tween(S2.x,target,620,v=>set2(+v.toFixed(2)));});

/* ============================ 3D ============================ */
const S3={x:1.2,y:-.8},f3=(x,y)=>x*x+y*y;
const v3=new View3D(document.getElementById('v3'),{
  xr:[-3,3],yr:[-3,3],zr:[0,18],labels:['x','y','z'],lc:{x:C.x,y:C.y,z:C.z},f:f3,tag:'z = x² + y²'});
v3.onAuto=on=>document.getElementById('v3spin').textContent=t(on?'spin.on':'spin.off');
document.getElementById('v3spin').addEventListener('click',()=>{v3.auto=!v3.auto;v3.dirty=true;v3.onAuto(v3.auto);});
const nl3x=new NumberLine(document.getElementById('nl3x'),
  {min:-3,max:3,tick:.5,every:2,label:'x',color:C.x,interactive:true,value:S3.x,onChange:v=>set3('x',v)});
const nl3y=new NumberLine(document.getElementById('nl3y'),
  {min:-3,max:3,tick:.5,every:2,label:'y',color:C.y,interactive:true,value:S3.y,onChange:v=>set3('y',v)});
const nl3z=new NumberLine(document.getElementById('nl3z'),
  {min:0,max:18,tick:1,every:3,label:'z',color:C.z,value:f3(S3.x,S3.y)});
const nl3x2=new NumberLine(document.getElementById('nl3x2'),
  {min:-3,max:3,tick:.5,every:2,label:'x',color:C.x,interactive:true,value:S3.x,onChange:v=>set3('x',v)});
function set3(k,v){
  S3[k]=v;nl3x.quiet(S3.x);nl3x2.quiet(S3.x);nl3y.quiet(S3.y);
  const z=f3(S3.x,S3.y);nl3z.quiet(z);
  v3.cfg.planes=document.getElementById('t3').checked?
    [{axis:'x',v:S3.x,color:C.x},{axis:'y',v:S3.y,color:C.y}]:[];
  v3.cfg.slices=[{axis:'x',v:S3.x,color:C.z}];
  v3.cfg.points=[{x:S3.x,y:S3.y,z,color:'#ffffff',r:7,stem:true,label:`z=${z.toFixed(1)}`}];
  v3.dirty=true;
  document.getElementById('r3').innerHTML=
    `x = <b class="vx">${S3.x.toFixed(1)}</b> , y = <b class="vy">${S3.y.toFixed(1)}</b> ⇒ z = <b class="vz">${z.toFixed(2)}</b>`;
  document.getElementById('r3b').innerHTML=t('d3.rb',{x:S3.x.toFixed(1),c:(S3.x*S3.x).toFixed(2)});
  draw3b();
}
function draw3b(){
  const c=S3.x*S3.x,z=f3(S3.x,S3.y);
  drawGraph(document.getElementById('p3'),{
    xmin:-3.2,xmax:3.2,ymin:-1,ymax:18.5,xstep:1,ystep:3,xlabel:'y',ylabel:'z',xcolor:C.y,ycolor:C.z,
    curves:[{f:y=>y*y,color:'rgba(167,139,250,.28)',w:2,dash:[5,5]},
            {f:y=>y*y+c,color:C.z,glow:true}],
    vlines:[{v:S3.y,color:C.y+'aa'}],hlines:[{v:z,color:C.z+'77'}],
    points:[{x:S3.y,y:z,color:'#ffffff',label:`z=${z.toFixed(1)}`}],
    tag:t('tag.freeze1',{v:S3.x.toFixed(1)}),tagColor:C.x});
}
document.getElementById('t3').addEventListener('change',()=>set3('x',S3.x));
document.getElementById('b3x').addEventListener('click',()=>{const q=rnd(-3,3,1);tween(S3.x,q,620,v=>set3('x',+v.toFixed(2)));});
document.getElementById('b3x2').addEventListener('click',()=>{const q=rnd(-3,3,1);tween(S3.x,q,620,v=>set3('x',+v.toFixed(2)));});
document.getElementById('b3y').addEventListener('click',()=>{const q=rnd(-3,3,1);tween(S3.y,q,620,v=>set3('y',+v.toFixed(2)));});

/* ============================ 4D ============================ */
const S4={x:1,y:-1};
const v4=new View3D(document.getElementById('v4'),{
  xr:[-3,3],yr:[-3,3],zr:[0,27],labels:['y','z','w'],lc:{x:C.y,y:C.z,z:C.w},
  f:(y,z)=>S4.x*S4.x+y*y+z*z,tag:'w = x² + y² + z²'});
v4.onAuto=on=>document.getElementById('v4spin').textContent=t(on?'spin.on':'spin.off');
document.getElementById('v4spin').addEventListener('click',()=>{v4.auto=!v4.auto;v4.dirty=true;v4.onAuto(v4.auto);});
const nl4x=new NumberLine(document.getElementById('nl4x'),
  {min:-3,max:3,tick:.5,every:2,label:'x',color:C.x,interactive:true,value:S4.x,onChange:v=>set4('x',v)});
const nl4x2=new NumberLine(document.getElementById('nl4x2'),
  {min:-3,max:3,tick:.5,every:2,label:'x',color:C.x,interactive:true,value:S4.x,onChange:v=>set4('x',v)});
const nl4y2=new NumberLine(document.getElementById('nl4y2'),
  {min:-3,max:3,tick:.5,every:2,label:'y',color:C.y,interactive:true,value:S4.y,onChange:v=>set4('y',v)});
function set4(k,v){
  S4[k]=v;nl4x.quiet(S4.x);nl4x2.quiet(S4.x);nl4y2.quiet(S4.y);
  v4.cfg.slices=[{axis:'x',v:S4.y,color:C.z}];
  v4.cfg.planes=[{axis:'x',v:S4.y,color:C.y}];
  v4.dirty=true;
  const base=S4.x*S4.x+S4.y*S4.y;
  document.getElementById('r4').innerHTML=t('d4.r',{x:S4.x.toFixed(1),c:(S4.x*S4.x).toFixed(2)});
  document.getElementById('r4b').innerHTML=
    `x = <b class="vx">${S4.x.toFixed(1)}</b>, y = <b class="vy">${S4.y.toFixed(1)}</b> ⇒ w = z² + <b class="vw">${base.toFixed(2)}</b>`;
  draw4b();
}
function draw4b(){
  const base=S4.x*S4.x+S4.y*S4.y;
  drawGraph(document.getElementById('p4'),{
    xmin:-3.2,xmax:3.2,ymin:-1,ymax:30,xstep:1,ystep:5,xlabel:'z',ylabel:'w',xcolor:C.z,ycolor:C.w,
    curves:[{f:z=>z*z,color:'rgba(167,139,250,.25)',w:2,dash:[5,5]},
            {f:z=>z*z+base,color:C.w,glow:true}],
    hlines:[{v:base,color:C.w+'77'}],
    points:[{x:0,y:base,color:'#ffffff',label:t('lbl.minw',{v:base.toFixed(2)})}],
    tag:t('tag.freeze2'),tagColor:C.x});
}
document.getElementById('b4x').addEventListener('click',()=>{const q=rnd(-3,3,1);tween(S4.x,q,620,v=>set4('x',+v.toFixed(2)));});
document.getElementById('b4x2').addEventListener('click',()=>{const q=rnd(-3,3,1);tween(S4.x,q,620,v=>set4('x',+v.toFixed(2)));});
document.getElementById('b4y2').addEventListener('click',()=>{const q=rnd(-3,3,1);tween(S4.y,q,620,v=>set4('y',+v.toFixed(2)));});

/* ============================ real life ============================ */
const ATH=[
 {n:'Ava',h:178,w:68,s:8.9,j:62,e:58},{n:'Ben',h:191,w:88,s:8.2,j:71,e:52},
 {n:'Chen',h:170,w:62,s:9.4,j:55,e:66},{n:'Dara',h:183,w:75,s:8.6,j:68,e:61},
 {n:'Eli',h:165,w:58,s:9.1,j:49,e:70},{n:'Farah',h:174,w:71,s:8.0,j:58,e:55},
 {n:'Gus',h:198,w:97,s:7.6,j:74,e:47},{n:'Hana',h:186,w:80,s:8.8,j:66,e:63}];
const p5=document.getElementById('p5'),v5cv=document.getElementById('v5');
let DIM=1;
const v5=new View3D(v5cv,{xr:[160,200],yr:[55,100],zr:[7.4,9.6],labels:['x','y','z'],
  lc:{x:C.x,y:C.y,z:C.z},zflat:.8});
v5.onAuto=on=>document.getElementById('v5spin').textContent=t(on?'spin.on':'spin.off');
document.getElementById('v5spin').addEventListener('click',()=>{v5.auto=!v5.auto;v5.dirty=true;v5.onAuto(v5.auto);});
document.querySelector('#tb5 tbody').innerHTML=ATH.map(a=>
  `<tr><td>${a.n}</td><td data-c="1">${a.h}</td><td data-c="2">${a.w}</td>
   <td data-c="3">${a.s}</td><td data-c="4">${a.j}</td><td data-c="5">${a.e}</td></tr>`).join('');
const steps=document.getElementById('steps');
function buildSteps(){
  steps.innerHTML=[1,2,3,4,5].map(i=>
    `<button class="step${i===DIM?' on':''}" data-d="${i}">${t('rl.step',{n:i})}</button>`).join('');
}
steps.addEventListener('click',e=>{const b=e.target.closest('.step');if(!b)return;
  DIM=+b.dataset.d;[...steps.children].forEach(s=>s.classList.toggle('on',s===b));render5();});
function draw5_1D(){
  const {ctx,w,h}=fit(p5),ax=Math.round(h*.55)+.5,padL=44,padR=44;
  const X=v=>padL+(v-158)/(202-158)*(w-padL-padR);
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(padL,ax);ctx.lineTo(w-padR,ax);ctx.stroke();
  ctx.font='10px '+FMONO;ctx.textAlign='center';ctx.textBaseline='top';
  for(let v=160;v<=200;v+=5){const x=X(v);
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.moveTo(x,ax-5);ctx.lineTo(x,ax+5);ctx.stroke();
    ctx.fillStyle='rgba(150,160,190,.9)';ctx.fillText(String(v),x,ax+9);}
  ATH.slice().sort((a,b)=>a.h-b.h).forEach((a,i)=>{
    const x=X(a.h),up=i%2===0,y=ax+(up?-1:1)*34;
    ctx.strokeStyle=C.x+'55';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,ax);ctx.lineTo(x,y+(up?10:-10));ctx.stroke();
    ctx.save();ctx.shadowColor=C.x;ctx.shadowBlur=14;
    ctx.beginPath();ctx.arc(x,ax,6,0,7);ctx.fillStyle=C.x;ctx.fill();ctx.restore();
    ctx.lineWidth=1.8;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(x,ax,6,0,7);ctx.stroke();
    ctx.font='600 11.5px '+FSANS;ctx.fillStyle='rgba(225,232,246,.95)';
    ctx.textAlign='center';ctx.textBaseline=up?'bottom':'top';ctx.fillText(a.n,x,y+(up?10:-10));});
  ctx.font='700 12px '+FSANS;ctx.fillStyle=C.x;ctx.textAlign='right';ctx.textBaseline='bottom';
  ctx.fillText(t('rl.ax1'),w-8,ax-14);
}
function render5(){
  document.getElementById('h5').textContent=t('rl.t'+DIM+'h');
  document.getElementById('t5').innerHTML=t('rl.t'+DIM);
  document.querySelectorAll('#tb5 [data-c]').forEach(el=>el.classList.toggle('on',+el.dataset.c<=DIM));
  const is3=DIM>=3;
  p5.style.display=is3?'none':'block';v5cv.style.display=is3?'block':'none';
  document.getElementById('v5ctl').style.display=is3?'flex':'none';
  document.getElementById('leg5').style.display=DIM>=4?'flex':'none';
  document.getElementById('leg5b').style.display=DIM>=5?'flex':'none';
  if(DIM===1)draw5_1D();
  else if(DIM===2)drawGraph(p5,{xmin:160,xmax:202,ymin:52,ymax:102,xstep:10,ystep:10,
    xlabel:t('rl.ax1'),ylabel:t('rl.ax2'),xcolor:C.x,ycolor:C.y,
    points:ATH.map(a=>({x:a.h,y:a.w,color:C.y,r:6.5,label:a.n}))});
  else{
    v5.cfg.labels=[t('rl.ax1'),t('rl.ax2'),t('rl.ax3')];
    v5.cfg.points=ATH.map(a=>({x:a.h,y:a.w,z:a.s,label:a.n,stem:true,
      r:DIM>=5?lerp(5,12,(a.e-46)/(72-46)):7,
      color:DIM>=4?rgba(ramp((a.j-47)/(76-47)),1):C.w}));
    v5.cfg.tag=t('rl.tag'+DIM);
    v5.dirty=true;
  }
}

/* ============================ apply language ============================ */
function redrawAll(){
  draw0();draw1();
  [nl2x,nl2y,nl3x,nl3y,nl3z,nl3x2,nl4x,nl4x2,nl4y2].forEach(n=>n.draw());
  set2(S2.x);set3('x',S3.x);set4('x',S4.x);
  buildSteps();render5();
  v3.onAuto(v3.auto);v4.onAuto(v4.auto);v5.onAuto(v5.auto);
  views.forEach(v=>v.dirty=true);
}
function applyLang(){
  document.documentElement.lang=LANG;
  document.title=t('title');
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.innerHTML=t(el.dataset.i18n);});
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  redrawAll();
}
document.getElementById('lang').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.dataset.l===LANG)return;
  LANG=b.dataset.l;try{localStorage.setItem('dimlang',LANG);}catch(err){}
  applyLang();
});

/* ============================ page chrome ============================ */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in');}),{threshold:.06});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
const pills=[...document.querySelectorAll('.pill')];
const spy=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)
  pills.forEach(p=>p.classList.toggle('on',p.getAttribute('href')==='#'+e.target.id));});},
  {rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('section.dim').forEach(s=>spy.observe(s));
addEventListener('scroll',()=>{
  const d=document.documentElement;
  document.getElementById('prog').style.width=(d.scrollTop/(d.scrollHeight-d.clientHeight)*100)+'%';
},{passive:true});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(redrawAll,140);});

applyLang();
</script>
