name: Draw flashcard diagrams

# Turns every TikZ diagram in flashcards/cards.js and flashcards/drafts/ into an SVG picture
# (flashcards/figures/), so students' phones don't have to download TikZJax and draw them.
on:
  push:
    branches: [main]
    paths:
      - 'flashcards/cards.js'
      - 'flashcards/drafts/**'
      - 'flashcards/cards-format.js'
      - 'flashcards/render-figures.mjs'
      - '.github/workflows/flashcards-figures.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flashcards-figures
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures dvisvgm

      - name: Draw diagrams
        run: node flashcards/render-figures.mjs

      - name: Commit pictures if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A flashcards/figures
          if git diff --cached --quiet; then
            echo "No diagram changes to commit."
            exit 0
          fi
          git commit -m "chore: update flashcard diagrams [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
