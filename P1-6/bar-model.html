<!doctype html>
<html lang="th" data-theme="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bar Model Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Mali:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ============ THEME TOKENS ============ */
:root{
  --ink:#1b1a17;
  --cream:#f4f1ea;
  --cream-2:#e6e0d3;
  --bg:#a3b09c;         /* muted backdrop */
  --hero:#ff5a1f;       /* hero */
  --accent:#2b5cff;     /* accent */
  --secondary:#ffc928;  /* secondary */
  --screen:#262923;
  --screen-2:#30342c;
  --screen-ink:#11120f;
  --dim:#8f9585;
  --ghost:#50554a;
  --muted:#6b675e;

  --bw:4px;
  --bw-s:3px;
  --shadow:4px 4px 0 var(--ink);
  --shadow-lg:7px 7px 0 var(--ink);
  --hi:inset 0 3px 0 rgba(255,255,255,.7);
  --lo:inset 0 -5px 0 rgba(27,26,23,.16);
  --r:18px;
  --gap:24px;
  /* Outfit for Latin; Mali (a looped Thai face, the style Thai schools teach reading with) fills in Thai glyphs */
  --f-head:"Outfit","Mali","Loma",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Share Tech Mono","Mali",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --micro-ls:.2em;
  --micro-size:10.5px;
}
html[data-theme="1"]{ --bg:#aaa3b8; --hero:#7a3cf0; --accent:#ff7a1a; --secondary:#34d399; }
html[data-theme="2"]{ --bg:#bdae92; --hero:#009e96; --accent:#ff4d6d; --secondary:#ffd23f; }
/* Thai: no wide tracking (it pulls tone marks off their consonants), bigger micro text, taller lines */
html:lang(th){ --micro-ls:.03em; --micro-size:12px; }
html:lang(th) body{line-height:1.6}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--f-head);
  font-weight:500;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  transition:background-color .25s;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}

.micro{
  font-family:var(--f-head);
  font-weight:800;
  font-size:var(--micro-size);
  letter-spacing:var(--micro-ls);
  text-transform:uppercase;
  line-height:1.1;
}
html:lang(th) .micro{line-height:1.35;font-weight:700}
.mono{font-family:var(--f-mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ LAYOUT ============ */
.app{
  max-width:1480px;
  margin:0 auto;
  padding:var(--gap);
  display:grid;
  grid-template-columns:minmax(0,250px) minmax(0,1fr) minmax(0,390px);
  grid-template-areas:"top top top" "rail stage side";
  gap:var(--gap);
  align-items:start;
}
.app > *{min-width:0}
.topbar{grid-area:top}
.rail{grid-area:rail;display:grid;grid-template-columns:minmax(0,1fr);gap:var(--gap)}
.stage{grid-area:stage}
.side{grid-area:side;display:grid;grid-template-columns:minmax(0,1fr);gap:var(--gap)}
.rail > *, .side > *{min-width:0}

/* tablets: rail on the left, device + question stacked on the right (no dead space under the device) */
@media (max-width:1240px){
  .app{grid-template-columns:minmax(0,240px) minmax(0,1fr);grid-template-areas:"top top" "rail stage" "rail side"}
}
@media (max-width:860px){
  :root{--gap:18px}
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "stage" "side" "rail";padding:16px}
  .rail{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
}

/* ============ PANELS ============ */
.panel{
  position:relative;
  background:var(--cream);
  border:var(--bw) solid var(--ink);
  border-radius:var(--r);
  box-shadow:var(--hi),var(--lo),var(--shadow);
  padding:28px 20px 20px;
  min-width:0;
}
.tag{
  position:absolute;
  top:-14px;left:16px;
  background:var(--ink);
  color:var(--cream);
  border-radius:999px;
  padding:6px 12px 5px;
  white-space:nowrap;
}

/* ============ TOP BAR ============ */
.topbar{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:18px 28px;
  padding:16px 20px;
}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{
  width:54px;height:54px;flex:none;
  background:var(--hero);
  border:var(--bw) solid var(--ink);
  border-radius:14px;
  box-shadow:var(--hi),var(--lo),3px 3px 0 var(--ink);
  display:grid;place-items:center;
  transition:background-color .25s;
}
h1{
  margin:0;
  font-weight:900;
  font-size:clamp(22px,2.4vw,30px);
  letter-spacing:-.01em;
  line-height:1.15;
}
.brand .micro{margin-top:6px;color:#5d5a52}

.top-right{display:flex;flex-wrap:wrap;align-items:stretch;gap:14px}
.stat{
  display:flex;flex-direction:column;justify-content:center;gap:7px;
  background:var(--cream-2);
  border:var(--bw-s) solid var(--ink);
  border-radius:14px;
  padding:10px 14px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55);
  min-width:92px;
}
.stat-row{display:flex;align-items:center;gap:10px}
.stat strong{font-weight:900;font-size:24px;line-height:1}
.stat .micro.note{color:var(--muted)}
.swatches{display:flex;gap:8px}
.swatch{
  width:38px;height:38px;padding:0;
  border:var(--bw-s) solid var(--ink);
  border-radius:12px;
  overflow:hidden;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  box-shadow:2px 2px 0 var(--ink);
  transition:transform .06s,box-shadow .06s;
}
.swatch span:first-child{grid-row:1 / 3}
.swatch:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.swatch[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:3px}

/* language segmented switch */
.langs{
  display:flex;
  border:var(--bw-s) solid var(--ink);
  border-radius:999px;
  background:var(--cream);
  padding:3px;
  gap:3px;
  box-shadow:2px 2px 0 var(--ink);
}
.langs button{
  border:0;border-radius:999px;
  background:transparent;
  padding:5px 12px 4px;
  font-weight:900;font-size:14px;line-height:1.2;
}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--cream);box-shadow:inset 0 2px 0 rgba(255,255,255,.2)}
.langs button:active{transform:translateY(1px)}

.meter{display:flex;gap:4px}
.seg{
  width:22px;height:14px;
  border:var(--bw-s) solid var(--ink);
  border-radius:5px;
  background:var(--cream);
}
.seg.on{background:var(--hero);box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}

.leds{
  display:flex;gap:5px;
  background:var(--screen);
  border:var(--bw-s) solid var(--ink);
  border-radius:999px;
  padding:4px 7px;
}
.led{
  width:12px;height:12px;border-radius:50%;
  background:#4a4e44;
  border:2px solid var(--screen-ink);
}
.led.on{background:var(--secondary);box-shadow:inset 0 2px 0 rgba(255,255,255,.7)}
.led.pop{animation:ledpop .4s}
@keyframes ledpop{40%{transform:scale(1.5)}}

/* ============ BUTTONS ============ */
.pill{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  max-width:100%;
  background:var(--cream);
  border:var(--bw) solid var(--ink);
  border-radius:999px;
  padding:12px 22px 11px;
  font-weight:900;
  font-size:15px;
  letter-spacing:.1em;
  text-transform:uppercase;
  box-shadow:var(--hi),var(--lo),var(--shadow);
  transition:transform .06s,box-shadow .06s;
}
html:lang(th) .pill{letter-spacing:.02em;font-size:16px;padding:10px 22px 9px}
.pill:active:not(:disabled){transform:translate(4px,4px);box-shadow:var(--hi),var(--lo),0 0 0 var(--ink)}
.pill:disabled{opacity:.45}
.pill .dot{flex:none;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--ink);background:var(--hero)}
.pill.block{width:100%}
.pill.glow .dot{animation:blink 1s steps(2) infinite}

.choice{
  display:flex;align-items:center;gap:12px;
  width:100%;min-width:0;
  text-align:left;
  background:var(--cream);
  border:var(--bw) solid var(--ink);
  border-radius:16px;
  padding:13px 16px 12px;
  font-weight:800;
  font-size:17px;
  box-shadow:var(--hi),var(--lo),var(--shadow);
  transition:transform .06s,box-shadow .06s,background-color .15s;
}
.choice:active:not(:disabled){transform:translate(4px,4px);box-shadow:var(--hi),var(--lo),0 0 0 var(--ink)}
.choice .sw{
  flex:none;width:30px;height:22px;border-radius:7px;
  border:var(--bw-s) solid var(--ink);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5);
}
.choice .sub{display:block;font-weight:700;font-size:12px;letter-spacing:var(--micro-ls);text-transform:uppercase;color:var(--muted);margin-top:2px}
html:lang(th) .choice .sub{font-size:13.5px}
.choice.wrong{background:var(--cream-2);opacity:.6}
.choice.wrong .main{text-decoration:line-through;text-decoration-thickness:3px}
.choices{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.op-choice{justify-content:center;flex-direction:column;gap:4px;padding:16px 10px 14px;text-align:center}
.op-choice .sym{
  width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;
  border:var(--bw) solid var(--ink);
  background:var(--secondary);
  font-weight:900;font-size:30px;line-height:1;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(0,0,0,.15);
}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* ============ LEFT RAIL ============ */
.levels{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.lvl{
  display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;
  width:100%;text-align:left;
  background:var(--cream);
  border:var(--bw-s) solid var(--ink);
  border-radius:14px;
  padding:8px 10px 8px 8px;
  box-shadow:var(--hi),var(--lo),3px 3px 0 var(--ink);
  transition:transform .06s,box-shadow .06s;
}
.lvl:active:not(:disabled){transform:translate(3px,3px);box-shadow:var(--hi),var(--lo),0 0 0 var(--ink)}
.lvl .num{
  width:40px;height:40px;border-radius:11px;
  border:var(--bw-s) solid var(--ink);
  background:var(--cream-2);
  display:grid;place-items:center;
  font-weight:900;font-size:20px;
}
.lvl .nm{font-weight:900;font-size:15px;line-height:1.2;display:block}
.lvl .ds{display:block;margin-top:3px;color:var(--muted)}
.lvl[aria-current="true"]{background:var(--ink);color:var(--cream)}
.lvl[aria-current="true"] .num{background:var(--hero);color:var(--cream)}
.lvl[aria-current="true"] .ds{color:#bdb8ab}
.lvl:disabled{background:var(--cream-2);box-shadow:none;opacity:.7}
.lvl.fresh{animation:fresh 1s 3}
@keyframes fresh{50%{background:var(--secondary)}}

.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{
  position:relative;flex:none;
  width:84px;height:44px;padding:0;
  background:var(--cream-2);
  border:var(--bw) solid var(--ink);
  border-radius:999px;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),3px 3px 0 var(--ink);
  transition:background-color .15s;
}
.switch::before{
  content:"";position:absolute;top:3px;left:3px;
  width:30px;height:30px;border-radius:50%;
  background:var(--cream);
  border:var(--bw) solid var(--ink);
  box-shadow:inset 0 3px 0 #fff,inset 0 -4px 0 rgba(0,0,0,.15);
  transition:transform .18s cubic-bezier(.3,1.5,.6,1);
}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::before{transform:translateX(40px)}
.switch-label strong{display:block;font-weight:900;font-size:17px;margin-top:6px}
.rail p{margin:12px 0 0;font-size:14px;color:#4c4943}

.legend{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.legend .sw{flex:none;width:34px;height:18px;border-radius:6px;border:var(--bw-s) solid var(--ink)}
.legend .sw.gap{background:repeating-linear-gradient(45deg,var(--secondary) 0 4px,var(--screen) 4px 8px)}

/* ============ HERO DEVICE ============ */
.device{
  position:relative;
  background:var(--cream);
  border:var(--bw) solid var(--ink);
  border-radius:30px;
  padding:22px 24px 26px;
  box-shadow:var(--hi),inset 0 -8px 0 rgba(27,26,23,.14),var(--shadow-lg);
  margin-bottom:26px;
}
.screw{
  position:absolute;width:16px;height:16px;border-radius:50%;
  background:var(--cream-2);border:3px solid var(--ink);
}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:50%;height:3px;margin-top:-1.5px;background:var(--ink);transform:rotate(-35deg)}
.screw.tl{top:12px;left:12px}.screw.tr{top:12px;right:12px}
.screw.bl{bottom:14px;left:12px}.screw.br{bottom:14px;right:12px}
.feet{position:absolute;left:0;right:0;bottom:-22px;display:flex;justify-content:space-between;padding:0 60px;pointer-events:none}
.feet span{width:70px;height:18px;background:var(--ink);border-radius:0 0 12px 12px}

.plate{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
  margin:0 18px 16px;
}
.plate-name{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;min-width:0}
.plate-name b{font-weight:900;font-size:20px;letter-spacing:.04em}
.plate-name .micro{color:var(--muted)}
.knobs{display:flex;align-items:center;gap:12px}
.power{width:14px;height:14px;border-radius:50%;background:var(--secondary);border:3px solid var(--ink);box-shadow:inset 0 2px 0 rgba(255,255,255,.7)}
.knob{
  width:34px;height:34px;border-radius:50%;
  background:var(--hero);border:var(--bw) solid var(--ink);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -4px 0 rgba(0,0,0,.2),2px 2px 0 var(--ink);
  position:relative;
}
.knob::after{content:"";position:absolute;top:3px;left:50%;width:4px;height:10px;margin-left:-2px;background:var(--ink);border-radius:2px}
.knob.b{background:var(--accent)}
.knob.b::after{transform:rotate(60deg);transform-origin:50% 12px}

.screen{
  background:var(--screen);
  border:var(--bw) solid var(--ink);
  border-radius:20px;
  padding:14px 16px 16px;
  box-shadow:inset 0 0 0 5px var(--screen-2),inset 0 6px 0 5px var(--screen-ink);
}
.status{
  display:flex;align-items:center;gap:10px;
  font-family:var(--f-mono);
  color:var(--secondary);
  font-size:15px;letter-spacing:.08em;
  padding:6px 8px 8px;
  border-bottom:2px dashed #4a4e44;
  margin-bottom:6px;
  min-height:32px;
}
html:lang(th) .status{letter-spacing:.02em;font-size:16px}
.status .blinker{flex:none;width:10px;height:10px;border-radius:50%;background:var(--secondary);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
#model svg{display:block;width:100%;height:auto}

.readouts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.readout{
  background:var(--screen-ink);
  border:var(--bw-s) solid var(--ink);
  border-radius:12px;
  padding:9px 12px 8px;
  min-width:0;
  box-shadow:inset 0 0 0 2px #2c3028;
}
.readout .lbl{display:flex;align-items:center;gap:7px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout .lbl .t{overflow:hidden;text-overflow:ellipsis}
.readout .lbl i{flex:none;width:10px;height:10px;border-radius:3px;border:2px solid var(--ink)}
.readout .val{
  display:block;margin-top:6px;
  font-family:var(--f-mono);
  font-size:clamp(20px,2.3vw,30px);
  line-height:1;
  color:var(--secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.readout .val.unk{color:var(--cream);animation:blink 1s steps(2) infinite}
.readout .val.off{color:#4c5046}
.readout .val.solved{color:var(--cream);background:var(--hero);border-radius:6px;padding:2px 6px;display:inline-block;max-width:100%}
.readout.eq{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.readout.eq .val{margin-top:0}
.screen.is-hidden .readouts{display:none}

/* SVG model styling */
.track{fill:var(--screen-2);stroke:var(--screen-ink);stroke-width:3}
.rule{stroke:#5b6053;stroke-width:3;stroke-linecap:round}
.bshadow{fill:var(--screen-ink)}
.bfill{stroke:var(--ink);stroke-width:4}
.big .bfill{fill:var(--hero)}
.small .bfill{fill:var(--accent)}
.ghost .bfill{fill:var(--ghost)}
.bhi{stroke:rgba(255,255,255,.6);stroke-width:3;stroke-linecap:round}
.blo{fill:rgba(0,0,0,.2)}
.gfill{fill:url(#hatch);stroke:var(--ink);stroke-width:4}
.gdash{fill:none;stroke:var(--secondary);stroke-width:3;stroke-dasharray:8 6}
.guide{stroke:var(--cream);stroke-width:2;stroke-dasharray:4 6;opacity:.45}
.bracket{fill:none;stroke:var(--secondary);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.chip-bg{fill:var(--cream);stroke:var(--ink);stroke-width:3}
.chip-tab.big{fill:var(--hero)}
.chip-tab.small{fill:var(--accent)}
.chip-tab.ghost{fill:var(--ghost)}
.chip-tab{stroke:var(--ink);stroke-width:2}
.chip-name{font:900 17px var(--f-head);fill:var(--ink)}
.chip-micro{font:800 8.5px var(--f-head);letter-spacing:.18em;fill:var(--muted)}
html:lang(th) .chip-name{font-size:19px;font-weight:700}
html:lang(th) .chip-micro{font-size:11.5px;letter-spacing:0;font-weight:700}
.dchip{fill:var(--secondary);stroke:var(--ink);stroke-width:3}
.dchip-t{font:900 12px var(--f-head);letter-spacing:.14em;fill:var(--ink)}
html:lang(th) .dchip-t{font-size:14px;letter-spacing:0;font-weight:700}
.val-t{font:900 26px var(--f-head);fill:var(--cream);stroke:var(--ink);stroke-width:5;paint-order:stroke;stroke-linejoin:round}
.val-t.small-t{font-size:21px}
.qm{font:900 34px var(--f-head);fill:var(--cream);stroke:var(--ink);stroke-width:6;paint-order:stroke;stroke-linejoin:round}
.ghost-q{font:900 30px var(--f-head);fill:#7b8072}
.unk-ring{fill:none;stroke:var(--cream);stroke-width:3;stroke-dasharray:10 7;animation:march .8s linear infinite}
@keyframes march{to{stroke-dashoffset:-17}}
.cell-line{stroke:var(--ink);stroke-width:2.5;opacity:.45}
.tile{fill:var(--cream);stroke:var(--ink);stroke-width:2.5}
.hit{cursor:pointer;outline:none}
.hit:hover .bfill,.hit:focus-visible .bfill,.hit:hover .gfill,.hit:focus-visible .gfill{stroke:var(--cream)}
.hit:hover .bshadow,.hit:focus-visible .bshadow{fill:var(--secondary)}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow .6s cubic-bezier(.3,1.35,.5,1) both}
.grow.d2{animation-delay:.12s}
.grow.d3{animation-delay:.24s}
@keyframes grow{from{transform:scaleX(.04)}}
.cover{fill:url(#stripes);stroke:var(--ink);stroke-width:4}
.cover-plate{fill:var(--cream);stroke:var(--ink);stroke-width:4}
.cover-t{font:900 24px var(--f-head);fill:var(--ink);letter-spacing:.06em}
.cover-m{font:800 10px var(--f-head);fill:var(--muted);letter-spacing:.2em}
html:lang(th) .cover-t{letter-spacing:0;font-weight:700}
html:lang(th) .cover-m{letter-spacing:0;font-size:14px;font-weight:700}

/* icon sprite classes */
.i-o{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.i-hero{fill:var(--hero)}
.i-acc{fill:var(--accent)}
.i-sec{fill:var(--secondary)}
.i-cream{fill:var(--cream)}
.i-none{fill:none}
.i-ink{fill:var(--ink)}

/* ============ RIGHT SIDE ============ */
.problem-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.thumb{
  flex:none;width:46px;height:46px;border-radius:12px;
  background:var(--cream-2);border:var(--bw-s) solid var(--ink);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.6);
  display:grid;place-items:center;
}
.thumb svg{width:34px;height:34px}
.problem-meta{flex:1;min-width:0}
.problem-meta .micro{color:var(--muted)}
.problem-meta strong{display:block;font-weight:900;font-size:16px;margin-top:4px}
.problem-text{font-size:20px;line-height:1.5;margin:0 0 18px;font-weight:600;overflow-wrap:anywhere}
html:lang(th) .problem-text{font-size:21px;line-height:1.75}
.problem-text .q{font-weight:900;display:block;margin-top:6px}
.problem-text .nm{font-weight:800;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:var(--secondary)}

.pips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:16px}
.pip{
  border:var(--bw-s) solid var(--ink);
  border-radius:9px;
  padding:6px 4px 5px;
  text-align:center;
  background:var(--cream-2);
  color:var(--muted);
  min-width:0;
  overflow-wrap:anywhere;
}
.pips .pip.micro{font-size:9.5px}
html:lang(th) .pips .pip.micro{font-size:12px}
.pip.now{background:var(--hero);color:var(--cream);box-shadow:inset 0 2px 0 rgba(255,255,255,.45)}
.pip.done{background:var(--ink);color:var(--cream)}
.prompt{font-weight:900;font-size:22px;line-height:1.25;margin:0 0 6px}
.prompt-sub{margin:0 0 16px;color:#57534b;font-size:15px}
html:lang(th) .prompt-sub{font-size:16px}

.why{
  background:var(--cream-2);
  border:var(--bw-s) solid var(--ink);
  border-radius:14px;
  padding:12px 14px;
  margin-bottom:16px;
  font-size:15px;
}
.why .micro{display:inline-block;background:var(--accent);color:var(--cream);border:2px solid var(--ink);border-radius:999px;padding:4px 8px 3px;margin-bottom:8px}
.why p{margin:0}
.why .trick{margin-top:8px;font-weight:700}

.eq-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.eq-row .expr{font-family:var(--f-mono);font-size:30px;line-height:1}
.answer{
  width:150px;max-width:100%;
  font-family:var(--f-mono);font-size:30px;line-height:1;
  padding:9px 12px 8px;
  background:#fff;
  border:var(--bw) solid var(--ink);
  border-radius:12px;
  box-shadow:inset 0 4px 0 rgba(0,0,0,.08);
}
.answer:focus{outline:3px dashed var(--ink);outline-offset:3px}
.solved-box{
  background:var(--ink);color:var(--cream);
  border:var(--bw) solid var(--ink);
  border-radius:14px;padding:14px 16px;margin-bottom:16px;
}
.solved-box .micro{color:var(--secondary)}
.solved-box p{margin:8px 0 0;font-size:18px;font-weight:700}
.actions-row{display:flex;flex-wrap:wrap;gap:12px}

.log{list-style:none;margin:0;padding:0;display:grid;gap:10px;max-height:340px;overflow:auto;padding-right:4px}
.log li{
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;
  font-size:14.5px;
  padding-bottom:10px;border-bottom:2px dashed #cfc8b8;
}
html:lang(th) .log li{font-size:15.5px}
.log li:last-child{border-bottom:0}
.log li.sep{grid-template-columns:minmax(0,1fr);border-bottom:0;padding:2px 0 0;color:#8a857a}
.badge{
  font-size:9.5px;
  border:2px solid var(--ink);
  border-radius:999px;
  padding:4px 8px 3px;
  min-width:52px;text-align:center;
  margin-top:1px;
}
html:lang(th) .badge{font-size:12px;padding:2px 8px 1px}
.b-ok{background:var(--secondary)}
.b-no{background:var(--hero);color:var(--cream)}
.b-hint{background:var(--cream-2)}
.b-why{background:var(--accent);color:var(--cream)}
.b-star{background:var(--ink);color:var(--secondary)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
@media (max-width:560px){
  .top-right{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .stat{min-width:0}
  .stat-row{gap:6px}
  .leds{gap:2px;padding:3px 4px}
  .led{width:9px;height:9px;border-width:1.5px}
  .readouts{grid-template-columns:1fr 1fr}
  .readout.diffro{grid-column:1 / -1}
  .problem-text{font-size:18px}
  .device{padding:18px 12px 22px}
  .plate{margin:0 10px 12px}
  .screen{padding:10px 8px 12px}
  .choices.two{grid-template-columns:minmax(0,1fr)}
  .feet{padding:0 36px}
}
</style>

/* ---------- state ---------- */
const S = {
  lang:'th',
  level:1, unlocked:1, theme:0,
  score:0, streak:0, best:0,
  lvStreak:[0,0,0,0,0],
  showModel:true,
  p:null, step:0, attempts:0, firstTry:true,
  count:0, animate:false, justScored:false, lastKey:'', freshUnlock:0,
};
const T = () => UI[S.lang];
const TH = () => S.lang === 'th';

function load(){
  try{
    const d = JSON.parse(localStorage.getItem('barModelLab.v1') || '{}');
    if (Number.isInteger(d.unlocked) && d.unlocked >= 1 && d.unlocked <= 4) S.unlocked = d.unlocked;
    if (Number.isInteger(d.theme) && d.theme >= 0 && d.theme < THEMES.length) S.theme = d.theme;
    if (Number.isInteger(d.best) && d.best >= 0) S.best = d.best;
    if (d.lang === 'en' || d.lang === 'th') S.lang = d.lang;

/* ---------- problem generator (language-neutral; text is built at render time) ---------- */
function numbersFor(lv){
  let s, d;
  if (lv === 1){ s = rnd(1,5); d = rnd(2,4); }                  // bigger ≤ 9, gap always obvious
  else if (lv === 2){ d = rnd(8,40); s = rnd(10, 99 - d); }      // all two-digit
  else { d = Math.random() < .7 ? rnd(101,450) : rnd(12,99); s = rnd(100, 999 - d); }
  return { s, d, b: s + d };
}

function makeProblem(lv){
  const numLv = lv === 4 ? pick([2,3,3]) : lv;
  const money = lv === 3 || (lv === 4 && Math.random() < .5);
  const obj = money ? { id: numLv >= 3 ? 'cash' : 'coin', money:true } : pick(OBJECTS);
  const { s, d, b } = numbersFor(numLv);

  const bi = rnd(0, NAMES.en.length - 1);
  let si = rnd(0, NAMES.en.length - 1); while (si === bi) si = rnd(0, NAMES.en.length - 1);

  // choose a variant, avoiding an exact repeat of the last one
  let type, phr, key, tries = 0;
  do{
    type = pick(['big','small','diff']);
    const trickP = type === 'diff' ? .5 : .35;
    const trickPhr = { big:'less', small:'more', diff:'more' }[type];
    const plainPhr = { big:'more', small:'less', diff:'less' }[type];
    phr = Math.random() < trickP ? trickPhr : plainPhr;
    key = type + phr;
  } while (key === S.lastKey && ++tries < 6);
  S.lastKey = key;

  const trick = (type==='big' && phr==='less') || (type==='small' && phr==='more') || (type==='diff' && phr==='more');
  return {
    lv, numLv, money, obj, type, phr, trick,
    op: type === 'big' ? 'add' : 'sub',
    answer: type === 'big' ? b : type === 'small' ? s : d,
    bi, si, b, s, diff:d,
    layout: rnd(0,2),
    bigFirst: Math.random() < .5,
    order: Math.random() < .5 ? ['big','small'] : ['small','big'],   // button order for step 1
  };
}

/* ---------- language-aware text builders ---------- */
const nameOf = (p, who) => NAMES[S.lang][who === 'big' ? p.bi : p.si];
const valOf = (p, part) => part === 'big' ? p.b : part === 'small' ? p.s : p.diff;
/* compact number for bars, readouts, equations */
const fmt = (p, n) => p.money && !TH() ? `$${n}` : String(n);
/* number with unit, for sentences */
const qty = (p, n) => TH() ? (p.money ? `${n} บาท` : `${n}`) : fmt(p, n);
const kwOf = p => TH() ? (p.phr === 'more' ? 'มากกว่า' : 'น้อยกว่า') : (p.phr === 'more' ? 'more' : (p.money ? 'less' : 'fewer'));
const opWord = op => TH() ? (op === 'add' ? 'บวก' : 'ลบ') : (op === 'add' ? 'ADD' : 'SUBTRACT');

/* Returns {lines:[...], question, rel} — each string plain text (escaped at render). */
function problemText(p){
  const B = nameOf(p,'big'), Sm = nameOf(p,'small'), b = p.b, s = p.s, d = p.diff;
  let facts, rel = null, question;
  if (TH()){
    const o = p.obj.th || {};
    const has = (n, v) => p.money ? `${n}มีเงิน ${v} บาท` : `${n}มี${o.n} ${v} ${o.c}`;
    const ask = n => p.money ? `${n}มีเงินกี่บาท` : `${n}มี${o.n}กี่${o.c}`;
    const relMore = p.money ? `${B}มีเงินมากกว่า${Sm} ${d} บาท` : `${B}มี${o.n}มากกว่า${Sm} ${d} ${o.c}`;
    const relLess = p.money ? `${Sm}มีเงินน้อยกว่า${B} ${d} บาท` : `${Sm}มี${o.n}น้อยกว่า${B} ${d} ${o.c}`;
    if (p.type === 'diff'){
      facts = p.bigFirst ? [has(B,b), has(Sm,s)] : [has(Sm,s), has(B,b)];
      question = p.phr === 'more'
        ? (p.money ? `${B}มีเงินมากกว่า${Sm}กี่บาท` : `${B}มี${o.n}มากกว่า${Sm}กี่${o.c}`)
        : (p.money ? `${Sm}มีเงินน้อยกว่า${B}กี่บาท` : `${Sm}มี${o.n}น้อยกว่า${B}กี่${o.c}`);
    } else {
      rel = p.phr === 'more' ? relMore : relLess;
      const [kn, kv, un] = p.type === 'big' ? [Sm, s, B] : [B, b, Sm];
      if (p.layout === 0){ facts = [rel, has(kn,kv)]; question = ask(un); }
      else if (p.layout === 1){ facts = [has(kn,kv), rel]; question = ask(un); }
      else { facts = [rel]; question = `ถ้า${has(kn,kv)} ${ask(un)}`; }
    }
    return { lines:facts, question, rel };
  }
  const o = p.obj.en || {};
  const amt = n => p.money ? `$${n}` : `${n} ${n === 1 ? o.sg : o.pl}`;
  const has = (n, v) => `${n} has ${amt(v)}.`;
  const ask = n => p.money ? `How much money does ${n} have?` : `How many ${o.pl} does ${n} have?`;
  const askLow = n => p.money ? `how much money does ${n} have?` : `how many ${o.pl} does ${n} have?`;
  const relMore = p.money ? `${B} has $${d} more than ${Sm}.` : `${B} has ${d} more ${o.pl} than ${Sm}.`;
  const relLess = p.money ? `${Sm} has $${d} less than ${B}.` : `${Sm} has ${d} fewer ${o.pl} than ${B}.`;
  if (p.type === 'diff'){
    facts = p.bigFirst ? [has(B,b), has(Sm,s)] : [has(Sm,s), has(B,b)];
    question = p.phr === 'more'
      ? (p.money ? `How much more money does ${B} have than ${Sm}?` : `How many more ${o.pl} does ${B} have than ${Sm}?`)
      : (p.money ? `How much less money does ${Sm} have than ${B}?` : `How many fewer ${o.pl} does ${Sm} have than ${B}?`);
  } else {
    rel = p.phr === 'more' ? relMore : relLess;
    const [kn, kv, un] = p.type === 'big' ? [Sm, s, B] : [B, b, Sm];
    if (p.layout === 0){ facts = [rel, has(kn,kv)]; question = ask(un); }
    else if (p.layout === 1){ facts = [has(kn,kv), rel]; question = ask(un); }
    else { facts = [rel]; question = `If ${kn} has ${amt(kv)}, ${askLow(un)}`; }
  }
  return { lines:facts, question, rel };
}

/* Escape a sentence and emphasise the two names so kids can find who is who. */
function markNames(p, text){
  let h = esc(text);
  [nameOf(p,'big'), nameOf(p,'small')].forEach(n => { h = h.split(esc(n)).join(`<span class="nm">${esc(n)}</span>`); });
  return h;
}

function partDesc(p, part){
  const B = nameOf(p,'big'), Sm = nameOf(p,'small');
  if (TH()) return part === 'big' ? `จำนวนของ${B} (แท่งยาว)` : part === 'small' ? `จำนวนของ${Sm} (แท่งสั้น)` : 'ผลต่าง (ส่วนที่ยื่นเกิน)';
  return part === 'big' ? `${B}'s amount (the long bar)` : part === 'small' ? `${Sm}'s amount (the short bar)` : 'the difference (the gap)';
}
function exprOf(p){
  if (p.type === 'big')   return `${fmt(p,p.s)} + ${fmt(p,p.diff)}`;
  if (p.type === 'small') return `${fmt(p,p.b)} ${MINUS} ${fmt(p,p.diff)}`;
  return `${fmt(p,p.b)} ${MINUS} ${fmt(p,p.s)}`;
}
function answerSentence(p){
  const B = nameOf(p,'big'), Sm = nameOf(p,'small'), n = p.answer;
  if (TH()){
    const o = p.obj.th || {};
    if (p.type === 'diff') return p.money ? `${B}มีเงินมากกว่า${Sm} ${n} บาท` : `${B}มี${o.n}มากกว่า${Sm} ${n} ${o.c}`;
    const who = p.type === 'big' ? B : Sm;
    return p.money ? `${who}มีเงิน ${n} บาท` : `${who}มี${o.n} ${n} ${o.c}`;
  }
  const o = p.obj.en || {};
  const u = p.money ? '' : ` ${n === 1 ? o.sg : o.pl}`;
  if (p.type === 'big')   return `${B} has ${fmt(p,n)}${u}.`;
  if (p.type === 'small') return `${Sm} has ${fmt(p,n)}${u}.`;
  return p.money ? `${B} has $${n} more than ${Sm}.` : `${B} has ${n} more ${o.pl} than ${Sm}.`;
}
function whyText(p){
  const e = esc(exprOf(p));
  if (TH()){
    if (p.type === 'big')   return `<b>แท่งยาว = แท่งสั้น + ผลต่าง</b> ส่วนที่ไม่รู้คือ<b>แท่งยาวทั้งแท่ง</b> เราจึงนำสองส่วนมารวมกัน คือ <b>บวก</b> &nbsp;${e}`;
    if (p.type === 'small') return `<b>แท่งสั้น = แท่งยาว ${MINUS} ผลต่าง</b> ส่วนที่ไม่รู้เป็น<b>ชิ้นส่วนหนึ่ง</b>ของแท่งยาว เราจึงเอาผลต่างออก คือ <b>ลบ</b> &nbsp;${e}`;
    return `<b>ผลต่าง = แท่งยาว ${MINUS} แท่งสั้น</b> ผลต่างคือส่วนที่เหลือเมื่อเอาแท่งสั้นออกจากแท่งยาว คือ <b>ลบ</b> &nbsp;${e}`;
  }
  if (p.type === 'big')   return `The <b>long bar = short bar + gap</b>. The unknown is the <b>whole long bar</b>, so we put the two pieces together: <b>ADD</b>. &nbsp;${e}`;
  if (p.type === 'small') return `The <b>short bar = long bar ${MINUS} gap</b>. The unknown is a <b>piece</b> of the long bar, so we take the gap away: <b>SUBTRACT</b>. &nbsp;${e}`;
  return `The <b>gap = long bar ${MINUS} short bar</b>. The gap is what's left when you take the short bar away from the long bar: <b>SUBTRACT</b>. &nbsp;${e}`;
}
function trickText(p){
  return TH()
    ? `ข้อนี้หลอก! โจทย์ใช้คำว่า “${esc(kwOf(p))}” แต่รูปบอกว่าต้อง<b>${opWord(p.op)}</b> เชื่อรูป อย่าเชื่อแค่คำสำคัญ`
    : `Tricky one! The problem says “${esc(kwOf(p))}”, but the picture says <b>${opWord(p.op)}</b>. Trust the picture, not the keyword.`;
}

const BADGE_CLS = { ok:'b-ok', no:'b-no', hint:'b-hint', why:'b-why', star:'b-star' };

/* ---------- model drawing (hero) ---------- */
const MX0 = 140, MW = 440, LH = 60, YT = 30, YB = 122, VW = 600, VH = 276;

function barShape(x, y, w, h, cls, attrs){
  return `<g class="barg ${cls}" ${attrs || ''}>
    <rect class="bshadow" x="${x+5}" y="${y+6}" width="${w}" height="${h}" rx="12"/>
    <rect class="bfill" x="${x}" y="${y}" width="${w}" height="${h}" rx="12"/>
    <rect class="blo" x="${x+7}" y="${y+h-13}" width="${Math.max(0,w-14)}" height="7" rx="3.5"/>
    <line class="bhi" x1="${x+12}" y1="${y+7}" x2="${Math.max(x+12,x+w-12)}" y2="${y+7}"/>
  </g>`;
}
function chip(y, name, micro, tone){
  const th = TH();
  return `<g>
    <rect class="chip-bg" x="8" y="${y}" width="116" height="${LH}" rx="12"/>
    <rect class="chip-tab ${tone}" x="16" y="${y+10}" width="9" height="${LH-20}" rx="3"/>
    <text class="chip-micro" x="34" y="${y + (th ? 24 : 23)}">${esc(micro)}</text>
    <text class="chip-name" x="34" y="${y + (th ? 48 : 44)}">${esc(name)}</text>
  </g>`;
}
function icons(x0, y, unit, n, id){
  const size = Math.min(unit - 12, LH - 22), pad = (unit - size) / 2;
  let o = '';
  for (let i = 0; i < n; i++){
    const x = x0 + i * unit + pad, yy = y + (LH - size) / 2 - 1;
    o += `<rect class="tile" x="${x-2}" y="${yy-2}" width="${size+4}" height="${size+4}" rx="7"/>`;
    o += `<use href="#ic-${id}" x="${x}" y="${yy}" width="${size}" height="${size}"/>`;
  }
  return o;
}
function cellLines(x0, y, unit, n){
  let o = '';
  for (let i = 1; i < n; i++){ const x = x0 + i * unit; o += `<line class="cell-line" x1="${x}" y1="${y+6}" x2="${x}" y2="${y+LH-6}"/>`; }
  return o;
}
function ruler(){
  const ry = VH - 14;
  let o = `<line class="rule" x1="${MX0}" y1="${ry}" x2="${MX0+MW}" y2="${ry}"/>`;
  for (let i = 0; i <= 20; i++){
    const x = MX0 + MW * i / 20, len = i % 10 === 0 ? 12 : i % 5 === 0 ? 8 : 4;
    o += `<line class="rule" x1="${x}" y1="${ry}" x2="${x}" y2="${ry-len}"/>`;
  }
  return o;
}

function drawModel(){
  const box = $('#model');
  $('#screen').classList.toggle('is-hidden', !S.showModel);
  const p = S.p, st = S.step, t = T();
  let o = `<svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="${esc(modelAria())}">`;

  if (!S.showModel){
    o += `<rect class="cover" x="6" y="8" width="${VW-12}" height="${VH-16}" rx="16"/>
      <rect class="cover-plate" x="${VW/2-180}" y="${VH/2-50}" width="360" height="100" rx="16"/>
      <text class="cover-t" x="${VW/2}" y="${VH/2+2}" text-anchor="middle">${esc(t.coverT)}</text>
      <text class="cover-m" x="${VW/2}" y="${VH/2+28}" text-anchor="middle">${esc(t.coverM)}</text>`;
    box.innerHTML = o + '</svg>';
    return;
  }

  o += `<rect class="track" x="${MX0-8}" y="${YT-8}" width="${MW+16}" height="${LH+16}" rx="16"/>`;
  o += `<rect class="track" x="${MX0-8}" y="${YB-8}" width="${MW+16}" height="${LH+16}" rx="16"/>`;
  o += ruler();

  if (st === 0){
    const w = Math.round(MW * .6);
    o += chip(YT, '???', t.who, 'ghost') + chip(YB, '???', t.who, 'ghost');
    o += barShape(MX0, YT, w, LH, 'ghost') + barShape(MX0, YB, w, LH, 'ghost');
    o += `<text class="ghost-q" x="${MX0 + w/2}" y="${YT+LH/2+11}" text-anchor="middle">?</text>`;
    o += `<text class="ghost-q" x="${MX0 + w/2}" y="${YB+LH/2+11}" text-anchor="middle">?</text>`;
    box.innerHTML = o + '</svg>';
    return;
  }

  const L1 = p.numLv === 1;
  const ratio = L1 ? p.s / p.b : Math.min(.82, Math.max(.18, p.s / p.b));
  const wS = Math.round(MW * ratio), xG = MX0 + wS, wG = MW - wS;
  const show = part => st >= 4 || (st >= 2 && part !== p.type);
  const unk  = part => st >= 2 && st < 4 && part === p.type;
  const hitA = part => st === 1 ? `data-part="${part}" tabindex="0" role="button" aria-label="${esc(partDesc(p, part))}"` : '';
  const hitC = st === 1 ? ' hit' : '';
  const g = S.animate ? ' grow' : '';

  o += chip(YT, nameOf(p,'big'), t.hasMore, 'big') + chip(YB, nameOf(p,'small'), t.hasLess, 'small');

  // guide line where the short bar ends
  o += `<line class="guide" x1="${xG}" y1="${YT-4}" x2="${xG}" y2="${YB+LH+4}"/>`;

  o += barShape(MX0, YT, MW, LH, 'big' + hitC + g, hitA('big'));
  o += barShape(MX0, YB, wS, LH, 'small' + hitC + g + ' d2', hitA('small'));
  o += `<g class="gapg${hitC}${g} d3" ${hitA('diff')}>
          <rect class="gfill" x="${xG+4}" y="${YB}" width="${wG-4}" height="${LH}" rx="12"/>
          <rect class="gdash" x="${xG+10}" y="${YB+6}" width="${Math.max(0,wG-16)}" height="${LH-12}" rx="8"/>
        </g>`;

  // contents
  const unit = MW / p.b;
  const tiles = L1 && !p.money;
  if (tiles && show('big')) o += cellLines(MX0, YT, unit, p.b) + icons(MX0, YT, unit, p.b, p.obj.id);
  else if (show('big')) o += `<text class="val-t" x="${MX0+MW/2}" y="${YT+LH/2+9}" text-anchor="middle">${esc(fmt(p,p.b))}</text>`;
  if (tiles && show('small')) o += cellLines(MX0, YB, unit, p.s) + icons(MX0, YB, unit, p.s, p.obj.id);
  else if (show('small')) o += `<text class="val-t${wS<110?' small-t':''}" x="${MX0+wS/2}" y="${YB+LH/2+9}" text-anchor="middle">${esc(fmt(p,p.s))}</text>`;
  if (tiles && show('diff')) o += icons(xG, YB, unit, p.diff, p.obj.id);
  else if (show('diff')) o += `<text class="val-t${wG<110?' small-t':''}" x="${xG+wG/2}" y="${YB+LH/2+9}" text-anchor="middle">${esc(fmt(p,p.diff))}</text>`;

  // the unknown: marching ring + big ?
  const ringFor = { big:[MX0, YT, MW], small:[MX0, YB, wS], diff:[xG+4, YB, wG-4] };
  ['big','small','diff'].forEach(part => {
    if (!unk(part)) return;
    const [x, y, w] = ringFor[part];
    o += `<rect class="unk-ring" x="${x-7}" y="${y-7}" width="${w+14}" height="${LH+14}" rx="16"/>`;
    o += `<text class="qm" x="${x+w/2}" y="${y+LH/2+12}" text-anchor="middle">?</text>`;
  });

  // difference bracket + chip (chip width is fitted to the real text after render)
  const by = YB + LH + 16, cx = xG + wG / 2;
  o += `<path class="bracket" d="M${xG+4} ${by} v9 H${MX0+MW} v-9 M${cx} ${by+9} v8"/>`;
  const dLabel = show('diff') ? `${t.diffChip} = ${fmt(p,p.diff)}` : unk('diff') ? `${t.diffChip} = ?` : t.diffChip;
  o += `<g id="dchip" data-cx="${cx}"><rect class="dchip" x="${cx-60}" y="${by+18}" width="120" height="30" rx="15"/>`;
  o += `<text class="dchip-t" x="${cx}" y="${by+38}" text-anchor="middle">${esc(dLabel)}</text></g>`;

  box.innerHTML = o + '</svg>';
  fitDiffChip();
  S.animate = false;
}
function fitDiffChip(){
  const g = document.getElementById('dchip'); if (!g) return;
  const text = g.querySelector('text'), rect = g.querySelector('rect');
  let w = 120;
  try{ w = text.getComputedTextLength() + 28; }catch(e){}
  if (!w || w < 60) w = 120;
  const cx = +g.dataset.cx;
  const x = Math.min(MX0 + MW - w, Math.max(MX0 - 60, cx - w / 2));
  rect.setAttribute('x', x); rect.setAttribute('width', w);
  text.setAttribute('x', x + w / 2);
}

function modelAria(){
  const p = S.p;
  if (!p) return 'Bar model';
  if (TH()){
    if (!S.showModel) return 'ซ่อนบาร์โมเดลอยู่';
    if (S.step === 0) return 'แท่งว่างสองแท่ง ขั้นแรกให้หาว่าใครมีมากกว่า';
    return `บาร์โมเดล: ${nameOf(p,'big')} ได้แท่งยาว ${nameOf(p,'small')} ได้แท่งสั้น ส่วนที่ยื่นเกินคือผลต่าง`;
  }
  if (!S.showModel) return 'Bar model hidden';
  if (S.step === 0) return 'Two blank bars. First decide who has more.';
  return `Bar model: ${nameOf(p,'big')} has the long bar, ${nameOf(p,'small')} has the short bar, and the gap between them is the difference.`;
}

function renderTop(){

  $('#lvlNum').textContent = S.level;
  const prog = Math.min(UNLOCK, S.lvStreak[S.level]);
  $('#meter').innerHTML = Array.from({length:UNLOCK}, (_, i) => `<span class="seg${i < prog ? ' on' : ''}"></span>`).join('');
  $('#meterLbl').textContent = S.level === 4 ? (prog >= UNLOCK ? t.mastered : t.toMaster(UNLOCK-prog))
    : S.unlocked > S.level ? (prog >= UNLOCK ? t.unlocked : t.lvOpen(S.level+1)) : t.toUnlock(UNLOCK-prog);
  const lit = Math.min(LED_COUNT, S.streak);
  $('#leds').innerHTML = Array.from({length:LED_COUNT}, (_, i) =>
    `<span class="led${i < lit ? ' on' : ''}${i === lit-1 && S.justScored ? ' pop' : ''}"></span>`).join('');
  S.justScored = false;
  $('#streakNum').textContent = S.streak;
  $('#bestNum').textContent = S.best;
  $('#scoreNum').textContent = String(S.score).padStart(4, '0');
}

function renderSwatches(){
  $('#swatches').innerHTML = THEMES.map((th, i) => {
    const n = th[S.lang];
    return `<button class="swatch" data-theme="${i}" aria-pressed="${i === S.theme}" aria-label="${esc(T().themeLabel(n))}" title="${esc(n)}">
      <span style="background:${th.bg}"></span><span style="background:${th.hero}"></span><span style="background:${th.acc}"></span>
    </button>`;
  }).join('');
  document.documentElement.dataset.theme = S.theme;
}

const LOCK = `<svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><rect x="2" y="8" width="14" height="10" rx="3" style="fill:var(--cream-2);stroke:var(--ink);stroke-width:2.5"/><path d="M5 8V6a4 4 0 0 1 8 0v2" style="fill:none;stroke:var(--ink);stroke-width:2.5"/></svg>`;
function renderLevels(){
  const t = T();
  $('#levels').innerHTML = [1,2,3,4].map(n => {
    const locked = n > S.unlocked;
    return `<button class="lvl${S.freshUnlock === n ? ' fresh' : ''}" data-level="${n}" ${locked ? 'disabled' : ''} aria-current="${n === S.level}">
      <span class="num">${n}</span>
      <span><span class="nm">${esc(t.levels[n].name)}</span><span class="ds micro">${esc(t.levels[n].sub)}</span></span>
      ${locked ? LOCK + `<span class="sr">${esc(t.locked)}</span>` : ''}
    </button>`;
  }).join('');
}

function renderToggle(){
  $('#toggle').setAttribute('aria-checked', String(S.showModel));
  $('#toggleTxt').textContent = S.showModel ? T().shown : T().hidden;
}

/* ---------- right side ---------- */
function renderProblem(){
  const p = S.p, t = T(), txt = problemText(p);
  $('#thumb').innerHTML = `<svg viewBox="0 0 40 40"><use href="#ic-${p.obj.id}"/></svg>`;
  $('#probNo').textContent = t.problemNo(S.count);
  $('#probLvl').textContent = t.levelName(p.lv, t.levels[p.lv].name);
  $('#problemText').innerHTML = txt.lines.map(l => markNames(p, l)).join(' ') + `<span class="q">${markNames(p, txt.question)}</span>`;
}

function renderPips(){
  $('#pips').innerHTML = T().steps.map((l, i) =>
    `<span class="pip micro ${i < S.step ? 'done' : i === S.step ? 'now' : ''}">${i < S.step ? '✓ ' : ''}${esc(l)}</span>`).join('');
}

function renderWhy(){
  const p = S.p;
  const title = TH() ? `ทำไมต้อง${opWord(p.op)}?` : `Why ${p.op === 'add' ? 'add' : 'subtract'}?`;
  $('#why').innerHTML = S.step >= 3
    ? `<div class="why"><span class="micro">${esc(title)}</span><p>${whyText(p)}</p>${p.trick ? `<p class="trick">${trickText(p)}</p>` : ''}</div>`
    : '';
}

function renderQuestion(){
  const p = S.p, q = $('#question'), th = TH(), t = T();
  let h = '';
  if (S.step === 0){
    h = th
      ? `<p class="prompt">ใครมีมากกว่า?</p><p class="prompt-sub">อ่านโจทย์ คนที่มีมากกว่าจะได้<b>แท่งยาว</b></p>`
      : `<p class="prompt">Who has MORE?</p><p class="prompt-sub">Read the problem. The one with more gets the <b>long bar</b>.</p>`;
    h += `<div class="choices two">${p.order.map(w =>
        `<button class="choice" data-who="${w}"><span class="sw" style="background:var(--cream-2)"></span><span class="main">${esc(nameOf(p,w))}</span></button>`).join('')}</div>`;
  } else if (S.step === 1){
    const opt = (part, main, sub, color) =>
      `<button class="choice" data-part="${part}"><span class="sw" style="background:${color}"></span><span><span class="main">${esc(main)}</span><span class="sub">${esc(sub)}</span></span></button>`;
    h = th
      ? `<p class="prompt">ส่วนไหนที่เรายังไม่รู้?</p><p class="prompt-sub">ตัวเลขแต่ละตัวในโจทย์จะเติมลงในส่วนหนึ่งของรูป ${S.showModel ? 'แตะส่วนที่ไม่มีตัวเลข บนรูปหรือปุ่มด้านล่าง' : 'เลือกส่วนที่ไม่มีตัวเลข'}</p>`
      : `<p class="prompt">Which part is UNKNOWN?</p><p class="prompt-sub">Every number in the problem fills one part. ${S.showModel ? 'Tap the part with no number — on the model or below.' : 'Pick the part with no number.'}</p>`;
    h += `<div class="choices">
        ${opt('big', nameOf(p,'big'), th ? 'แท่งยาว · มีมากกว่า' : 'Long bar · has more', 'var(--hero)')}
        ${opt('small', nameOf(p,'small'), th ? 'แท่งสั้น · มีน้อยกว่า' : 'Short bar · has less', 'var(--accent)')}
        ${opt('diff', t.difference, th ? 'ส่วนที่ยื่นเกินออกมา' : 'The gap between them', 'var(--secondary)')}
      </div>`;
  } else if (S.step === 2){
    h = th
      ? `<p class="prompt">จะหาส่วนที่ไม่รู้ ต้องบวกหรือลบ?</p><p class="prompt-sub">ดูรูป: ส่วนที่ไม่รู้เป็น<b>แท่งเต็ม</b>ที่เกิดจากชิ้นส่วนมาต่อกัน หรือเป็นแค่<b>ชิ้นส่วนหนึ่ง</b>?</p>`
      : `<p class="prompt">To find the unknown, do we add or subtract?</p><p class="prompt-sub">Look at the picture: is the unknown a <b>whole</b> bar made of pieces, or a <b>piece</b>?</p>`;
    h += `<div class="choices two">
        <button class="choice op-choice" data-op="add"><span class="sym" aria-hidden="true">+</span><span class="main">${esc(opWord('add'))}</span></button>
        <button class="choice op-choice" data-op="sub"><span class="sym" aria-hidden="true">${MINUS}</span><span class="main">${esc(opWord('sub'))}</span></button>
      </div>`;
  } else if (S.step === 3){
    h = th
      ? `<p class="prompt">ลองหาคำตอบ</p><p class="prompt-sub">พิมพ์คำตอบ${p.money ? ' (เป็นบาท)' : ''}</p>`
      : `<p class="prompt">Now solve it.</p><p class="prompt-sub">Type your answer${p.money ? ' in dollars' : ''}.</p>`;
    h += `<form id="ansForm" autocomplete="off">
        <div class="eq-row">
          <span class="expr">${esc(exprOf(p))} =</span>
          <label class="sr" for="ans">${th ? 'คำตอบ' : 'Your answer'}</label>
          <input class="answer" id="ans" inputmode="numeric" maxlength="7" placeholder="?">
        </div>
        <button class="pill" type="submit"><span class="dot" aria-hidden="true"></span>${th ? 'ตรวจคำตอบ' : 'Check answer'}</button>
      </form>`;
  } else {
    const next = S.freshUnlock && S.freshUnlock !== S.level
      ? `<button class="pill" data-go="${S.freshUnlock}"><span class="dot" aria-hidden="true"></span>${th ? `ไประดับ ${S.freshUnlock}` : `Go to level ${S.freshUnlock}`}</button>` : '';
    h = `<div class="solved-box"><span class="micro">${th ? 'ถูกต้อง' : 'Solved'}</span><p>${esc(answerSentence(p))}</p></div>
      <div class="actions-row"><button class="pill glow" id="nextBtn"><span class="dot" aria-hidden="true"></span>${esc(t.newProblem)}</button>${next}</div>`;
  }
  q.innerHTML = h;
  if (S.step === 3){ const i = $('#ans'); if (i) i.focus({preventScroll:true}); }
}

function renderAll(){
  applyStatic(); renderSwatches();
  renderTop(); renderLevels(); renderToggle();
  renderProblem(); renderPips(); renderWhy(); renderQuestion();
  drawModel(); updateReadouts(); updateStatus();
}

/* ---------- flow ---------- */
function newProblem(){
  S.count++;
  S.p = makeProblem(S.level);
  S.step = 0; S.attempts = 0; S.firstTry = true;
  if (S.level === 4) S.showModel = false;
  const t = T();
  log('sep', esc(`${t.problemNo(S.count)} · ${t.level} ${S.level}`));
  renderAll();
}

function advance(to){
  S.step = to;
  if (to === 1) S.animate = true;
  renderPips(); renderWhy(); renderQuestion(); drawModel(); updateReadouts(); updateStatus();
}

function wrongButton(btn){
  if (!btn) return;
  btn.classList.add('wrong','shake');
  btn.disabled = true;
}

function chooseWho(who, btn){
  const p = S.p, th = TH();
  const B = esc(nameOf(p,'big')), Sm = esc(nameOf(p,'small'));
  if (who === 'big'){
    log('ok', th
      ? `ใช่เลย! <b>${B}</b> มีมากกว่า ${B}จึงได้<b>แท่งยาว</b> และ${Sm}ได้<b>แท่งสั้น</b>`
      : `Yes! <b>${B}</b> has more, so ${B} gets the <b>long bar</b> and ${Sm} gets the <b>short bar</b>.`);
    advance(1);
    return;
  }
  wrongButton(btn);
  const rel = problemText(p).rel;
  let msg;
  if (rel){
    if (th) msg = p.phr === 'less'
      ? `ลองอ่านอีกครั้ง: “${esc(rel)}” — ${Sm}คือคนที่มี<b>น้อยกว่า</b> แล้วแท่งของใครยาวกว่า?`
      : `ลองอ่านอีกครั้ง: “${esc(rel)}” — ${B}มี<b>มากกว่า</b>${Sm} แล้วแท่งของใครยาวกว่า?`;
    else msg = p.phr === 'less'
      ? `Read it again: “${esc(rel)}” — ${Sm} is the one with <b>${esc(kwOf(p))}</b>. So whose bar sticks out further?`
      : `Read it again: “${esc(rel)}” — ${B} has <b>more</b> than ${Sm}. So whose bar is longer?`;
  } else {
    msg = th
      ? `ลองเทียบตัวเลข: ${B}มี ${esc(qty(p,p.b))} ส่วน${Sm}มี ${esc(qty(p,p.s))} ตัวเลขที่มากกว่าจะได้แท่งที่ยาวกว่า`
      : `Compare the numbers: ${B} has ${esc(qty(p,p.b))} and ${Sm} has ${esc(qty(p,p.s))}. The bigger number gets the longer bar.`;
  }
  log('no', msg);
}

function choosePart(part, btn){
  const p = S.p, th = TH();
  if (part === p.type){
    const known = ['big','small','diff'].filter(x => x !== part).map(x => `${esc(partDesc(p,x))} = <b>${esc(qty(p,valOf(p,x)))}</b>`);
    log('ok', th
      ? `ถูกต้อง — คำถามถามหา${esc(partDesc(p,part))} ส่วนที่เรารู้แล้วคือ ${known.join(' และ ')}`
      : `Right — the question asks for ${esc(partDesc(p,part))}. We know ${known.join(' and ')}.`);
    advance(2);
    return;
  }
  if (!btn) btn = document.querySelector(`#question [data-part="${part}"]`);
  wrongButton(btn);
  const qn = esc(problemText(p).question);
  log('no', th
    ? `โจทย์บอกแล้วว่า${esc(partDesc(p,part))} เท่ากับ <b>${esc(qty(p,valOf(p,part)))}</b> ส่วนนี้จึง<b>รู้ค่าแล้ว</b> คำถามถามหาตัวเลขไหน? “${qn}”`
    : `The problem tells us ${esc(partDesc(p,part))} is <b>${esc(qty(p,valOf(p,part)))}</b>, so that part is <b>known</b>. Which number is the question asking for? “${qn}”`);
  if (S.showModel) flashScreen();
}

function chooseOp(op, btn){
  const p = S.p, th = TH();
  if (op === p.op){
    log('ok', th ? `ใช่ — <b>${opWord(p.op)}</b>` : `Yes — <b>${p.op === 'add' ? 'add' : 'subtract'}</b>.`);
    log('why', whyText(p));
    if (p.trick) log('star', trickText(p));
    advance(3);
    return;
  }
  wrongButton(btn);
  const B = esc(nameOf(p,'big')), Sm = esc(nameOf(p,'small'));
  const lured = p.trick && ((p.phr === 'more' && op === 'add') || (p.phr !== 'more' && op === 'sub'));
  let msg = '';
  if (th){
    if (lured) msg = `คำว่า “${esc(kwOf(p))}” ทำให้อยาก${opWord(op)}ใช่ไหม? คำสำคัญหลอกเราได้ แต่รูปหลอกเราไม่ได้ `;
    if (p.type === 'big') msg += `ดูรูป — ส่วนที่ไม่รู้คือ<b>แท่งยาว</b> ซึ่ง<b>ยาวกว่า</b>แท่งของ${Sm} (${esc(qty(p,p.s))}) ถ้าลบ แท่งจะสั้นลง!`;
    else if (p.type === 'small') msg += `ดูรูป — ส่วนที่ไม่รู้คือ<b>แท่งสั้น</b> ซึ่ง<b>สั้นกว่า</b>แท่งของ${B} (${esc(qty(p,p.b))}) ถ้าบวก แท่งจะยาวขึ้นไปอีก!`;
    else msg += `ดูรูป — ส่วนที่ไม่รู้เป็นแค่<b>ผลต่าง</b> คือส่วนที่ยื่นเกินออกมาจากแท่งยาว ถ้าบวกสองแท่งเข้าด้วยกัน จะได้ยาวกว่าทั้งสองแท่งเสียอีก!`;
    if (!S.showModel) msg += ' เคล็ดลับ: เปิดสวิตช์<b>บาร์โมเดล</b>เพื่อดูรูป';
  } else {
    if (lured) msg = `Did the word “${esc(kwOf(p))}” make you want to ${op === 'add' ? 'add' : 'subtract'}? Words can trick you — the picture can't. `;
    if (p.type === 'big') msg += `Look at the picture — the unknown is the <b>long bar</b>. It's <b>longer</b> than ${Sm}'s bar (${esc(qty(p,p.s))}). Subtracting would make it shorter!`;
    else if (p.type === 'small') msg += `Look at the picture — the unknown is the <b>short bar</b>. It's <b>shorter</b> than ${B}'s bar (${esc(qty(p,p.b))}). Adding would make it even longer!`;
    else msg += `Look at the picture — the unknown is just the <b>gap</b>, the extra piece at the end of the long bar. Adding both bars would give something longer than either bar!`;
    if (!S.showModel) msg += ' Tip: flip the <b>Bar model</b> switch to see it.';
  }
  log('no', msg);
}

function checkAnswer(raw){
  const p = S.p, th = TH();
  const cleaned = String(raw).replace(/[$฿,\s]|บาท/g, '');
  if (!/^\d{1,6}$/.test(cleaned)){ log('hint', th ? 'พิมพ์เป็นจำนวนนับ เช่น 42' : 'Type a whole number, like 42.'); return; }
  const n = parseInt(cleaned, 10);
  if (n === p.answer){ finish(true); return; }

  S.attempts++;
  if (S.firstTry){
    S.firstTry = false;
    S.streak = 0; S.lvStreak[S.level] = 0;
    renderTop();
  }
  const inp = $('#ans'); if (inp){ inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.select(); }

  const e = esc(exprOf(p));
  if (S.attempts >= 3){
    log('no', th
      ? `ยังไม่ถูก ${e} = <b>${esc(qty(p,p.answer))}</b> ลองดูรูปว่าทำไม แล้วไปทำข้อใหม่กัน!`
      : `Not quite. ${e} = <b>${esc(fmt(p,p.answer))}</b>. Look at the model to see why — then try a new one!`);
    finish(false);
    return;
  }
  const wrongOp = p.type === 'big' ? p.s - p.diff : p.type === 'small' ? p.b + p.diff : p.b + p.s;
  const hund = p.b >= 100, tens = p.b >= 10;
  let msg;
  if (n === wrongOp){
    msg = th
      ? `นั่นคือคำตอบเมื่อเรา${opWord(p.op === 'add' ? 'sub' : 'add')} แต่เราตกลงกันแล้วว่าจะ<b>${opWord(p.op)}</b> ลองดูประโยคสัญลักษณ์: ${e}`
      : `That's what you'd get by ${p.op === 'add' ? 'subtracting' : 'adding'}. We decided to <b>${p.op === 'add' ? 'add' : 'subtract'}</b> — check the equation: ${e}.`;
  } else if (p.type === 'big' && n <= p.s){
    msg = th
      ? `ดูรูป — ส่วนที่ไม่รู้คือ<b>แท่งยาว</b> คำตอบจึงต้อง<b>มากกว่า</b> ${esc(qty(p,p.s))}`
      : `Look at the picture — the unknown is the <b>long bar</b>, so the answer must be <b>more</b> than ${esc(qty(p,p.s))}.`;
  } else if (p.type !== 'big' && n >= p.b){
    msg = th
      ? `ดูรูป — ส่วนที่ไม่รู้คือ${p.type === 'small' ? '<b>แท่งสั้น</b>' : 'แค่<b>ผลต่าง</b>'} คำตอบจึงต้อง<b>น้อยกว่า</b>แท่งยาว (${esc(qty(p,p.b))})`
      : `Look at the picture — the unknown is ${p.type === 'small' ? 'the <b>short bar</b>' : 'only the <b>gap</b>'}, so it must be <b>less</b> than the long bar (${esc(qty(p,p.b))}).`;
  } else if (S.attempts === 1){
    msg = th
      ? `ใกล้แล้ว! ตรวจการ${opWord(p.op)}อีกครั้ง: ${e} ตั้งหลักหน่วย${tens ? ' หลักสิบ' : ''}${hund ? ' และหลักร้อย' : ''}ให้ตรงกัน`
      : `Close! Check your ${p.op === 'add' ? 'adding' : 'subtracting'}: ${e}. Line up the ones${tens ? ', tens' : ''}${hund ? ' and hundreds' : ''}.`;
  } else {
    const r = hund ? 10 : 1, est = Math.round(p.answer / r) * r;
    msg = th
      ? `ลองประมาณก่อน: คำตอบประมาณ <b>${esc(qty(p,est))}</b> คำตอบ ${esc(qty(p,n))} ${n > p.answer ? 'มากไป' : 'น้อยไป'}`
      : `Estimate first: the answer is about <b>${esc(fmt(p,est))}</b>. Your answer ${esc(fmt(p,n))} is too ${n > p.answer ? 'big' : 'small'}.`;
  }
  log('no', msg);
}

function finish(solved){
  const p = S.p, th = TH(), t = T();
  if (solved){
    const sent = esc(answerSentence(p));
    if (S.firstTry){
      S.score += 10; S.streak++; S.lvStreak[S.level]++; S.justScored = true;
      if (S.streak > S.best) S.best = S.streak;
      const run = S.streak >= 3 ? (th ? `ถูกติดกัน ${S.streak} ข้อแล้ว!` : `That's ${S.streak} in a row!`) : '';
      log('ok', th ? `ถูกต้อง! <b>${sent}</b> +10 คะแนน ${run}` : `Correct! <b>${sent}</b> +10 points. ${run}`);
      if (S.lvStreak[S.level] >= UNLOCK && S.level < 4 && S.unlocked === S.level){
        S.unlocked = S.level + 1; S.freshUnlock = S.unlocked;
        const nm = esc(t.levels[S.unlocked].name);
        log('star', th ? `<b>ปลดล็อกระดับ ${S.unlocked} แล้ว!</b> “${nm}” พร้อมให้เล่นแล้ว` : `<b>Level ${S.unlocked} unlocked!</b> ${nm} is ready when you are.`);
      } else if (S.level === 4 && S.lvStreak[4] === UNLOCK){
        log('star', th ? `<b>สุดยอด!</b> ถูก ${UNLOCK} ข้อติดกันโดยไม่ดูรูป ไม่ต้องพึ่งคำสำคัญแล้ว` : `<b>Mix Master!</b> ${UNLOCK} in a row with the model hidden. You don't need keywords anymore.`);
      }
    } else {
      S.score += 5;
      log('ok', th ? `ได้แล้ว! <b>${sent}</b> +5 คะแนน ครั้งหน้าลองตอบให้ถูกตั้งแต่ครั้งแรกเพื่อสะสมการถูกติดกัน`
                   : `Got it! <b>${sent}</b> +5 points. Next time aim for the first try to build your streak.`);
    }
    save();
  }
  S.step = 4;
  renderTop(); renderLevels(); renderPips(); renderWhy(); renderQuestion(); drawModel(); updateReadouts(); updateStatus();
}

function hint(){
  const p = S.p, th = TH();
  const peek = !S.showModel && S.step < 4 ? (th ? ' <b>เคล็ดลับ:</b> เปิดสวิตช์บาร์โมเดลเพื่อดูรูป' : ' <b>Tip:</b> flip the Bar model switch to see the picture.') : '';
  const rel = problemText(p).rel;
  let msg;
  switch (S.step){
    case 0: msg = rel
      ? (th ? `หาประโยคที่เปรียบเทียบสองคน: “${esc(rel)}” ใครควรได้แท่งที่<b>ยาวกว่า</b>?` : `Find the sentence that compares the two people: “${esc(rel)}” Who would get the <b>longer</b> bar?`)
      : (th ? `โจทย์ให้ตัวเลขมาสองตัว คนที่มีตัวเลขมากกว่าจะได้แท่งที่<b>ยาวกว่า</b>` : `Two numbers are given. The person with the bigger number gets the <b>longer</b> bar.`);
      break;
    case 1: msg = th
      ? `ตัวเลขแต่ละตัวในโจทย์จะเติมลงในส่วนหนึ่งของรูป: แท่งยาว แท่งสั้น หรือผลต่าง ส่วนที่<b>ไม่มีตัวเลข</b>คือส่วนที่ยังไม่รู้`
      : `Each number in the problem fills in one part of the model: the long bar, the short bar, or the gap. The part that gets <b>no number</b> is the unknown.`;
      break;
    case 2: msg = th
      ? `ลองนึกภาพ: ส่วนที่ไม่รู้คือ<b>แท่งยาวทั้งแท่ง</b> (แท่งสั้น + ผลต่าง มาต่อกัน) หรือเป็น<b>ชิ้นส่วนหนึ่ง</b>ของแท่งยาว (แท่งสั้น หรือ ผลต่าง)? นำมารวมกัน → บวก  เอาชิ้นส่วนออก → ลบ`
      : `Picture it: is the unknown the <b>whole long bar</b> (short bar + gap put together)? Or is it <b>one piece</b> of the long bar (the short bar or the gap)? Putting together → add. Taking a piece away → subtract.`;
      break;
    case 3: {
      const r = p.b >= 100 ? 100 : 10, R = n => Math.round(n / r) * r;
      const est = p.type === 'big' ? `${R(p.s)} + ${R(p.diff)}` : p.type === 'small' ? `${R(p.b)} ${MINUS} ${R(p.diff)}` : `${R(p.b)} ${MINUS} ${R(p.s)}`;
      msg = p.numLv === 1
        ? (th ? `นับรูปในโมเดลเพื่อตรวจคำตอบ!` : `Count the pictures in the model to check!`)
        : (th ? `ลองประมาณด้วยจำนวนเต็ม${r === 100 ? 'ร้อย' : 'สิบ'}ก่อน: ${est} คำตอบควรใกล้เคียงค่านี้` : `Estimate with round numbers first: ${est} is close. Your answer should be near that.`);
      break;
    }
    default: msg = th ? `กด<b>โจทย์ใหม่</b>เพื่อทำข้อต่อไป` : `Press <b>New problem</b> for another one.`;
  }
  log('hint', msg + peek);
}

function flashScreen(){
  const s = $('#screen'); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake');
}

function setLevel(n){
  if (n > S.unlocked || n === S.level) return;
  S.level = n;
  S.showModel = n !== 4;
  if (S.freshUnlock === n) S.freshUnlock = 0;
  newProblem();
}

function setLang(l){
  if (l === S.lang || !UI[l]) return;
  S.lang = l;
  save();
  log('sep', esc(T().langSep));
  renderAll();   // same problem, same step — re-worded in the new language
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-part]');
  if (!t) return;
  if (t.id === 'newBtn' || t.id === 'nextBtn'){ newProblem(); return; }
  if (t.id === 'hintBtn'){ hint(); return; }
  if (t.id === 'toggle'){
    S.showModel = !S.showModel;
    renderToggle(); drawModel(); updateStatus();
    if (S.step === 1) renderQuestion();
    return;
  }
  if (t.dataset.lang){ setLang(t.dataset.lang); return; }
  if (t.dataset.theme !== undefined && t.classList.contains('swatch')){
    S.theme = +t.dataset.theme; renderSwatches(); save(); return;
  }
  if (t.dataset.level){ setLevel(+t.dataset.level); return; }
  if (t.dataset.go){ setLevel(+t.dataset.go); return; }
  if (t.dataset.who && S.step === 0){ chooseWho(t.dataset.who, t); return; }
  if (t.dataset.part && S.step === 1){ choosePart(t.dataset.part, t.tagName === 'BUTTON' ? t : null); return; }
  if (t.dataset.op && S.step === 2){ chooseOp(t.dataset.op, t); return; }
});
// keyboard activation for tappable SVG parts
$('#model').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.part && S.step === 1){
    e.preventDefault(); choosePart(e.target.dataset.part, null);
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'ansForm') return;
  e.preventDefault();
  if (S.step === 3) checkAnswer($('#ans').value);
});
document.addEventListener('animationend', e => { if (e.target.classList) e.target.classList.remove('shake'); });
// web fonts can change text widths after first paint — refit the difference chip
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitDiffChip);

/* ---------- boot ---------- */
load();
S.level = S.unlocked;
S.showModel = S.level !== 4;
applyStatic();
log('sep', esc(T().welcome));
log('hint', T().welcomeMsg);
newProblem();
})();
</script>
</body>
</html>
