<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F8">
<title>บัตรคำ · ทบทวนคณิตศาสตร์</title>
<meta name="description" content="แอปทบทวนบทเรียนคณิตศาสตร์ด้วยบัตรคำ แตะเพื่อดูคำตอบ แล้วปัดเพื่อบอกว่าจำได้หรือไม่">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+Thai:wght@500;600;700&display=swap" rel="stylesheet">

<!-- KaTeX: renders inline/display LaTeX math on card faces -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

<style>
  :root{
    /* ---- palette: a desk full of index cards, not a chalkboard ---- */
    --paper:#F2F4F8;
    --paper-deep:#E6E9F1;
    --card-front:#FFFFFF;
    --card-back:#FBFAF6;
    --dot: rgba(43,76,126,.09);
    --rule: rgba(43,76,126,.09);

    --ink:#20232C;
    --ink-soft:#616774;
    --ink-faint:#9CA2AD;

    --brand:#2B4C7E;
    --brand-deep:#1D3557;
    --brand-soft:#E3EAF3;

    --yes:#1F8F5B;
    --yes-soft:#E1F5EA;
    --no:#D6483F;
    --no-soft:#FBE7E4;

    --ps:#E2793D;   --ps-soft:#FBEADC;
    --jh:#1E8C8C;   --jh-soft:#DFF3F1;
    --sh:#7A52C9;   --sh-soft:#ECE4F8;
    --uni:#B23A5A;  --uni-soft:#F8E3E9;

    --shadow: 0 20px 44px rgba(32,35,44,.16), 0 2px 0 rgba(32,35,44,.03);

    --font-display:'Kanit','Noto Sans Thai','Segoe UI',sans-serif;
    --font-body:'Sarabun','Noto Sans Thai','Segoe UI',sans-serif;
    --font-mono:'JetBrains Mono','Noto Sans Thai',ui-monospace,monospace;
  }

  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  button{font:inherit; color:inherit; background:none;}
  [hidden]{display:none !important;}

  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:
      radial-gradient(var(--dot) 1.1px, transparent 1.3px) 0 0/22px 22px,
      var(--paper);
    height:100vh; height:100dvh; width:100%;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  #app{position:relative; width:100%; height:100%; max-width:640px; margin:0 auto;}

  .screen{
    position:absolute; inset:0;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 20px 40px;
    opacity:0; pointer-events:none; transform:translateY(8px);
    transition:opacity .3s ease, transform .3s ease;
  }
  .screen.active{opacity:1; pointer-events:auto; transform:translateY(0);}

  button:focus-visible, .deck-tile:focus-visible, .card-drag:focus-visible{
    outline:3px solid var(--brand); outline-offset:3px; border-radius:8px;
  }

  /* ================= HOME ================= */
  .home{width:100%; max-width:520px;}

  .eyebrow{
    font-family:var(--font-mono); font-size:11px; font-weight:700;
    letter-spacing:.14em; color:var(--brand); margin:0 0 8px; text-transform:uppercase;
  }
  .home-title{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(28px,7vw,36px); color:var(--ink); margin:0 0 10px;
  }
  .home-lede{
    font-size:14.5px; color:var(--ink-soft); margin:0; line-height:1.6; max-width:420px;
  }

  .level-rail{border-bottom:2px solid rgba(32,35,44,.1); margin:24px 0 22px;}
  .level-tabs{
    display:flex; gap:6px; padding:0 2px;
    overflow-x:auto; overflow-y:hidden;
    touch-action:pan-x; -webkit-overflow-scrolling:touch;
  }
  .tab{
    flex:0 0 auto; font-family:var(--font-mono); font-weight:700; font-size:12px;
    letter-spacing:.03em; padding:9px 15px 10px; border-radius:10px 10px 0 0;
    border:1.5px solid rgba(32,35,44,.14); border-bottom:none;
    background:#fff; color:var(--ink-soft); cursor:pointer; touch-action:manipulation;
    transform:translateY(2px); transition:transform .15s, background .15s, color .15s;
  }
  .tab.active{background:var(--brand); border-color:var(--brand); color:#fff; transform:translateY(0); box-shadow:0 -4px 12px rgba(32,35,44,.1);}
  .tab.active.lvl-ps{background:var(--ps); border-color:var(--ps);}
  .tab.active.lvl-jh{background:var(--jh); border-color:var(--jh);}
  .tab.active.lvl-sh{background:var(--sh); border-color:var(--sh);}
  .tab.active.lvl-uni{background:var(--uni); border-color:var(--uni);}
  .tab.empty{opacity:.4;}

  .deck-list{display:flex; flex-direction:column; gap:16px; padding-bottom:30px;}
  .empty-note{font-size:14px; color:var(--ink-faint); padding:18px 4px;}

  .deck-tile{
    position:relative; overflow:hidden; width:100%; display:flex; align-items:center; gap:14px;
    text-align:left; padding:20px 22px; border-radius:14px;
    border:1px solid rgba(32,35,44,.08); border-left:6px solid var(--lvl-color, var(--brand));
    background:var(--card-front); cursor:pointer; touch-action:manipulation;
    box-shadow:0 10px 22px rgba(32,35,44,.07);
    transition:transform .16s ease, box-shadow .16s ease;
    animation:riseIn .45s ease both;
  }
  .deck-tile:active{transform:translateY(0);}
  @keyframes riseIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

  .deck-glyph{
    position:absolute; right:-4px; bottom:-22px; font-family:var(--font-display); font-weight:700;
    font-size:100px; line-height:1; color:var(--lvl-color, var(--brand)); opacity:.11;
    pointer-events:none; user-select:none;
  }

  .deck-info{flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; position:relative;}
  .deck-topic{font-family:var(--font-display); font-weight:600; font-size:18.5px; color:var(--ink);}
  .deck-meta{display:flex; align-items:center; gap:10px;}
  .deck-count{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);}
  .deck-progress{font-family:var(--font-mono); font-size:11px;}
  .prog-yes{color:var(--yes); font-weight:700;}
  .prog-no{color:var(--no); font-weight:700;}
  .dotsep{opacity:.4; margin:0 1px;}

  .reset-link{
    align-self:center; display:inline-flex; align-items:center; gap:6px;
    margin-top:8px; padding:10px 18px; border-radius:999px;
    border:1.5px solid rgba(32,35,44,.18); background:transparent;
    font-family:var(--font-mono); font-size:12px; font-weight:600;
    color:var(--ink-soft); cursor:pointer; touch-action:manipulation;
  }
  .reset-link:active{background:rgba(32,35,44,.06);}
  .reset-link.armed{color:var(--no); border-color:var(--no); background:var(--no-soft);}
  .deck-arrow{font-size:18px; color:var(--ink-faint); flex:0 0 auto; position:relative;}

  .level-pill{
    font-family:var(--font-mono); font-size:10.5px; font-weight:700;
    padding:4px 9px; border-radius:999px; white-space:nowrap; letter-spacing:.02em;
  }
  .lvl-ps.level-pill{background:var(--ps-soft); color:var(--ps);}
  .lvl-jh.level-pill{background:var(--jh-soft); color:var(--jh);}
  .lvl-sh.level-pill{background:var(--sh-soft); color:var(--sh);}
  .lvl-uni.level-pill{background:var(--uni-soft); color:var(--uni);}

  /* ================= STUDY ================= */
  #screen-study{overflow:hidden; padding:16px 20px 14px;}

  .study-top{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; max-width:420px; margin-bottom:10px; flex:0 0 auto; gap:10px;
  }
  .back-btn{
    display:flex; align-items:center; gap:6px;
    font-family:var(--font-body); font-weight:600; font-size:14px;
    color:var(--ink-soft); cursor:pointer; padding:6px 4px; touch-action:manipulation;
  }
  .study-crumb{
    font-size:13px; color:var(--ink-soft); display:flex; align-items:center; gap:8px; min-width:0;
  }
  .study-crumb .topic-name{font-family:var(--font-display); font-weight:600; color:var(--ink);}
  .study-crumb .dot{opacity:.5;}
  .progress-label{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}

  .progress-track{
    width:100%; max-width:420px; height:5px; border-radius:999px;
    background:rgba(32,35,44,.09); overflow:hidden; margin-bottom:14px; flex:0 0 auto;
  }
  .progress-fill{height:100%; background:var(--brand); border-radius:999px; transition:width .4s ease;}

  .stage{
    position:relative; width:100%; min-height:0; flex:1;
    display:flex; align-items:center; justify-content:center; padding:2px 0;
  }
  .deck-behind, .card-drag{width:min(86vw,340px); height:100%; max-height:430px;}
  .deck-behind{
    position:absolute; border-radius:18px; background:var(--paper-deep);
    border:1px solid rgba(32,35,44,.07);
  }
  .deck-behind-1{transform:rotate(-3deg) translateY(6px);}
  .deck-behind-2{transform:rotate(3deg) translateY(10px); opacity:.7;}

  .card-drag{
    position:relative; z-index:2; perspective:1400px; cursor:grab;
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  .card-drag:active{cursor:grabbing;}

  .card-flip{
    position:relative; width:100%; height:100%; transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .card-flip.flipped{transform:rotateY(180deg);}

  .card-face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:16px; box-shadow:var(--shadow); border:1px solid rgba(32,35,44,.09);
    padding:24px 20px 16px; display:flex; flex-direction:column;
    background-color:var(--card-front);
    background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px);
    background-position: 0 58px;
  }
  .card-back{background-color:var(--card-back); transform:rotateY(180deg);}

  .card-hole{
    position:absolute; top:14px; left:16px; width:15px; height:15px; border-radius:50%;
    background:var(--paper);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.28), 0 1px 0 rgba(255,255,255,.7);
    border:1px solid rgba(32,35,44,.14);
  }
  .corner-flag{
    position:absolute; top:0; right:20px; width:30px; height:13px;
    border-radius:0 0 5px 5px; background:var(--lvl-color, var(--brand));
    box-shadow:0 3px 6px rgba(0,0,0,.15);
  }
  .face-tag-row{display:flex; justify-content:flex-end; margin-bottom:8px;}
  .face-tag-row .level-pill{margin-left:auto;}
  .answer-tag{
    align-self:flex-end; font-family:var(--font-mono); font-size:10.5px; font-weight:700;
    padding:4px 10px; border-radius:999px; background:var(--yes-soft); color:var(--yes);
    letter-spacing:.04em; margin-bottom:6px;
  }

  .card-body{flex:1; min-height:0; overflow-y:auto; overflow-x:auto; display:table; width:100%;}
  .card-body-inner{
    display:table-cell; vertical-align:middle; text-align:center;
    font-size:clamp(15px,4vw,17px); line-height:1.6; padding:4px 2px; color:var(--ink);
  }
  .card-body-inner strong{color:var(--brand-deep);}
  .katex{white-space:nowrap;}

  .tikz-holder{margin-top:10px; display:flex; justify-content:center; width:100%;}
  .tikz-holder svg{max-width:100%; height:auto;}

  .tap-hint{
    margin-top:auto; padding-top:8px; font-family:var(--font-mono);
    font-size:11px; color:var(--ink-faint); text-align:center; letter-spacing:.03em;
  }

  .wash{
    position:absolute; inset:0; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; z-index:5;
  }
  .wash-yes{background:linear-gradient(120deg, rgba(31,143,91,0) 0%, rgba(31,143,91,.2) 100%);}
  .wash-no{background:linear-gradient(240deg, rgba(214,72,63,0) 0%, rgba(214,72,63,.2) 100%);}
  .stamp-text{
    font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:.05em;
    padding:7px 16px; border:3px solid currentColor; border-radius:8px; text-transform:uppercase;
  }
  .wash-yes .stamp-text{color:var(--yes); transform:rotate(-9deg);}
  .wash-no .stamp-text{color:var(--no); transform:rotate(9deg);}

  .swipe-hint{
    display:flex; justify-content:space-between; align-items:center; gap:14px;
    width:100%; max-width:380px; margin-top:10px; flex:0 0 auto;
    font-size:13px; opacity:.4; transition:opacity .25s; pointer-events:none;
  }
  .swipe-hint.active{opacity:1;}
  .swipe-hint .no{color:var(--no); font-weight:600;}
  .swipe-hint .yes{color:var(--yes); font-weight:600;}

  /* ================= SUMMARY ================= */
  .summary{
    position:absolute; inset:0; z-index:3;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:18px; text-align:center;
  }
  .summary-mark{width:50px; height:50px; margin-bottom:2px;}
  .summary-mark path{
    fill:none; stroke:var(--yes); stroke-width:9; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:1; stroke-dashoffset:1; animation:drawcheck .6s ease .15s forwards;
  }
  @keyframes drawcheck{to{stroke-dashoffset:0;}}
  .summary-title{font-family:var(--font-display); font-weight:600; font-size:clamp(19px,4.8vw,23px); margin:0;}
  .summary-stat{font-family:var(--font-mono); font-size:14px; color:var(--ink-soft); margin:0;}
  .summary-praise{font-size:13px; color:var(--yes); margin:0;}

  .summary-actions{display:flex; flex-direction:column; gap:8px; width:100%; max-width:300px; margin-top:10px;}
  .btn{
    font-family:var(--font-display); font-weight:600; font-size:14.5px;
    padding:12px 22px; border-radius:12px; border:none; cursor:pointer; touch-action:manipulation;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary{background:var(--brand); color:#fff; box-shadow:0 10px 22px rgba(43,76,126,.28);}
  .btn-ghost{background:transparent; border:1.5px solid rgba(32,35,44,.18); color:var(--ink);}

  /* ---- deck hub: mode picker shown after tapping a deck ---- */
  .hub-head{
    display:flex; align-items:center; gap:14px; width:100%; max-width:460px;
    margin:6px 0 10px;
  }
  .hub-glyph{
    width:52px; height:52px; border-radius:14px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:24px;
    background:var(--lvl-soft, var(--paper-deep)); color:var(--lvl-color, var(--brand));
  }
  .hub-head-text{display:flex; flex-direction:column; gap:6px; min-width:0;}
  .hub-head-text .topic-name{font-family:var(--font-display); font-weight:600; font-size:20px; color:var(--ink);}
  .hub-stats{
    font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);
    width:100%; max-width:460px; margin:0 0 20px;
  }
  .mode-list{display:flex; flex-direction:column; gap:12px; width:100%; max-width:460px; padding-bottom:30px;}
  .mode-option{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:16px 18px; border-radius:14px; border:1.5px solid rgba(32,35,44,.1);
    background:var(--card-front); cursor:pointer; touch-action:manipulation;
    box-shadow:0 8px 18px rgba(32,35,44,.06);
    transition:transform .15s ease, box-shadow .15s ease;
    animation:riseIn .4s ease both;
  }
  .mode-option:active{transform:translateY(1px);}
  .mode-option.disabled{opacity:.5; cursor:default; box-shadow:none;}
  .mode-icon{
    width:42px; height:42px; border-radius:11px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:19px;
  }
  .mode-icon-all{background:var(--brand-soft); color:var(--brand);}
  .mode-icon-review{background:var(--no-soft); color:var(--no);}
  .mode-icon-grid{background:rgba(32,35,44,.08); color:var(--ink-soft);}
  .mode-text{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .mode-title{font-family:var(--font-display); font-weight:600; font-size:15.5px; color:var(--ink);}
  .mode-sub{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft);}
  .mode-arrow{font-size:18px; color:var(--ink-faint); flex:0 0 auto;}
  .mode-option.disabled .mode-arrow{visibility:hidden;}

  /* ---- grid overview: all fronts at a glance, no flip/swipe ---- */
  .grid-wrap{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:12px;
    width:100%; max-width:640px; padding-bottom:30px;
  }
  @media (min-width:520px){ .grid-wrap{grid-template-columns:repeat(3, 1fr);} }
  @media (min-width:760px){ .grid-wrap{grid-template-columns:repeat(4, 1fr);} }
  .grid-card{
    position:relative; border-radius:12px; border:1px solid rgba(32,35,44,.09);
    background:var(--card-front); box-shadow:0 6px 14px rgba(32,35,44,.06);
    padding:28px 12px 14px; min-height:128px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    animation:riseIn .4s ease both;
  }
  .grid-index{
    position:absolute; top:9px; left:11px; font-family:var(--font-mono);
    font-size:10px; color:var(--ink-faint); font-weight:600;
  }
  .grid-dot{
    position:absolute; top:11px; right:11px; width:8px; height:8px; border-radius:50%;
    background:rgba(32,35,44,.15);
  }
  .grid-dot-remembered{background:var(--yes);}
  .grid-dot-review{background:var(--no);}
  .grid-content{
    font-size:12.5px; line-height:1.5; color:var(--ink);
    max-height:100%; overflow:hidden;
  }
  .grid-content .katex{font-size:1em; white-space:normal;}

  @media (min-width:640px){.screen{padding-top:46px;}}

  /* Hover styling only for real pointer devices — on touch screens, WebKit/Chrome
     can require a "spend" first tap to trigger :hover before a second tap actually
     clicks. Gating hover behind this query keeps every button a single, immediate
     tap on phones and tablets while still giving mouse users a hover cue. */
  @media (hover:hover) and (pointer:fine){
    .deck-tile:hover{transform:translateY(-2px); box-shadow:0 14px 28px rgba(32,35,44,.12);}
    .reset-link:hover{border-color:var(--no); color:var(--no);}
    .back-btn:hover{color:var(--brand);}
    .btn-primary:hover{transform:translateY(-2px);}
    .btn-ghost:hover{border-color:var(--brand); color:var(--brand);}
    .mode-option:not(.disabled):hover{transform:translateY(-2px); box-shadow:0 12px 24px rgba(32,35,44,.1);}
  }

  @media (prefers-reduced-motion:reduce){
    .screen,.card-flip,.card-drag,.deck-tile,.tab,.btn,.progress-fill,.summary-mark path{
      transition:none !important; animation:none !important; stroke-dashoffset:0 !important;
    }
  }
</style>
</head>
<body>
<noscript>แอปนี้ต้องเปิดใช้งาน JavaScript จึงจะทำงานได้</noscript>

<div id="app">

  <!-- ================= HOME ================= -->
  <section class="screen active" id="screen-home">
    <div class="home">
      <p class="eyebrow">ทบทวนคณิตศาสตร์</p>
      <h1 class="home-title">บัตรคำ</h1>
      <p class="home-lede">มองด้านหน้าแล้วลองนึกคำตอบดู แตะที่การ์ดเพื่อตรวจคำตอบ จากนั้นปัดเพื่อบอกว่าจำได้หรือไม่</p>

      <div class="level-rail">
        <div class="level-tabs" id="level-tabs" role="tablist" aria-label="กรองตามระดับชั้น"></div>
      </div>
      <div class="deck-list" id="deck-list"></div>
    </div>
  </section>

  <!-- ================= DECK HUB (mode picker) ================= -->
  <section class="screen" id="screen-hub">
    <div class="study-top">
      <button class="back-btn" id="hub-back-btn" type="button" aria-label="กลับไปหน้าชุดการ์ดทั้งหมด">← กลับ</button>
    </div>
    <div class="hub-head">
      <span class="hub-glyph" id="hub-glyph" aria-hidden="true"></span>
      <div class="hub-head-text">
        <span class="topic-name" id="hub-topic">—</span>
        <span class="level-pill" id="hub-level">—</span>
      </div>
    </div>
    <p class="hub-stats" id="hub-stats"></p>
    <div class="mode-list" id="mode-list"></div>
  </section>

  <!-- ================= GRID OVERVIEW ================= -->
  <section class="screen" id="screen-grid">
    <div class="study-top" style="max-width:640px;">
      <button class="back-btn" id="grid-back-btn" type="button" aria-label="กลับไปหน้าเลือกโหมด">← กลับ</button>
      <span class="progress-label" id="grid-count-label"></span>
    </div>

/* ================================================================================
   ตั้งแต่บรรทัดนี้ลงไปเป็นโค้ดของแอป — ไม่จำเป็นต้องแก้ไขเพื่อเพิ่ม/เปลี่ยนการ์ด
   ================================================================================ */

const LEVELS = [
  {code:'ps', label:'ประถม'},
  {code:'jh', label:'ม.ต้น'},
  {code:'sh', label:'ม.ปลาย'},
  {code:'uni', label:'มหาลัย'},
];
const LEVEL_LABEL = Object.fromEntries(LEVELS.map(l=>[l.code,l.label]));

function levelClass(code){ return 'lvl-' + code; }
function glyphFor(topic){
  return TOPIC_GLYPH[topic] || (topic ? topic.charAt(0).toUpperCase() : '?');
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatFace(raw){
  let out = escapeHtml(raw);
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\n/g, '<br>');
  return out;
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function cardsForTopic(topic){ return CARDS.filter(c => c.topic === topic); }

// ---------- stable per-card id (falls back to topic + position if none given) ----------
const CARD_IDS = new WeakMap();
(function assignCardIds(){
  const seenPerTopic = {};
  CARDS.forEach(c=>{
    seenPerTopic[c.topic] = (seenPerTopic[c.topic] || 0) + 1;
    CARD_IDS.set(c, c.id || (c.topic + '__' + seenPerTopic[c.topic]));
  });
})();
function idOf(card){ return CARD_IDS.get(card); }

// ---------- progress: remembered / needs-review status, saved in this browser ----------
const PROGRESS_KEY = 'mathFlashcards.progress.v1';
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}'); }
  catch(err){ return {}; }
}
function saveProgress(){
  try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); }
  catch(err){ /* storage unavailable (e.g. private browsing) — fail quietly */ }
}
function deckProgress(topic){
  let mastered = 0, review = 0;
  cardsForTopic(topic).forEach(c=>{
    const status = progress[idOf(c)];
    if(status === 'remembered') mastered++;
    else if(status === 'review') review++;
  });
  return {mastered, review};
}

function getDecks(){
  const map = new Map();
  CARDS.forEach(c=>{
    if(!map.has(c.topic)) map.set(c.topic, {topic:c.topic, level:c.level, count:0});
    map.get(c.topic).count++;
  });
  return [...map.values()];
}

// ---------- lazy-load TikZJax only once a card that needs it is shown ----------
let tikzLoading = null;
function ensureTikzJax(){
  if(window.__tikzjaxLoaded || tikzLoading) return tikzLoading;
  tikzLoading = new Promise((resolve)=>{
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://cdn.jsdelivr.net/npm/@rod2ik/tikzjax/dist/fonts.min.css';
    document.head.appendChild(link);
    const scr = document.createElement('script');
    scr.src = 'https://cdn.jsdelivr.net/npm/@rod2ik/tikzjax/dist/tikzjax.min.js';
    scr.onload = ()=>{ window.__tikzjaxLoaded = true; resolve(); };
    scr.onerror = ()=>{ resolve(); };
    document.head.appendChild(scr);
  });
  return tikzLoading;
}

function renderFace(el, text, tikz){
  el.innerHTML = formatFace(text);
  if(tikz){
    ensureTikzJax();
    const holder = document.createElement('div');
    holder.className = 'tikz-holder';
    const scriptEl = document.createElement('script');
    scriptEl.type = 'text/tikz';
    scriptEl.textContent = tikz;
    holder.appendChild(scriptEl);
    el.appendChild(holder);
  }
  if(window.renderMathInElement){
    window.renderMathInElement(el, {
      delimiters:[
        {left:'$$', right:'$$', display:true},
        {left:'$', right:'$', display:false},
      ],
      throwOnError:false,
    });
  }
}

function makeModeOption({icon, iconClass, title, sub, onClick, disabled}){
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'mode-option' + (iconClass ? ' ' + iconClass : '') + (disabled ? ' disabled' : '');
  btn.disabled = !!disabled;
  btn.innerHTML =
    '<span class="mode-icon" aria-hidden="true">' + icon + '</span>' +
    '<span class="mode-text">' +
      '<span class="mode-title">' + escapeHtml(title) + '</span>' +
      '<span class="mode-sub">' + escapeHtml(sub) + '</span>' +
    '</span>' +
    '<span class="mode-arrow" aria-hidden="true">→</span>';
  if(!disabled) btn.addEventListener('click', onClick);
  return btn;
}
function renderHub(){
  const topic = currentTopic;
  const all = cardsForTopic(topic);
  const level = all[0] ? all[0].level : '';

  hubTopic.textContent = topic;
  hubLevel.textContent = LEVEL_LABEL[level] || level;
  hubLevel.className = 'level-pill ' + levelClass(level);
  hubGlyph.textContent = glyphFor(topic);
  hubGlyph.style.setProperty('--lvl-color', `var(--${level})`);
  hubGlyph.style.setProperty('--lvl-soft', `var(--${level}-soft)`);

  const notYet = notYetCards(topic);
  const prog = deckProgress(topic);
  const statsParts = [];
  if(prog.mastered) statsParts.push('<span class="prog-yes">จำได้ ' + prog.mastered + ' ใบ</span>');
  if(prog.review) statsParts.push('<span class="prog-no">ต้องทบทวน ' + prog.review + ' ใบ</span>');
  hubStats.innerHTML = statsParts.length ? statsParts.join(' <span class="dotsep">·</span> ') : 'ยังไม่เริ่มทบทวนชุดนี้';

  modeListEl.innerHTML = '';
  modeListEl.appendChild(makeModeOption({
    icon:'∀', iconClass:'mode-icon-all',
    title:'ทบทวนทั้งหมด',
    sub: all.length + ' ใบ · สุ่มลำดับ',
    onClick: ()=> startDeck(topic, all),
  }));
  modeListEl.appendChild(makeModeOption({
    icon:'↺', iconClass:'mode-icon-review',

  gridWrapEl.innerHTML = '';
  all.forEach((card, i)=>{
    const status = progress[idOf(card)]; // 'remembered' | 'review' | undefined
    const tile = document.createElement('div');
    tile.className = 'grid-card';
    tile.style.animationDelay = (i * 30) + 'ms';
    tile.innerHTML =
      '<span class="grid-index">' + (i + 1) + '</span>' +
      '<span class="grid-dot grid-dot-' + (status || 'new') + '" aria-hidden="true"></span>' +
      '<span class="grid-content"></span>';
    // Front text only — diagrams are skipped here to keep the overview light
    // and legible; open a review mode to see a card's full front (with TikZ).
    renderFace(tile.querySelector('.grid-content'), card.front, null);
    gridWrapEl.appendChild(tile);
  });

// ---------- home: level filter + deck list ----------
function renderLevelTabs(){
  const decks = getDecks();
  const counts = {};
  LEVELS.forEach(l => counts[l.code] = decks.filter(d => d.level === l.code).length);

  const chips = [{code:'all', label:'ทั้งหมด'}, ...LEVELS];
  levelTabsEl.innerHTML = '';
  chips.forEach(chip=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('role','tab');
    btn.setAttribute('aria-selected', activeFilter === chip.code ? 'true' : 'false');
    let cls = 'tab';
    if(chip.code !== 'all') cls += ' ' + levelClass(chip.code);
    if(activeFilter === chip.code) cls += ' active';
    if(chip.code !== 'all' && counts[chip.code] === 0) cls += ' empty';
    btn.className = cls;
    btn.textContent = chip.label;
    btn.addEventListener('click', ()=>{
      activeFilter = chip.code;
      renderLevelTabs();
      renderDeckList();
    });
    levelTabsEl.appendChild(btn);
  });
}

    tile.style.animationDelay = (i*60) + 'ms';
    tile.innerHTML =
      '<span class="deck-glyph" aria-hidden="true">' + escapeHtml(glyphFor(deck.topic)) + '</span>' +
      '<span class="deck-info">' +
        '<span class="deck-topic">' + escapeHtml(deck.topic) + '</span>' +
        '<span class="deck-meta">' +
          '<span class="level-pill ' + levelClass(deck.level) + '">' + escapeHtml(LEVEL_LABEL[deck.level] || deck.level) + '</span>' +
          '<span class="deck-count">' + deck.count + ' ใบ</span>' +
        '</span>' +
        progressLine +
      '</span>' +
      '<span class="deck-arrow" aria-hidden="true">→</span>';
    tile.addEventListener('click', ()=> openDeck(deck.topic));
    deckListEl.appendChild(tile);
  });

  if(Object.keys(progress).length){
    clearTimeout(resetArmTimer);
    const resetBtn = document.createElement('button');
    resetBtn.type = 'button';
    resetBtn.className = 'reset-link';
    resetBtn.textContent = 'ล้างความคืบหน้าที่บันทึกไว้';
    let armed = false;
    resetBtn.addEventListener('click', ()=>{
      if(!armed){
        armed = true;
        resetBtn.textContent = 'แตะอีกครั้งเพื่อยืนยัน';
        resetBtn.classList.add('armed');
        resetArmTimer = setTimeout(()=>{
          armed = false;
          resetBtn.textContent = 'ล้างความคืบหน้าที่บันทึกไว้';
          resetBtn.classList.remove('armed');
        }, 4000);
        return;
      }
      clearTimeout(resetArmTimer);
      progress = {};
      saveProgress();
      renderDeckList();
    });
    deckListEl.appendChild(resetBtn);
  }
}

// ---------- study session ----------
function startDeck(topic, cardsOverride){
  currentTopic = topic;
  const pool = (cardsOverride && cardsOverride.length) ? cardsOverride : cardsForTopic(topic);
  sessionCards = shuffle(pool.slice());
  sessionIndex = 0; remembered = []; forgotten = [];

  const level = sessionCards[0] ? sessionCards[0].level : '';
  crumbTopic.textContent = topic;
  crumbLevel.textContent = LEVEL_LABEL[level] || level;
  crumbLevel.className = 'level-pill ' + levelClass(level);

  showSessionCard();
  showScreen('study');
}

function showSessionCard(){
  revealed = false;
  animating = false;
  cardFlip.classList.remove('flipped');
  cardDrag.style.transition = 'none';
  cardDrag.style.transform = '';
  cardDrag.style.opacity = '1';
  washYes.style.opacity = 0;
  washNo.style.opacity = 0;
  swipeHint.classList.add('active');

  cardDrag.hidden = false;
  summaryEl.hidden = true;
  document.querySelector('.progress-track').style.display = '';
  document.getElementById('back-btn').parentElement.style.display = '';

  const card = sessionCards[sessionIndex];
  const lvlCls = levelClass(card.level);

  frontLevel.textContent = LEVEL_LABEL[card.level] || card.level;
  frontLevel.className = 'level-pill ' + lvlCls;
  frontFlag.style.setProperty('--lvl-color', `var(--${card.level})`);
  backFlag.style.setProperty('--lvl-color', `var(--${card.level})`);

  renderFace(frontContent, card.front, card.frontTikz);
  renderFace(backContent, card.back, card.backTikz);

  progressLabel.textContent = 'การ์ดที่ ' + (sessionIndex + 1) + ' จาก ' + sessionCards.length;
  progressFill.style.width = (sessionIndex / sessionCards.length) * 100 + '%';

  void cardDrag.offsetWidth;
  cardDrag.style.transition = '';
}

function flipCard(){
  if(animating) return;
  revealed = !revealed;
  cardFlip.classList.toggle('flipped', revealed);
}

function commit(isYes){
  if(animating) return;
  animating = true;
  const dir = isYes ? 1 : -1;
  const dy = dragState ? dragState.curY : 0;
  cardDrag.style.transition = 'transform .4s cubic-bezier(.2,.8,.2,1), opacity .4s ease';
  cardDrag.style.transform = 'translate(' + (dir * (window.innerWidth || 600)) + 'px,' + dy + 'px) rotate(' + (dir*20) + 'deg)';
  cardDrag.style.opacity = '0';
  const wash = isYes ? washYes : washNo;
  wash.style.opacity = '1';

  const card = sessionCards[sessionIndex];
  (isYes ? remembered : forgotten).push(card);
  progress[idOf(card)] = isYes ? 'remembered' : 'review';
  saveProgress();

  setTimeout(()=>{
    sessionIndex++;
    if(sessionIndex < sessionCards.length){
      showSessionCard();
    } else {
      showSummary();
    }
  }, 400);
}

function showSummary(){
  animating = false;
  document.querySelector('.progress-track').style.display = 'none';
  swipeHint.classList.remove('active');
  swipeHint.style.opacity = '0';
  if(document.activeElement === cardDrag) cardDrag.blur();
  cardDrag.hidden = true;
  summaryEl.hidden = false;

  summaryStat.textContent = 'จำได้ ' + remembered.length + ' จาก ' + sessionCards.length + ' ใบ';
  summaryPraise.hidden = !(sessionCards.length > 0 && forgotten.length === 0);

  summaryActions.innerHTML = '';
  if(forgotten.length){
    summaryActions.appendChild(makeBtn(
      'ทบทวนใบที่ยังจำไม่ได้ (' + forgotten.length + ')', 'btn btn-primary',
      ()=>{
        sessionCards = shuffle(forgotten.slice());
        sessionIndex = 0; remembered = []; forgotten = [];
        swipeHint.style.opacity = '';
        showSessionCard();
      }
    ));
  }
  summaryActions.appendChild(makeBtn(
    'สุ่มใหม่ทั้งชุด', forgotten.length ? 'btn btn-ghost' : 'btn btn-primary',
    ()=>{
      sessionCards = shuffle(cardsForTopic(currentTopic));
      sessionIndex = 0; remembered = []; forgotten = [];
      swipeHint.style.opacity = '';
      showSessionCard();
    }
  ));
  summaryActions.appendChild(makeBtn('กลับไปหน้าชุดนี้', 'btn btn-ghost', ()=> goHub()));
}

function makeBtn(label, cls, onClick){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = cls;
  b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}

// ---------- drag / swipe ----------
const THRESHOLD = 100;

function onPointerDown(e){
  if(animating) return;
  dragState = {startX:e.clientX, startY:e.clientY, curX:0, curY:0, moved:false};
  try{ cardDrag.setPointerCapture(e.pointerId); }catch(err){}
  cardDrag.style.transition = 'none';
}
function onPointerMove(e){
  if(!dragState) return;
  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;
  dragState.curX = dx; dragState.curY = dy;
  if(Math.abs(dx) > 6 || Math.abs(dy) > 6) dragState.moved = true;
  const rot = dx / 18;
  cardDrag.style.transform = 'translate(' + dx + 'px,' + (dy*0.25) + 'px) rotate(' + rot + 'deg)';
  const ratio = clamp(dx / THRESHOLD, -1, 1);
  washYes.style.opacity = Math.max(0, ratio);
  washNo.style.opacity = Math.max(0, -ratio);
}
function onPointerUp(e){
  // Explicitly release pointer capture ourselves — some WebKit/mobile browser
  // versions don't reliably auto-release capture on pointerup when the element
  // also uses touch-action:none, which can otherwise cause the very next tap
  // (e.g. on the summary buttons) to be swallowed and require a second tap.
  if(e){ try{ cardDrag.releasePointerCapture(e.pointerId); }catch(err){} }
  if(!dragState) return;
  const {curX, moved} = dragState;
  const wasTap = !moved;
  dragState = null;

  if(Math.abs(curX) > THRESHOLD){
    commit(curX > 0);
    return;
  }
  cardDrag.style.transition = 'transform .35s cubic-bezier(.2,.8,.2,1)';
  cardDrag.style.transform = '';
  washYes.style.opacity = 0;
  washNo.style.opacity = 0;

  if(wasTap){
    flipCard();
  }
}
cardDrag.addEventListener('pointerdown', onPointerDown);
cardDrag.addEventListener('pointermove', onPointerMove);
cardDrag.addEventListener('pointerup', onPointerUp);
cardDrag.addEventListener('pointercancel', onPointerUp);

// ---------- buttons / keyboard ----------
document.getElementById('back-btn').addEventListener('click', ()=> goHub());
document.getElementById('hub-back-btn').addEventListener('click', ()=> goHome());
document.getElementById('grid-back-btn').addEventListener('click', ()=> goHub());

document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape'){
    // Card gestures (flip / mark remembered) only apply while actively studying.
    if(screenStudy.classList.contains('active') && summaryEl.hidden){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); flipCard(); return; }
      if(e.key === 'ArrowRight'){ commit(true); return; }
      if(e.key === 'ArrowLeft'){ commit(false); return; }
    }
    return;
  }
  // Escape steps back one level: Grid/Study -> Hub -> Home.
  if(screenGrid.classList.contains('active')){ goHub(); return; }
  if(screenHub.classList.contains('active')){ goHome(); return; }
  if(screenStudy.classList.contains('active')){ goHub(); return; }
});

// ---------- go ----------
renderLevelTabs();
renderDeckList();
</script>
