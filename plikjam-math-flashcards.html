<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F7FB">
<title>พลิกจำ · การ์ดทบทวนคณิตศาสตร์</title>
<meta name="description" content="แอปการ์ดทบทวนบทเรียนคณิตศาสตร์ พลิกดูคำตอบ แล้วปัดบอกว่าจำได้หรือยังไม่ได้">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<!-- KaTeX: ใช้แสดงสมการคณิตศาสตร์ (LaTeX) บนหน้าการ์ด -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

<style>
  :root{
    /* ---- โทนสี: กระดาษตารางสมุดคณิตศาสตร์ ---- */
    --paper:#F3F7FB;
    --paper-alt:#E9F0F8;
    --paper-card-front:#FFFFFF;
    --paper-card-back:#FCFBF5;
    --grid-line: rgba(43,79,203,.07);
    --margin-rule: rgba(201,70,58,.35);

    --ink:#1E2A44;
    --ink-soft:#5B6B85;
    --ink-faint:#93A1B8;

    --brand:#2B4FCB;
    --brand-dark:#1D3796;

    --yes:#1E8F63;
    --yes-soft:#E4F5EC;
    --no:#C9463A;
    --no-soft:#FBEAE7;

    --lvl-prathom:#DB7A34;
    --lvl-prathom-soft:#FBECDE;
    --lvl-matton:#1F8C7D;
    --lvl-matton-soft:#E1F3EF;
    --lvl-matplai:#6E4FC4;
    --lvl-matplai-soft:#ECE6FA;

    --shadow: 0 18px 40px rgba(30,42,68,.16);

    --font-display:'Bai Jamjuree','Noto Sans Thai',sans-serif;
    --font-body:'Sarabun','Noto Sans Thai',sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }

  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  button{font:inherit; color:inherit;}
  svg{display:block;}
  /* บาง element ด้านล่างมีกฎ display เป็นของตัวเอง (เช่น flex) ซึ่งจะชนะกฎ
     display:none ของแอตทริบิวต์ hidden โดยปริยาย จึงบังคับด้วย !important ตรงนี้ */
  [hidden]{display:none !important;}

  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/100% 30px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/30px 100%,
      var(--paper);
    height:100vh; height:100dvh; width:100%;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  #app{
    position:relative;
    width:100%; height:100%;
    max-width:640px;
    margin:0 auto;
  }
  #app::before{
    content:'';
    position:absolute; top:0; bottom:0; left:14px;
    width:1.5px; background:var(--margin-rule);
    pointer-events:none; z-index:0;
  }

  .screen{
    position:absolute; inset:0;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; align-items:center;
    padding:26px 20px 40px;
    opacity:0; pointer-events:none; transform:translateY(10px);
    transition:opacity .35s ease, transform .35s ease;
  }
  .screen.active{opacity:1; pointer-events:auto; transform:translateY(0);}

  button:focus-visible, .deck-tile:focus-visible{
    outline:3px solid var(--brand); outline-offset:3px; border-radius:10px;
  }

  /* ================= HOME ================= */
  .home-scroll{width:100%; max-width:520px;}

  .brand-mark{
    font-family:var(--font-display); font-weight:700; font-size:13px;
    letter-spacing:.02em; color:var(--ink-soft); margin:0;
  }
  .brand-mark b{color:var(--brand); font-weight:700;}

  .eyebrow{
    font-family:var(--font-mono); font-size:11px; font-weight:700;
    letter-spacing:.08em; color:var(--brand); margin:16px 0 6px;
  }
  .title{
    font-family:var(--font-display); font-weight:600;
    font-size:clamp(24px,6vw,32px); color:var(--ink); margin:0 0 8px;
  }
  .lede{
    font-family:var(--font-body); font-size:14.5px; color:var(--ink-soft);
    margin:0; line-height:1.6; max-width:420px;
  }

  .level-filter{
    display:flex; gap:8px; overflow-x:auto; padding:4px 2px 6px;
    margin:20px 0 22px;
  }
  .chip{
    flex:0 0 auto; font-family:var(--font-body); font-weight:600; font-size:13.5px;
    padding:8px 16px; border-radius:999px; border:1.5px solid rgba(30,42,68,.14);
    background:#fff; color:var(--ink-soft); cursor:pointer;
    transition:background .2s, border-color .2s, color .2s, transform .15s;
  }
  .chip:hover{transform:translateY(-1px);}
  .chip.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  .chip.lvl-prathom.active{background:var(--lvl-prathom); border-color:var(--lvl-prathom);}
  .chip.lvl-matton.active{background:var(--lvl-matton); border-color:var(--lvl-matton);}
  .chip.lvl-matplai.active{background:var(--lvl-matplai); border-color:var(--lvl-matplai);}
  .chip.empty{opacity:.45;}

  .deck-list{display:flex; flex-direction:column; gap:24px; padding-bottom:30px;}
  .empty-note{font-size:14px; color:var(--ink-faint); padding:20px 4px;}

  .deck-tile{
    position:relative; width:100%; display:flex; align-items:center; gap:14px;
    text-align:left; padding:20px 20px; border-radius:18px;
    border:1.5px solid rgba(30,42,68,.10); border-left:5px solid transparent;
    background:var(--paper-card-front); cursor:pointer;
    box-shadow:0 10px 24px rgba(30,42,68,.08);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .deck-tile:hover{transform:translateY(-3px); box-shadow:0 16px 32px rgba(30,42,68,.14);}
  .deck-tile:active{transform:translateY(0);}
  .deck-tile::before,.deck-tile::after{
    content:''; position:absolute; inset:0; border-radius:inherit;
    background:var(--paper-alt); border:1.5px solid rgba(30,42,68,.08); z-index:-1;
  }
  .deck-tile::before{transform:rotate(-2.2deg) translateY(4px);}
  .deck-tile::after{transform:rotate(1.8deg) translateY(7px); opacity:.65;}
  .deck-tile.lvl-prathom{border-left-color:var(--lvl-prathom);}
  .deck-tile.lvl-matton{border-left-color:var(--lvl-matton);}
  .deck-tile.lvl-matplai{border-left-color:var(--lvl-matplai);}

  .deck-info{flex:1; display:flex; flex-direction:column; gap:9px; min-width:0;}
  .deck-topic{font-family:var(--font-display); font-weight:600; font-size:18px; color:var(--ink);}
  .deck-meta{display:flex; align-items:center; gap:10px;}
  .deck-count{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);}
  .deck-arrow{font-size:18px; color:var(--ink-faint); flex:0 0 auto;}

  .level-pill{
    font-family:var(--font-mono); font-size:11px; font-weight:700;
    padding:4px 10px; border-radius:999px; white-space:nowrap;
  }
  .level-pill.lvl-prathom{background:var(--lvl-prathom-soft); color:var(--lvl-prathom);}
  .level-pill.lvl-matton{background:var(--lvl-matton-soft); color:var(--lvl-matton);}
  .level-pill.lvl-matplai{background:var(--lvl-matplai-soft); color:var(--lvl-matplai);}

  /* ================= STUDY ================= */
  /* หน้าทบทวนต้องพอดีจอเสมอ ไม่ต้องเลื่อนขึ้นลง จึงปิด scroll ของหน้าจอนี้
     แล้วให้ header / progress / การ์ด / hint แบ่งพื้นที่กันเองด้วย flex */
  #screen-study{
    overflow:hidden;
    padding:16px 20px 14px;
  }

  .study-header{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; max-width:420px; margin-bottom:12px; flex:0 0 auto;
  }
  .back-btn{
    display:flex; align-items:center; gap:6px; background:none; border:none;
    font-family:var(--font-body); font-weight:600; font-size:14px;
    color:var(--ink-soft); cursor:pointer; padding:6px 4px;
  }
  .back-btn:hover{color:var(--brand);}
  .study-crumb{
    font-family:var(--font-body); font-size:13px; color:var(--ink-soft);
    display:flex; align-items:center; gap:8px;
  }
  .study-crumb-dot{opacity:.5;}

  .session-view{
    width:100%; height:100%; min-height:0;
    display:flex; flex-direction:column; align-items:center; flex:1;
  }

  .progress-row{
    display:flex; align-items:center; gap:12px;
    width:100%; max-width:380px; margin-bottom:12px; flex:0 0 auto;
  }
  .progress-text{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); white-space:nowrap;}
  .progress-track{
    flex:1; height:6px; border-radius:999px; background:rgba(30,42,68,.09);
    overflow:hidden; position:relative;
  }
  .progress-fill{height:100%; background:var(--brand); border-radius:999px; transition:width .4s ease;}

  .stage{
    position:relative; width:100%; min-height:0;
    display:flex; align-items:center; justify-content:center;
    flex:1; padding:2px 0;
  }

  .card-shadow-1,.card-shadow-2,.card-drag{
    width:min(86vw,340px); height:100%; max-height:420px;
  }
  .card-shadow-1,.card-shadow-2{
    position:absolute; border-radius:20px; background:var(--paper-alt);
    border:1.5px solid rgba(30,42,68,.08);
  }
  .card-shadow-1{transform:rotate(-3deg) translateY(6px);}
  .card-shadow-2{transform:rotate(3deg) translateY(10px); opacity:.7;}

  .card-drag{
    position:relative; z-index:2;
    perspective:1400px; cursor:grab; touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  .card-drag:active{cursor:grabbing;}

  .card-flip{
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .card-flip.flipped{transform:rotateY(180deg);}

  .card-face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:20px; box-shadow:var(--shadow); border:1.5px solid rgba(30,42,68,.10);
    padding:18px 18px 14px; display:flex; flex-direction:column;
  }
  .card-front{background:var(--paper-card-front);}
  .card-back{background:var(--paper-card-back); transform:rotateY(180deg);}

  .face-tag{
    align-self:flex-start; font-family:var(--font-mono); font-size:11px; font-weight:700;
    padding:4px 10px; border-radius:999px; margin-bottom:12px; background:var(--paper-alt); color:var(--ink-soft);
  }
  .face-tag-answer{background:var(--yes-soft); color:var(--yes);}

  .face-content{
    flex:1; overflow-y:auto; display:flex; align-items:center; justify-content:center;
    text-align:center; font-family:var(--font-body); font-size:clamp(15px,4vw,17.5px);
    line-height:1.65; padding:4px 2px; color:var(--ink);
  }
  .face-content strong{color:var(--brand-dark);}

  /* KaTeX เปิดใช้การตัดบรรทัดอัตโนมัติกลางสมการโดย default เพื่อให้ข้อความยาว ๆ
     ขึ้นบรรทัดใหม่ได้ — แต่ในการ์ดแคบ ๆ นี้ทำให้สมการสั้น ๆ ถูกตัดครึ่งกลางบรรทัด
     (เช่น A ⊆ ตกไปอีกบรรทัดแยกจาก B) จึงบังคับให้แต่ละสมการอยู่บรรทัดเดียวเสมอ */
  .katex{white-space:nowrap;}
  .face-content{overflow-x:auto;}

  .tikz-holder{margin-top:8px; display:flex; justify-content:center; width:100%;}
  .tikz-holder svg{max-width:100%; height:auto;}

  .face-hint{
    margin-top:auto; padding-top:10px; font-size:12.5px; color:var(--ink-faint); text-align:center;
  }

  .stamp{position:absolute; top:14px; width:60px; height:60px; opacity:0; pointer-events:none; z-index:5;}
  .stamp-yes{right:14px;}
  .stamp-no{left:14px;}
  .stamp path{fill:none; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:1;}
  .stamp-yes path{stroke:var(--yes);}
  .stamp-no path{stroke:var(--no);}
  .stamp.draw path{transition:stroke-dashoffset .35s ease; stroke-dashoffset:0;}

  .hint-row{
    display:flex; justify-content:space-between; align-items:center; gap:14px;
    width:100%; max-width:380px; margin-top:6px; flex:0 0 auto;
    opacity:.35; pointer-events:none; transition:opacity .3s;
  }
  .hint-row.active{opacity:1; pointer-events:auto;}
  .hint-btn{
    background:none; border:none; font-family:var(--font-body); font-size:13px;
    cursor:pointer; padding:8px 4px; transition:transform .15s;
  }
  .hint-btn strong{font-weight:700;}
  .hint-no{color:var(--no);}
  .hint-yes{color:var(--yes);}
  .hint-btn.active{transform:scale(1.08);}

  /* ================= SUMMARY ================= */
  /* เมื่อทบทวนครบสำรับ การ์ดจริง (card-drag) จะถูกซ่อน เหลือแต่กองการ์ดเปล่า
     (card-shadow-1/2) เป็นฉากหลัง แล้ววางข้อความสรุป + ปุ่มต่าง ๆ ซ้อนทับลงไป
     ตรงกลางกองการ์ดนั้นแทน คล้ายมีการ์ดใบสุดท้ายที่ "เปล่า" รอข้อความอยู่ */
  .summary-view{
    position:absolute; inset:0; z-index:3;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; padding:18px; text-align:center;
  }
  .summary-mark{width:52px; height:52px; margin-bottom:2px; flex:0 0 auto;}
  .summary-mark path{
    fill:none; stroke:var(--yes); stroke-width:9; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:1; stroke-dashoffset:1; animation:drawcheck .6s ease .15s forwards;
  }
  @keyframes drawcheck{to{stroke-dashoffset:0;}}

  .summary-title{font-family:var(--font-display); font-weight:600; font-size:clamp(18px,4.6vw,22px); color:var(--ink); margin:0;}
  .summary-stat{font-family:var(--font-body); font-size:14px; color:var(--ink-soft); margin:0;}
  .summary-praise{font-family:var(--font-body); font-size:13px; color:var(--yes); margin:0;}

  .summary-actions{
    display:flex; flex-direction:column; gap:8px;
    width:100%; max-width:300px; margin-top:8px; flex:0 1 auto; overflow-y:auto;
  }

  .btn{
    font-family:var(--font-display); font-weight:600; font-size:14.5px;
    padding:11px 22px; border-radius:14px; border:none; cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease; flex:0 0 auto;
  }
  .btn-primary{background:var(--brand); color:#fff; box-shadow:0 10px 24px rgba(43,79,203,.28);}
  .btn-primary:hover{transform:translateY(-2px);}
  .btn-ghost{background:transparent; border:1.5px solid rgba(30,42,68,.18); color:var(--ink);}
  .btn-ghost:hover{border-color:var(--brand); color:var(--brand);}

  @media (min-width:640px){
    .screen{padding-top:44px;}
  }

  @media (prefers-reduced-motion:reduce){
    .screen,.card-flip,.card-drag,.deck-tile,.chip,.btn,.progress-fill,.stamp path,.summary-mark path{
      transition:none !important; animation:none !important; stroke-dashoffset:0 !important;
    }
  }
</style>
</head>
<body>
<noscript>ต้องเปิดใช้งาน JavaScript เพื่อใช้งานแอปนี้</noscript>

<div id="app">

  <!-- ================= HOME ================= -->
  <section class="screen active" id="screen-home">
    <div class="home-scroll">
      <p class="brand-mark">พลิก<b>จำ</b></p>
      <p class="eyebrow">สำรับทบทวนคณิตศาสตร์</p>
      <h1 class="title">เลือกสำรับที่จะทบทวน</h1>
      <p class="lede">พลิกการ์ด ลองนึกคำตอบในใจก่อน แล้วปัดบอกว่าจำได้ไหม</p>

      <div class="level-filter" role="tablist" aria-label="กรองตามระดับชั้น" id="level-filter"></div>
      <div class="deck-list" id="deck-list"></div>
    </div>
  </section>

  <!-- ================= STUDY ================= -->
  <section class="screen" id="screen-study">
    <div class="study-header">
      <button class="back-btn" id="btn-back-home" type="button" aria-label="กลับหน้าหลัก">← กลับ</button>
      <div class="study-crumb">
        <span id="study-topic">—</span>
        <span class="study-crumb-dot">·</span>
        <span id="study-level" class="level-pill">—</span>
      </div>
    </div>

    <!-- ระหว่างทบทวน -->
    <div class="session-view" id="session-view">
      <div class="progress-row" id="progress-row">
        <span class="progress-text" id="progress-text">ใบที่ 1 จาก 1</span>
        <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      </div>

      <div class="stage">
        <div class="card-shadow-2" aria-hidden="true"></div>
        <div class="card-shadow-1" aria-hidden="true"></div>
        <div class="card-drag" id="card-drag" role="button" tabindex="0" aria-label="การ์ดคำถาม แตะเพื่อดูคำตอบ">
          <div class="card-flip" id="card-flip">
            <div class="card-face card-front">
              <span class="face-tag" id="front-level-tag">—</span>
              <div class="face-content" id="front-content"></div>
              <span class="face-hint">แตะการ์ดเพื่อดูคำตอบ</span>
            </div>
            <div class="card-face card-back">
              <span class="face-tag face-tag-answer">คำตอบ</span>
              <div class="face-content" id="back-content"></div>
            </div>
          </div>
          <svg class="stamp stamp-yes" viewBox="0 0 100 100" aria-hidden="true">
            <path pathLength="1" d="M20,55 L42,75 L82,25"/>
          </svg>
          <svg class="stamp stamp-no" viewBox="0 0 100 100" aria-hidden="true">
            <path pathLength="1" d="M25,25 L75,75"/>
            <path pathLength="1" d="M75,25 L25,75"/>
          </svg>
        </div>

        <!-- สรุปผลจบสำรับ: ซ้อนทับอยู่บนกองการ์ดเปล่า (card-shadow) ด้านบน -->
        <div class="summary-view" id="summary-view" hidden>
          <svg class="summary-mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M20,55 L42,75 L82,25"/></svg>
          <h2 class="summary-title">ทบทวนครบสำรับแล้ว</h2>
          <p class="summary-stat" id="summary-stat">จำได้ 0 จาก 0 ใบ</p>
          <p class="summary-praise" id="summary-praise" hidden>เก่งมาก! จำได้ครบทุกใบ 🌟</p>
          <div class="summary-actions" id="summary-actions"></div>
        </div>
      </div>

      <div class="hint-row" id="hint-row">
        <button type="button" class="hint-btn hint-no" id="hint-no">← <strong>ยังจำไม่ได้</strong> ปัดไปทางซ้าย</button>
        <button type="button" class="hint-btn hint-yes" id="hint-yes"><strong>จำได้</strong> ปัดไปทางขวา →</button>
      </div>
    </div>
  </section>

</div>

<!-- KaTeX: render สมการคณิตศาสตร์ -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

<script>
/* ================================================================
   วิธีเพิ่ม / แก้ไขการ์ด (สำหรับครูผู้สอน)
   ----------------------------------------------------------------
   เพิ่มการ์ดใหม่ได้โดยเพิ่มอ็อบเจกต์ลงในลิสต์ CARDS ด้านล่างนี้
   แต่ละการ์ดมีช่องข้อมูลดังนี้:

     topic  : ชื่อหัวข้อ (string)
              ถ้าใช้ชื่อหัวข้อใหม่ที่ยังไม่เคยมี ระบบจะสร้าง "สำรับ" ใหม่
              ขึ้นในหน้าแรกให้อัตโนมัติ ไม่ต้องแก้โค้ดส่วนอื่นเลย
     level  : ระดับชั้น ต้องเป็นค่าใดค่าหนึ่งเท่านั้น (การ์ด 1 ใบมีได้ 1 ระดับ)
              'ประถม' | 'ม.ต้น' | 'ม.ปลาย'
     front  : ข้อความด้านหน้าการ์ด (โจทย์ / คำถาม)
     back   : ข้อความด้านหลังการ์ด (คำตอบ / คำอธิบาย)
     frontTikz, backTikz : (ไม่บังคับ) โค้ด TikZ ล้วน ๆ สำหรับวาดรูป
              เรขาคณิต/แผนภาพ แนบไว้กับหน้านั้น ๆ (ไม่ต้องมี
              \documentclass หรือ \begin{document} — ใส่แค่เนื้อหาใน
              tikzpicture) ดูตัวอย่างในการ์ดใบที่ 2 ของหัวข้อ "เซต"

   การใส่สมการคณิตศาสตร์ในข้อความ front / back:
     - สมการในบรรทัด พิมพ์คั่นด้วย $...$  เช่น "พื้นที่วงกลมคือ $A=\\pi r^2$"
     - สมการเดี่ยวเต็มบรรทัด ใช้ $$...$$
     - ขึ้นบรรทัดใหม่ พิมพ์ \n ได้ตามปกติ
     - ทำตัวหนา ครอบคำด้วย **สองดอกจัน**
   ================================================================ */

  const CARDS = [
    // ---------- หัวข้อ: เซต (ม.ปลาย) ----------
    {
      topic: 'เซต',
      level: 'ม.ปลาย',
      front: 'ถ้า $A \\subseteq B$ และ $B \\subseteq A$ แล้วเซต A กับ B มีความสัมพันธ์กันอย่างไร?',
      back: '$A = B$\nเพราะสมาชิกทุกตัวใน A อยู่ใน B และสมาชิกทุกตัวใน B ก็อยู่ใน A ด้วย จึงเป็นเซตเดียวกัน',
    },
    {
      topic: 'เซต',
      level: 'ม.ปลาย',
      front: 'จากแผนภาพเวนน์ต่อไปนี้ จงหา $A \\cap B$',
      frontTikz: `\\begin{tikzpicture}
\\draw (0,0) circle (1.4);
\\draw (1.4,0) circle (1.4);
\\node at (-0.9,1.55) {A};
\\node at (2.3,1.55) {B};
\\node at (-0.7,0.3) {1};
\\node at (-0.7,-0.3) {2};
\\node at (0.7,0) {3};
\\node at (2.1,0.3) {4};
\\node at (2.1,-0.3) {5};
\\end{tikzpicture}`,
      back: '$A \\cap B = \\{3\\}$\nเพราะ 3 คือสมาชิกที่อยู่ในวงกลม A และวงกลม B พร้อมกัน (บริเวณที่ซ้อนทับ)',
    },

    // ---------- หัวข้อ: จำนวนเต็ม (ม.ต้น) ----------
    {
      topic: 'จำนวนเต็ม',
      level: 'ม.ต้น',
      front: 'จงหาผลลัพธ์: $(-8) + (-5)$',
      back: '$-13$\nจำนวนลบบวกกับจำนวนลบ ให้นำค่าสัมบูรณ์มาบวกกัน แล้วใส่เครื่องหมายลบ',
    },
    {
      topic: 'จำนวนเต็ม',
      level: 'ม.ต้น',
      front: 'จำนวนลบ × จำนวนลบ ได้ผลลัพธ์เป็นเครื่องหมายใด?',
      back: '**เป็นบวกเสมอ**\nเช่น $(-4) \\times (-3) = 12$',
    },

    // ---------- หัวข้อ: เศษส่วน (ประถม) ----------
    {
      topic: 'เศษส่วน',
      level: 'ประถม',
      front: 'บวกเศษส่วนนี้: $\\dfrac{1}{4} + \\dfrac{1}{2}$',
      back: '$\\dfrac{3}{4}$\nทำส่วนให้เท่ากันก่อน: $\\dfrac{1}{4}+\\dfrac{2}{4}=\\dfrac{3}{4}$',
    },
    {
      topic: 'เศษส่วน',
      level: 'ประถม',
      front: '$\\dfrac{6}{8}$ ทำให้เป็นเศษส่วนอย่างต่ำแล้วได้เท่าใด?',
      back: '$\\dfrac{3}{4}$\nหารทั้งเศษและส่วนด้วย ห.ร.ม. คือ 2',
    },
  ];

/* ================================================================
   จบส่วนข้อมูลการ์ด — ด้านล่างนี้เป็นโค้ดการทำงานของแอป ไม่ต้องแก้ไข
   ================================================================ */

  const LEVELS = ['ประถม','ม.ต้น','ม.ปลาย'];

  function levelClass(level){
    if(level==='ประถม') return 'lvl-prathom';
    if(level==='ม.ต้น') return 'lvl-matton';
    if(level==='ม.ปลาย') return 'lvl-matplai';
    return '';
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function formatFace(raw){
    let out = escapeHtml(raw);
    out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/\n/g, '<br>');
    return out;
  }
  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
  function deckCardsFor(topic){ return CARDS.filter(c => c.topic === topic); }
  function getDecks(){
    const map = new Map();
    CARDS.forEach(c=>{
      if(!map.has(c.topic)) map.set(c.topic, {topic:c.topic, level:c.level, count:0});
      map.get(c.topic).count++;
    });
    return [...map.values()];
  }

  // ---------- lazy-load TikZJax เฉพาะตอนมีการ์ดที่ใช้ TikZ จริง ----------
  let tikzLoading = null;
  function ensureTikzJax(){
    if(window.__tikzjaxLoaded || tikzLoading) return tikzLoading;
    tikzLoading = new Promise((resolve)=>{
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://cdn.jsdelivr.net/npm/@rod2ik/tikzjax/dist/fonts.min.css';
      document.head.appendChild(link);
      const scr = document.createElement('script');
      scr.src = 'https://cdn.jsdelivr.net/npm/@rod2ik/tikzjax/dist/tikzjax.min.js';
      scr.onload = ()=>{ window.__tikzjaxLoaded = true; resolve(); };
      scr.onerror = ()=>{ resolve(); };
      document.head.appendChild(scr);
    });
    return tikzLoading;
  }

  function renderFace(el, card, isFront){
    const text = isFront ? card.front : card.back;
    const tikz = isFront ? card.frontTikz : card.backTikz;
    el.innerHTML = formatFace(text);
    if(tikz){
      ensureTikzJax();
      const holder = document.createElement('div');
      holder.className = 'tikz-holder';
      const scriptEl = document.createElement('script');
      scriptEl.type = 'text/tikz';
      scriptEl.textContent = tikz;
      holder.appendChild(scriptEl);
      el.appendChild(holder);
    }
    if(window.renderMathInElement){
      window.renderMathInElement(el, {
        delimiters:[
          {left:'$$', right:'$$', display:true},
          {left:'$', right:'$', display:false},
        ],
        throwOnError:false,
      });
    }
  }

  // ---------- DOM refs ----------
  const levelFilterEl = document.getElementById('level-filter');
  const deckListEl = document.getElementById('deck-list');
  const studyTopicEl = document.getElementById('study-topic');
  const studyLevelEl = document.getElementById('study-level');
  const summaryView = document.getElementById('summary-view');
  const progressRowEl = document.getElementById('progress-row');
  const progressText = document.getElementById('progress-text');
  const progressFill = document.getElementById('progress-fill');
  const frontLevelTag = document.getElementById('front-level-tag');
  const frontContentEl = document.getElementById('front-content');
  const backContentEl = document.getElementById('back-content');
  const cardDragEl = document.getElementById('card-drag');
  const cardFlipEl = document.getElementById('card-flip');
  const stampYes = document.querySelector('.stamp-yes');
  const stampNo = document.querySelector('.stamp-no');
  const hintRow = document.getElementById('hint-row');
  const hintNoBtn = document.getElementById('hint-no');
  const hintYesBtn = document.getElementById('hint-yes');
  const summaryStat = document.getElementById('summary-stat');
  const summaryPraise = document.getElementById('summary-praise');
  const summaryActions = document.getElementById('summary-actions');
  const screenHome = document.getElementById('screen-home');
  const screenStudy = document.getElementById('screen-study');

  // ---------- state ----------
  let activeFilter = 'all';
  let currentTopic = null;
  let sessionCards = [];
  let sessionIndex = 0;
  let remembered = [];
  let forgotten = [];
  let cardRevealed = false;
  let animating = false;
  let dragState = null;

  function showScreen(name){
    screenHome.classList.toggle('active', name === 'home');
    screenStudy.classList.toggle('active', name === 'study');
  }

  // ---------- หน้าแรก: สำรับ + ตัวกรองระดับชั้น ----------
  function renderLevelFilter(){
    const decks = getDecks();
    const counts = {};
    LEVELS.forEach(l => counts[l] = decks.filter(d => d.level === l).length);

    const chips = [{key:'all', label:'ทั้งหมด'}, ...LEVELS.map(l => ({key:l, label:l}))];
    levelFilterEl.innerHTML = '';
    chips.forEach(chip=>{
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.setAttribute('role','tab');
      btn.setAttribute('aria-selected', activeFilter === chip.key ? 'true' : 'false');
      let cls = 'chip';
      if(chip.key !== 'all') cls += ' ' + levelClass(chip.key);
      if(activeFilter === chip.key) cls += ' active';
      if(chip.key !== 'all' && counts[chip.key] === 0) cls += ' empty';
      btn.className = cls;
      btn.textContent = chip.label;
      btn.addEventListener('click', ()=>{
        activeFilter = chip.key;
        renderLevelFilter();
        renderDeckList();
      });
      levelFilterEl.appendChild(btn);
    });
  }

  function renderDeckList(){
    const decks = getDecks().filter(d => activeFilter === 'all' || d.level === activeFilter);
    deckListEl.innerHTML = '';
    if(!decks.length){
      const p = document.createElement('p');
      p.className = 'empty-note';
      p.textContent = 'ยังไม่มีสำรับในระดับนี้';
      deckListEl.appendChild(p);
      return;
    }
    decks.forEach(deck=>{
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'deck-tile ' + levelClass(deck.level);
      tile.innerHTML =
        '<span class="deck-info">' +
          '<span class="deck-topic">' + escapeHtml(deck.topic) + '</span>' +
          '<span class="deck-meta">' +
            '<span class="level-pill ' + levelClass(deck.level) + '">' + escapeHtml(deck.level) + '</span>' +
            '<span class="deck-count">' + deck.count + ' ใบ</span>' +
          '</span>' +
        '</span>' +
        '<span class="deck-arrow" aria-hidden="true">→</span>';
      tile.addEventListener('click', ()=> startDeck(deck.topic));
      deckListEl.appendChild(tile);
    });
  }

  // ---------- เซสชันทบทวน ----------
  function startDeck(topic){
    currentTopic = topic;
    sessionCards = shuffle(deckCardsFor(topic).slice());
    sessionIndex = 0; remembered = []; forgotten = [];

    const level = sessionCards[0] ? sessionCards[0].level : '';
    studyTopicEl.textContent = topic;
    studyLevelEl.textContent = level;
    studyLevelEl.className = 'level-pill ' + levelClass(level);

    showSessionCard();
    showScreen('study');
  }

  function showSessionCard(){
    cardRevealed = false;
    animating = false;
    cardFlipEl.classList.remove('flipped');
    cardDragEl.style.transition = 'none';
    cardDragEl.style.transform = '';
    cardDragEl.style.opacity = '1';
    stampYes.classList.remove('draw'); stampYes.style.opacity = 0;
    stampNo.classList.remove('draw'); stampNo.style.opacity = 0;
    hintRow.classList.remove('active');
    hintNoBtn.classList.remove('active');
    hintYesBtn.classList.remove('active');

    // กลับสู่สถานะกำลังทบทวน: โชว์การ์ดจริง + แถบความคืบหน้า + hint ซ้อนทับอีกครั้ง
    progressRowEl.hidden = false;
    hintRow.hidden = false;
    cardDragEl.hidden = false;
    summaryView.hidden = true;

    const card = sessionCards[sessionIndex];
    frontLevelTag.textContent = card.level;
    frontLevelTag.className = 'face-tag ' + levelClass(card.level);
    renderFace(frontContentEl, card, true);
    renderFace(backContentEl, card, false);

    progressText.textContent = 'ใบที่ ' + (sessionIndex + 1) + ' จาก ' + sessionCards.length;
    progressFill.style.width = (sessionIndex / sessionCards.length) * 100 + '%';

    void cardDragEl.offsetWidth;
    cardDragEl.style.transition = '';
  }

  function flipCard(){
    if(cardRevealed || animating) return;
    cardRevealed = true;
    cardFlipEl.classList.add('flipped');
    hintRow.classList.add('active');
  }

  function commit(isYes){
    if(animating || !cardRevealed) return;
    animating = true;
    const dir = isYes ? 1 : -1;
    const dy = dragState ? dragState.curY : 0;
    cardDragEl.style.transition = 'transform .4s cubic-bezier(.2,.8,.2,1), opacity .4s ease';
    cardDragEl.style.transform = 'translate(' + (dir * (window.innerWidth || 600)) + 'px,' + dy + 'px) rotate(' + (dir*22) + 'deg)';
    cardDragEl.style.opacity = '0';
    const stampEl = isYes ? stampYes : stampNo;
    stampEl.style.opacity = '1';
    stampEl.classList.add('draw');

    const card = sessionCards[sessionIndex];
    (isYes ? remembered : forgotten).push(card);

    setTimeout(()=>{
      sessionIndex++;
      if(sessionIndex < sessionCards.length){
        showSessionCard();
      } else {
        showSummary();
      }
    }, 420);
  }

  function showSummary(){
    // ซ่อนการ์ดจริง + แถบความคืบหน้า + hint ให้เหลือแต่กองการ์ดเปล่า
    // (card-shadow) เป็นฉากหลัง แล้วค่อยโชว์ข้อความสรุปซ้อนทับลงไปแทน
    progressRowEl.hidden = true;
    hintRow.hidden = true;
    cardDragEl.hidden = true;
    summaryView.hidden = false;

    summaryStat.textContent = 'จำได้ ' + remembered.length + ' จาก ' + sessionCards.length + ' ใบ';
    summaryPraise.hidden = !(sessionCards.length > 0 && forgotten.length === 0);

    summaryActions.innerHTML = '';
    if(forgotten.length){
      summaryActions.appendChild(makeBtn(
        'ทบทวนเฉพาะที่ยังไม่จำ (' + forgotten.length + ' ใบ)', 'btn btn-primary',
        ()=>{
          sessionCards = shuffle(forgotten.slice());
          sessionIndex = 0; remembered = []; forgotten = [];
          showSessionCard();
        }
      ));
    }
    summaryActions.appendChild(makeBtn(
      'สับสำรับใหม่ทั้งหมด', forgotten.length ? 'btn btn-ghost' : 'btn btn-primary',
      ()=>{
        sessionCards = shuffle(deckCardsFor(currentTopic));
        sessionIndex = 0; remembered = []; forgotten = [];
        showSessionCard();
      }
    ));
    summaryActions.appendChild(makeBtn('กลับหน้าหลัก', 'btn btn-ghost', ()=> showScreen('home')));
  }

  function makeBtn(label, cls, onClick){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = cls;
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  // ---------- ลาก / ปัดการ์ด ----------
  const THRESHOLD = 90;

  function onPointerDown(e){
    if(animating) return;
    dragState = {startX:e.clientX, startY:e.clientY, curX:0, curY:0, moved:false};
    try{ cardDragEl.setPointerCapture(e.pointerId); }catch(err){}
    cardDragEl.style.transition = 'none';
  }
  function onPointerMove(e){
    if(!dragState) return;
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    dragState.curX = dx; dragState.curY = dy;
    if(Math.abs(dx) > 6 || Math.abs(dy) > 6) dragState.moved = true;
    if(cardRevealed){
      const rot = dx / 18;
      cardDragEl.style.transform = 'translate(' + dx + 'px,' + (dy*0.25) + 'px) rotate(' + rot + 'deg)';
      const ratio = clamp(dx / THRESHOLD, -1, 1);
      stampYes.style.opacity = Math.max(0, ratio);
      stampNo.style.opacity = Math.max(0, -ratio);
      hintYesBtn.classList.toggle('active', ratio > 0.15);
      hintNoBtn.classList.toggle('active', ratio < -0.15);
    }
  }
  function onPointerUp(){
    if(!dragState) return;
    const {curX, moved} = dragState;
    const wasTap = !moved;
    dragState = null;

    if(cardRevealed && Math.abs(curX) > THRESHOLD){
      commit(curX > 0);
      return;
    }
    cardDragEl.style.transition = 'transform .35s cubic-bezier(.2,.8,.2,1)';
    cardDragEl.style.transform = '';
    stampYes.style.opacity = 0;
    stampNo.style.opacity = 0;
    hintYesBtn.classList.remove('active');
    hintNoBtn.classList.remove('active');

    if(!cardRevealed && wasTap){
      flipCard();
    }
  }
  cardDragEl.addEventListener('pointerdown', onPointerDown);
  cardDragEl.addEventListener('pointermove', onPointerMove);
  cardDragEl.addEventListener('pointerup', onPointerUp);
  cardDragEl.addEventListener('pointercancel', onPointerUp);

  // ---------- ปุ่ม / คีย์บอร์ด ----------
  hintNoBtn.addEventListener('click', ()=>{ if(cardRevealed) commit(false); });
  hintYesBtn.addEventListener('click', ()=>{ if(cardRevealed) commit(true); });
  document.getElementById('btn-back-home').addEventListener('click', ()=> showScreen('home'));

  document.addEventListener('keydown', (e)=>{
    if(!screenStudy.classList.contains('active') || summaryView.hidden === false) {
      if(e.key === 'Escape' && screenStudy.classList.contains('active')) showScreen('home');
      return;
    }
    if(e.key === 'Escape'){ showScreen('home'); return; }
    if(!cardRevealed){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); flipCard(); }
      return;
    }
    if(e.key === 'ArrowRight') commit(true);
    if(e.key === 'ArrowLeft') commit(false);
  });

  // ---------- เริ่มต้น ----------
  renderLevelFilter();
  renderDeckList();
</script>
</body>
</html>
